    <style>

l / Compute / Memory / Storage Optimized。"},{term:"EBS vs Instance Store",desc:"`EBS` 是網路硬碟，可拔可留、重開機不消失；Instance Store 是掛在主機上的暫存硬碟，速度最快但**停機即資料消失**。"},{term:"Security Group",desc:"虛擬防火牆，綁在 instance 的網路介面上，控制誰可以連進來的 port。"},{term:"User Data",desc:"開機時執行一次的自動化腳本（bootstrap），常用來裝 web server、拉程式碼。"},{term:"Placement Group",desc:"決定機器實際擺在機房的位置：Cluster（同機櫃、低延遲）、Spread（分散、高可用）、Partition（分區、給 HDFS 這類）。"}],interactions:[{to:"ebs",dir:"both",how:"系統碟與資料碟都掛 EBS；EBS 的生命週期可以跟 EC2 綁在一起（Delete on Termination）或獨立保留。"},{to:"s3",dir:"both",how:"EC2 讀寫 S3 上的靜態檔與備份；也可以把 S3 掛成檔案系統（Mountpoint for S3）。大量資料進出建議走 VPC Endpoint 避免 NAT 費用。"},{to:"auto-scaling",dir:"both",how:"ASG 依 CloudWatch 指標決定要開幾台 EC2，並用 Launch Template 決定新機器的規格。"},{to:"elb",dir:"in",how:"ALB / NLB 把流量分發到多台 EC2，並做 health check 剔除壞掉的機器。"},{to:"vpc",dir:"both",how:"EC2 跑在 VPC 的某個 subnet 裡，需要 Internet Gateway / NAT Gateway 才能對外，靠 Security Group 與 NACL 控管進出。"},{to:"iam",dir:"in",how:"掛 Instance Profile（IAM Role）後，程式就能用臨時憑證存取其他 AWS 服務，不必把 Access Key 寫在程式裡。"},{to:"cloudwatch",dir:"both",how:"EC2 自動送 CPU / Network 等指標到 CloudWatch，也能安裝 agent 送 log 與記憶體指標。"},{to:"route53",dir:"in",how:"用 A / Alias record 把網域指向 EC2 的 Elastic IP 或前面的負載平衡器。"}],settings:[{name:"Instance type / size",required:!0,desc:"先看瓶頸是 CPU 還是 RAM：t 系列有 burst 機制（CPU Credit），長期滿載會變慢，別拿 t3.micro 跑正式服務。"},{name:"AMI",required:!0,desc:"挑對 OS 與 Region 才有；自製 AMI 是最快的「黃金映像」做法。"},{name:"Security Group",required:!0,desc:"只開放必要 port（22 SSH、80/443 HTTP）。**不要**開 `0.0.0.0/0` 給 SSH。"},{name:"Public IP / Elastic IP",warn:!0,desc:"重開機會換 IP；需要固定 IP 請申請 Elastic IP，未掛在 running instance 上的 EIP 會被收費。"},{name:"EBS 加密 + Delete on Termination",warn:!0,desc:"加密建議預設開啟；系統碟預設會隨機器終止刪除，資料碟不會——設錯就是資料bye。"},{name:"Detailed monitoring",desc:"預設 5 分鐘一次指標；開啟後 1 分鐘一次（要加錢），做自動擴縮建議打開。"},{name:"User Data",desc:"只在**第一次**開機執行，之後重開不會再跑；要每次開機都跑請用 systemd 或 SSM。"},{name:"Purchasing option",warn:!0,desc:"On-Demand（貴、彈性）／Reserved & Savings Plans（1–3 年折扣 60%+）／Spot（便宜 90%，但隨時被回收）／Dedicated Host。"}],pricing:{model:"以**秒**計費（Linux 最低 60 秒），費用 = instance 時數 + EBS 容量 + 資料傳輸費。停機（stopped）不收運算費但仍收 EBS。",free:"免費方案：t2/t3.micro 每月 750 小時（新帳號 12 個月），搭配 30 GB EBS + 100 GB 對外流量。",rows:[{tier:"t3.micro（2 vCPU / 1 GB）",price:"$0.0104 / 小時",note:"約 $7.6/月。測試、小型網站的首選但 CPU 有 burst 限制。",level:1},{tier:"m6i.large（2 vCPU / 8 GB）",price:"$0.096 / 小時",note:"約 $70/月。通用型主力規格，正式環境的基準線。",level:2},{tier:"c6i.4xlarge（16 vCPU / 32 GB）",price:"$0.68 / 小時",note:"約 $500/月。運算密集型：影片轉檔、機器學習推論。",level:3},{tier:"Spot Instance 折扣",price:"省 ~70–90%",note:"用標價搶閒置容量，2 分鐘前通知就回收，適合可中斷的工作。",level:0},{tier:"資料傳輸 Out",price:"$0.09 / GB",note:"從 AWS 傳出到網際網路的費用，跨 AZ 也另計（$0.01/GB 各方向）。",level:2}],traps:["**跨 AZ 流量**也在收錢：EC2 傳到另一個 AZ 的 $0.01/GB 兩邊都收，架構設計能同 AZ 就同 AZ。","NAT Gateway 是**按小時 + 流量**計費（約 $0.045/hr + $0.045/GB），很多人帳單爆掉都是它，能用 VPC Endpoint 就走 Endpoint。","未掛載的 **Elastic IP** 每小時收費，忘了釋放會一直被收。","Shot down 的機器還是收 EBS 與快照費用，別以為「關機就免費」。"]},cli:["# 開一台 t3.micro（用預設 VPC 與最新 Amazon Linux）","aws ec2 run-instances \\","  --image-id ami-0abcdef1234567890 \\","  --instance-type t3.micro \\","  --key-name my-key --security-group-ids sg-012345 \\",'  --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=web-1}]"',"","# 連線與關機","ssh -i my-key.pem ec2-user@<public-ip>","aws ec2 stop-instances --instance-ids i-0123456789"],exam:["看到「**最高效能 / 最低延遲**」→ Cluster placement group；「**高可用 / 降低相關故障**」→ Spread。","看到「**便宜、可中斷、可重跑**」→ Spot；「**長期穩定、要折扣**」→ Reserved / Savings Plans。","Instance Store 資料**停機即消失**，適合暫存、buffer、快取。","EC2 加解密、跨帳號存取要用 IAM Role 而非 Access Key。","需要固定對外 IP → Elastic IP；需要固定對外連線但不接受外部主動連入 → NAT Gateway。"],gotchas:["把 Access Key 寫在 EC2 裡的程式碼 → 考試最愛考的反面示範，要用 IAM Role。","以為 `stopped` 不用錢：EBS、EIP、快照都還在收費。","User Data 只跑一次，重開機不會重跑。","同一台機器重開機（stop/start）**公有 IP 會變**。"],related:["ebs","auto-scaling","elb","vpc","lambda","fargate"]},{id:"lambda",name:"AWS Lambda",zh:"無伺服器函式運算",category:"compute",emoji:"⚡",tagline:"只寫函式、不用管機器：有事件才跑，跑完就關，按毫秒計費。",aliases:["serverless","function","無伺服器","函式","faas"],intro:["**Lambda** 讓你上傳一段程式（function），AWS 負責所有伺服器、擴縮、修補。它由**事件驅動**：S3 有新檔、SQS 有訊息、API Gateway 有 request、EventBridge 到時間，都會觸發 Lambda。","支援 Node.js、Python、Java、Go、.NET、Ruby 與容器映像。單次執行最長 **15 分鐘**、記憶體 128 MB–10 GB（記憶體越大 CPU 越多），執行環境會**無狀態**地重用。","Lambda 是「**用多少算多少**」的極致：沒有流量時成本趨近 0，非常適合突發、間歇、事件驅動的工作；但長時間滿載的服務反而比 EC2 貴。"],concepts:[{term:"Invocation 類型",desc:"`Synchronous`（API Gateway 等，等回應）、`Asynchronous`（S3/SNS 事件，重試 2 次後進 DLQ）、`Event Source Mapping`（SQS/Kinesis 輪詢）。"},{term:"Cold Start",desc:"新執行環境要初始化 runtime 與程式碼，會多耗數百毫秒；可用 **Provisioned Concurrency** 或 SnapStart 消除。"},{term:"Concurrency",desc:"同時執行的數量。預設每個 Region 1000，超過就 throttle；可設 **Reserved Concurrency** 保護下游或防爆預算。"},{term:"Execution Role",desc:"Lambda 的身分（IAM Role），決定它能不能寫 log、讀 S3、寫 DynamoDB。"},{term:"/tmp 空間",desc:"暫時儲存 512 MB–10 GB，只在該次執行環境存活，不保證跨次保留。"},{term:"Layers",desc:"把共用函式庫打包成層，多個 Lambda 共用，避免每包都肥。"}],interactions:[{to:"api-gateway",dir:"in",how:"API Gateway 收到 HTTP request 就同步呼叫 Lambda，是「無伺服器 API」的標準組合。"},{to:"s3",dir:"both",how:"S3 事件通知（新增 / 刪除物件）非同步觸發 Lambda；Lambda 也能反過來讀寫 S3 當作檔案儲存。"},{to:"dynamodb",dir:"both",how:"Lambda 讀寫 DynamoDB 當資料庫；DynamoDB Streams 也能觸發 Lambda 做變更處理。"},{to:"sqs",dir:"in",how:"用 Event Source Mapping 批次拉訊息（poll-based），失敗的訊息依 `maxReceiveCount` 進 DLQ。"},{to:"sns",dir:"in",how:"SNS 訂閱 Lambda，一次事件同時觸發多個函式（fan-out）。"},{to:"eventbridge",dir:"both",how:"EventBridge 規則可觸發 Lambda；Lambda 也能發出自訂事件。排程（cron）也常用 EventBridge。"},{to:"cloudwatch",dir:"out",how:"自動送 log 與指標（Invocations / Errors / Duration / Throttles），是觀察 Lambda 的唯一方式。"},{to:"vpc",dir:"both",how:"預設跑在 AWS 管理的網路；要連 RDS 等私有資源才放進 VPC（會需要 NAT 才能上網）。"},{to:"step-functions",dir:"both",how:"Step Functions 編排多個 Lambda 成工作流，處理重試、分支與長時間流程。"},{to:"iam",dir:"in",how:"每個函式都要一個 Execution Role；跨服務呼叫靠這組臨時憑證。"}],settings:[{name:"Memory (MB)",required:!0,desc:"128–10240 MB，**同時決定 CPU 效能**。調高記憶體常常反而變便宜（跑得快、時間短）。"},{name:"Timeout",required:!0,warn:!0,desc:"最長 900 秒（15 分鐘）。設太短會誤判失敗，設太長會讓 SQS 的重試卡住。"},{name:"Environment variables",desc:"放設定值；敏感資料請用 KMS 加密或直接從 Secrets Manager 讀。"},{name:"Reserved / Provisioned Concurrency",warn:!0,desc:"Reserved 用來限制上限（保護下游），Provisioned 用來預熱（消除 cold start，貴）。"},{name:"VPC / Subnet / SG",warn:!0,desc:"放進 VPC 後若 subnet 沒有 NAT Gateway，函式就**無法連外網**，這是最常見的踩雷。"},{name:"DLQ / Destinations",desc:"非同步失敗的訊息去處。用 Destinations 可以針對成功與失敗分別處理，比 DLQ 更有彈性。"},{name:"Runtime & Architecture",desc:"arm64（Graviton）比 x86 便宜約 20% 且更快，能用就用。"},{name:"Ephemeral storage",desc:"/tmp 預設 512 MB，可調到 10 GB（會加價）。"}],pricing:{model:"按**請求次數** + **GB-秒**（記憶體 × 執行時間）計費，每秒百萬次與 GB-秒的單價都很低，但量大時總額可觀。",free:"免費額度：每月 100 萬次請求 + 40 萬 GB-秒，永久有效（不是只有 12 個月）。",rows:[{tier:"請求數",price:"$0.20 / 100 萬次",note:"每月前 100 萬次免費。",level:0},{tier:"x86 運算",price:"$0.0000166667 / GB-秒",note:"1 GB 跑 1 秒 = $0.0000167，相當於每 100 萬次 × 1 秒約 $16.7。",level:2},{tier:"arm64 (Graviton) 運算",price:"約 8 折",note:"同規格便宜約 20%，且通常執行更快。",level:1},{tier:"Provisioned Concurrency",price:"$0.0000041667 / GB-秒",note:"額外收費且**一直計費**（不管你用不用），常讓帳單暴增。",level:4},{tier:"Ephemeral storage > 512 MB",price:"$0.0000000309 / GB-秒",note:"很少用，但大量平行執行時要留意。",level:1}],traps:["函式**等待下游**（例如同步等一個慢 API）的時間也算錢——時間就是金錢，在這裡是字面意思。","把 Lambda 放進 VPC 又忘了 NAT Gateway，會看到「連不上外部 API」的錯誤而不是帳單問題，但加 NAT 之後 NAT 費用反而變陷阱。","遞迴觸發（Lambda 寫 S3 → S3 觸發同一個 Lambda）會無限迴圈燒錢。","Provisioned Concurrency 沒關，閒置也照收費。"]},cli:["# 打包並部署（用 zip）","zip function.zip index.mjs","aws lambda create-function --function-name hello \\","  --runtime nodejs20.x --handler index.handler \\","  --role arn:aws:iam::123456789012:role/lambda-basic \\","  --zip-file fileb://function.zip --memory-size 512 --timeout 30","","aws lambda invoke --function-name hello out.json && cat out.json"],exam:["「**事件驅動、不常跑、突發流量**」→ Lambda；「長時間滿載、要控制底層」→ EC2 / Fargate。","執行時間上限 **15 分鐘**：超過就要拆步驟用 Step Functions 或改用 ECS/Fargate。","要連**私有 RDS** → 需要 VPC 設定；同時要連外網 → 需要 NAT。","Cold start 敏感 → Provisioned Concurrency、SnapStart、或把 init 做輕。","SQS 觸發 Lambda 是 **poll-based**（Lambda 主動拉），SNS/S3 是 **push-based**。","同時處理大量訊息時記得設 Reserved Concurrency，否則會打爆下游資料庫。"],gotchas:["每次執行環境可能不同，**不要把狀態放在記憶體或 /tmp 當資料庫**。","同步呼叫最多重試 0 次、非同步會自動重試 2 次——重試可能造成重複執行，設計要 idempotent。","Lambda 的 512 MB /tmp 不是持久的，跨執行不保證存在。","VPC 內的 Lambda + 大量呼叫會耗盡 ENI（現在已改善但仍要注意子網大小）。"],related:["api-gateway","ecs","step-functions","sqs","cloudwatch"]},{id:"ecs",name:"Amazon ECS",zh:"彈性容器服務（Docker 編排）",category:"compute",emoji:"\uD83D\uDCE6",tagline:"AWS 自家的容器編排：把 Docker 映像跑起來，你不用管底層用哪台機器。",aliases:["docker","container","容器","fargate","編排"],intro:["**ECS（Elastic Container Service）** 是 AWS 原生的容器編排服務。你把 Docker image 放到 ECR 或 Docker Hub，定義一個 **Task Definition**（要幾顆 CPU、多少記憶體、開哪些 port、掛哪些 volume），ECS 負責把它跑起來。","啟動方式有兩種：**EC2 Launch Type**（容器跑在你自己的 EC2 上，省錢但要自己管機器）與 **Fargate**（AWS 幫你管底層，直接為容器付費，最省心）。","跟 Kubernetes 相比，ECS 更簡單、與 IAM / ALB / CloudWatch 整合更直接；需要跨雲、生態系與更細緻的編排能力才選 [[eks|EKS]]。"],concepts:[{term:"Task Definition",desc:"容器的「規格書」：image、CPU / Memory、環境變數、port mappings、logs、IAM Role。版本化，改了就產生新版本。"},{term:"Task vs Service",desc:"Task 是跑一次就結束的單位（像 `docker run`）；Service 是「維持 N 個 Task 一直活著」的長期服務，會自動重啟與滾動更新。"},{term:"Cluster",desc:"邏輯上的群組。Fargate 模式下 Cluster 是空的容器，不佔資源也不收費。"},{term:"Fargate",desc:"Serverless 容器：以 vCPU / GB-秒計費，不用管 EC2 的容量規劃，也少了「叢集有機器卻沒人用」的浪費。"},{term:"Task Role vs Execution Role",desc:"**Task Role** 給容器裡的程式用（存取 S3 等）；**Execution Role** 給 ECS agent 用（拉 image、寫 log）。這兩個超常考。"},{term:"ECS Anywhere",desc:"把地端伺服器註冊進 ECS 一起管理，混合式部署用。"}],interactions:[{to:"ecr",dir:"in",how:"容器映像放在 ECR，ECS 用 Execution Role 的權限拉映像。"},{to:"elb",dir:"in",how:"ALB 搭配 target group 與 dynamic port mapping，把流量導到各 Task；Service 會自動註冊 / 移除目標。"},{to:"fargate",dir:"in",how:"選 Fargate 就不用管理 EC2，直接指定每個 Task 要多少 vCPU 與記憶體。"},{to:"ec2",dir:"in",how:"EC2 Launch Type 下容器跑在 Auto Scaling Group 的 EC2 上，容量由你控制。"},{to:"cloudwatch",dir:"out",how:"用 `awslogs` driver 把容器 stdout 送到 CloudWatch Logs；Container Insights 提供指標。"},{to:"secrets-manager",dir:"in",how:"在 Task Definition 的 `secrets` 區塊直接注入 Secrets Manager / SSM 的值，不必把密碼寫在環境變數。"},{to:"iam",dir:"in",how:"Task Role / Execution Role 決定容器能做什麼，最小權限原則一樣適用。"},{to:"efs",dir:"both",how:"多個 Task 需要共享檔案時掛 EFS（Fargate 支援）；S3 則適合放靜態資源。"},{to:"eventbridge",dir:"both",how:"ECS 的 Task 狀態變化會發事件到 EventBridge，可觸發通知或補救流程。"}],settings:[{name:"Launch type: Fargate / EC2",required:!0,desc:"不想管機器選 Fargate；要壓成本、要特殊 instance 規格、要 GPU 選 EC2。"},{name:"CPU / Memory",required:!0,desc:"Fargate 有固定組合（例如 1 vCPU 只能是 2–8 GB），設錯會直接建立失敗。"},{name:"Task Role / Execution Role",required:!0,warn:!0,desc:"兩個都要設對，否則會出現「拉不到 image」或「容器沒權限寫 S3」。"},{name:"Desired count / Auto Scaling",desc:"Service 想維持幾個 Task；搭配 CPU / Memory / ALB RequestCount 目標追蹤自動擴縮。"},{name:"Deployment type",desc:"Rolling update（預設，逐步替換）或 Blue/Green（用 CodeDeploy，可測試後切流量）。"},{name:"Health check / Grace period",warn:!0,desc:"ALB health check 路徑設錯會讓 Task 被判定不健康而不停重啟；用它確保新版本真的起來才切流量。"},{name:"Logging",desc:"一定要設 log configuration（`awslogs`），否則容器一掛你就完全看不到原因。"},{name:"Capacity provider / Spot",desc:"EC2 模式下可用 Spot 容量提供者降低成本（搭配混合策略保留部分 On-Demand）。"}],pricing:{model:"ECS 本身**免費**（Fargate 除外）；EC2 Launch Type 付的是 EC2 + EBS 的錢。Fargate 以 vCPU / GB-秒計費。",free:"沒有免費額度，但 ECS 控制平面本身不收費。",rows:[{tier:"ECS 控制平面",price:"免費",note:"叢集、Task Definition、Service 都不收費。",level:0},{tier:"Fargate（Linux / x86）",price:"$0.04048 / vCPU-小時 + $0.004445 / GB-小時",note:"1 vCPU + 2 GB 跑一個月約 $40，比對應 EC2 貴但省下維運。",level:3},{tier:"Fargate Spot",price:"省 ~70%",note:"可中斷的工作用 Spot 容量提供者，便宜很多。",level:1},{tier:"EC2 Launch Type",price:"EC2 價格",note:"用 Reserved / Savings Plans 可再壓低，適合穩定長期負載。",level:2}],traps:["Fargate **按 vCPU / 記憶體配置**計費：Task 宣告 2 vCPU 但 code 只用到 0.2，你還是付 2。","EC2 Launch Type 的機器常常只用了 30%，容量規劃不好等於浪費——這時 Fargate 反而更便宜。","ECS 不會自動幫你調 desired count，自動擴縮要自己設。"]},cli:["# 註冊 Task Definition 並建立 Service","aws ecs register-task-definition --cli-input-json file://taskdef.json","aws ecs create-service --cluster prod --service-name web \\","  --task-definition web:1 --desired-count 3 \\","  --launch-type FARGATE --network-configuration file://netconf.json","","aws ecs list-tasks --cluster prod"],exam:["「不想管底層機器」→ **Fargate**；「要壓成本且能自己管機器」→ **EC2 Launch Type**。","容器要存取 S3 / DynamoDB → 用 **Task Role**，不是環境變數塞 key。","容器拉不到私有 ECR image → 檢查 **Execution Role** 與 image 的 Region。","多個 Task 需要共享同一個檔案系統 → **EFS**。","動態 port mapping 是 ECS + ALB 的關鍵（同一個 port 可以跑多個 Task）。"],gotchas:["Fargate 不支援 `host` network mode 與 privileged 容器，需要這些請用 EC2 Launch Type。","Task 沒有持久化儲存：容器重啟，寫在容器內的檔案就消失（要掛 EFS / EBS）。","Service 更新時若 health check 太嚴格，會陷入不停重啟的迴圈。"],related:["eks","ecr","elb","fargate","efs"]},{id:"eks",name:"Amazon EKS",zh:"彈性 Kubernetes 服務",category:"compute",emoji:"☸️",tagline:"託管的 Kubernetes 控制平面：用你熟悉的 K8s，但 etcd 與 API server 由 AWS 顧。",aliases:["kubernetes","k8s","容器","helm"],intro:["**EKS（Elastic Kubernetes Service）** 提供符合標準的 Kubernetes 控制平面（API server、etcd、scheduler），AWS 負責它的可用性、修補與版本升級，你只要顧 worker。","Worker 有三種：**Managed Node Groups**（AWS 幫你管 EC2）、**Self-managed Nodes**（完全自己控）、**Fargate Profile**（無伺服器，適合不想碰節點但對 Pod 規格有要求的情境）。","選 EKS 的理由通常是：已經有 K8s 技能與生態（Helm、Istio、ArgoCD）、要跨雲一致性、需要 K8s 的 CRD 與 operator。只想單純跑容器，ECS 通常更快上手也更便宜。"],concepts:[{term:"Control Plane",desc:"API server + etcd + scheduler。EKS 幫你跨多個 AZ 管理，SLA 99.95%（每叢集每小時計費）。"},{term:"Node / Node Group",desc:"實際跑 Pod 的機器。Managed Node Group 由 EKS 代管 ASG 與 AMI 更新。"},{term:"IAM Roles for Service Accounts (IRSA)",desc:"把 IAM Role 綁到 K8s ServiceAccount，Pod 直接拿到最小權限的臨時憑證，取代塞 Access Key（現已升級為 EKS Pod Identity）。"},{term:"aws-auth ConfigMap / Access Entries",desc:"決定哪些 IAM 身分可以對叢集做什麼（新的 Access Entries API 取代 ConfigMap）。"},{term:"Add-ons",desc:"VPC CNI（Pod 網路）、CoreDNS、kube-proxy、EBS CSI Driver 等由 AWS 維護的元件。"},{term:"Fargate Profile",desc:"指定 namespace + label 的 Pod 自動跑在 Fargate 上，不用節點也不用管容量。"}],interactions:[{to:"ecr",dir:"in",how:"Pod 從 ECR 拉映像（私有 registry 需要 imagePullSecret 或 node role 權限）。"},{to:"elb",dir:"in",how:"Service type LoadBalancer 配 NLB；Ingress 走 AWS Load Balancer Controller 建 ALB，支援 path / host 路由。"},{to:"vpc",dir:"both",how:"EKS 的 VPC CNI 讓每個 Pod 拿到 VPC IP，子網要規劃足夠 IP 是常見痛點。"},{to:"iam",dir:"in",how:"叢集角色、節點角色、Pod 身分（IRSA / Pod Identity）三層 IAM，是最容易搞混的部分。"},{to:"cloudwatch",dir:"out",how:"Control plane logs 可送到 CloudWatch Logs；Container Insights 提供指標與 dashboard。"},{to:"ebs",dir:"both",how:"用 EBS CSI Driver 提供 ReadWriteOnce 的持久卷（PV）。"},{to:"efs",dir:"both",how:"需要多 Pod 共享（ReadWriteMany）時用 EFS CSI Driver。"},{to:"auto-scaling",dir:"both",how:"Cluster Autoscaler / Karpenter 依待排程 Pod 自動增減節點；HPA 依 CPU 調 Pod 數量。"}],settings:[{name:"Kubernetes version",required:!0,desc:"每版支援約 14 個月，升級要用 `eksctl` 或控制台，升級前先確認 add-on 相容性。"},{name:"VPC / Subnet 規劃",required:!0,warn:!0,desc:"VPC CNI 讓每個 Pod 吃一個 IP：`/24` 只能跑約 250 個 Pod，子網開太小會出現 `no IP addresses available`。"},{name:"Endpoint access",warn:!0,desc:"Public（方便但要注意 CIDR 白名單）、Private（只能從 VPC 內連）、Public + Private 混合。"},{name:"Node AMI type",desc:"Amazon Linux、Bottlerocket（為容器最佳化）、Windows；GPU 工作要選對 AMI 與 driver。"},{name:"Pod Identity / IRSA",desc:"把 IAM Role 綁到 ServiceAccount，讓特定 Pod 有特定權限。"},{name:"Secrets encryption",desc:"K8s Secrets 預設是 base64 不是加密；啟用 KMS envelope encryption 才是真的保護。"},{name:"Logging",desc:"Control plane 的 api / audit / authenticator / controllerManager / scheduler log 可選擇送到 CloudWatch。"},{name:"Karpenter / Autoscaler 設定",desc:"設定 instance 類型與容量策略，是控制成本最有效的地方。"}],pricing:{model:"**每叢集每小時**固定費用 + Worker 節點的 EC2（或 Fargate）費用。EKS 控制平面不收流量費。",free:"沒有免費額度；新帳號的 EC2 免費方案可用在 worker 上。",rows:[{tier:"EKS 控制平面",price:"$0.10 / 小時",note:"約 $73/月，每個叢集都要付——測試環境常常忘了刪。",level:3},{tier:"Managed Node Group",price:"EC2 價格",note:"底層就是 EC2 + EBS，可用 Savings Plans 折扣。",level:2},{tier:"Fargate Profile",price:"$0.04048 / vCPU-小時 + $0.004445 / GB-小時",note:"與 ECS Fargate 同價，額外要付控制平面的固定費。",level:3},{tier:"資料傳輸",price:"$0.09 / GB 起",note:"跨 AZ、跨 Region、出網際網路都要算，是隱形成本大宗。",level:2}],traps:["**忘掉測試叢集**：$0.10/hr 看起來少，一年 $876。","節點通常是「機器很大但裝不滿」→ 用 Karpenter 或 Spot 混搭把使用率拉高。","跨 AZ 流量：Pod 打 Pod 的流量若跨 AZ 也會計費，拓撲感知（topology aware routing）可以省。"]},cli:["# 用 eksctl 建叢集（最省事）","eksctl create cluster --name demo --region ap-northeast-1 \\","  --nodegroup-name ng-1 --node-type t3.medium --nodes 3","","# 連線設定與查看","aws eks update-kubeconfig --name demo --region ap-northeast-1","kubectl get nodes -o wide"],exam:["Pod 需要 IAM 權限 → **IRSA / EKS Pod Identity**，不是把 key 塞 Secret。","需要 Ingress / ALB → **AWS Load Balancer Controller**；Service type LoadBalancer 是 NLB。","Pod 需要持久儲存且多 Pod 共享 → **EFS**；單一 Pod → **EBS**。","「不想管理節點但要用 K8s」→ **EKS + Fargate Profile**。","「已經很熟 K8s / 要跨雲」→ EKS；「只想跑容器、最簡單」→ ECS。"],gotchas:["VPC 子網 IP 不夠會讓 Pod 起不來（VPC CNI 每個 Pod 一個 IP）。","K8s Secrets 沒啟用 KMS 加密時只做了 base64 編碼。","節點版本與控制平面版本落差太大會被強制升級。","Fargate Profile 支援的設定有諸多限制（不能 privileged、不能 host network）。"],related:["ecs","ecr","efs","elb","eks"]},{id:"elastic-beanstalk",name:"AWS Elastic Beanstalk",zh:"平台即服務（PaaS）",category:"compute",emoji:"\uD83C\uDF31",tagline:"把程式碼丟上去，AWS 幫你把 EC2、ALB、ASG、部署流程全部組好。",aliases:["paas","beanstalk","平台即服務"],intro:["**Elastic Beanstalk** 是 AWS 的 PaaS：你上傳程式碼（zip / war），它自動建立 ELB + Auto Scaling Group + EC2 + CloudWatch 告警，處理容量、負載平衡、健康檢查與滾動部署。","支援 Java、.NET、PHP、Node.js、Python、Ruby、Go 與 **Docker**。你仍然可以在事後進去調 EC2 與負載平衡器的設定——這點跟 Heroku 不同，Beanstalk 保留完整控制權。","它**本身免費**，你付的是底下產生的資源。適合「開發者不想學整套 DevOps，但要一個能擴縮的環境」。"],concepts:[{term:"Application / Environment",desc:"Application 是版本集合，Environment 是實際跑的環境（Web Server 或 Worker）。"},{term:"Web vs Worker Tier",desc:"Web Tier 服務 HTTP；Worker Tier 從 SQS 拉訊息做背景工作，兩者可疊在一起。"},{term:"Deployment Policy",desc:"All at once（快但有停機）、Rolling、Rolling with additional batch、Immutable（另開一批新機器，最安全）、Blue/Green（另建環境切 DNS）。"},{term:"`.ebextensions`",desc:"用 YAML 描述環境設定與套件安裝，是平台層的設定即程式碼。"},{term:"Platform version",desc:"AWS 維護的執行環境版本，可設定自動更新與維護窗。"}],interactions:[{to:"ec2",dir:"out",how:"底下實際就是 EC2：Beanstalk 幫你開機器、設定 Security Group、套用 AMI。"},{to:"elb",dir:"out",how:"自動建立 ALB（或 NLB），設定 health check 與 listener 規則。"},{to:"auto-scaling",dir:"out",how:"自動建立 ASG，依 CPU / 網路等指標擴縮。"},{to:"rds",dir:"both",how:"可在環境內建資料庫（方便但與環境生命週期綁死），正式環境建議獨立建立。"},{to:"cloudwatch",dir:"out",how:"自動建立基本的指標與告警，log 可送至 CloudWatch Logs。"},{to:"sqs",dir:"both",how:"Worker Tier 需要一個 SQS 佇列，形成「Web 收請求 → 佇列 → Worker 慢慢處理」架構。"},{to:"iam",dir:"out",how:"需要 service role 與 instance profile 讓環境有權限建立資源與存取服務。"},{to:"s3",dir:"both",how:"應用程式版本存在 S3；程式也可直接讀寫 S3。"}],settings:[{name:"Platform & version",required:!0,desc:"選對語言版本；設定自動小版本更新可免於安全修補。"},{name:"Environment tier",required:!0,desc:"Web Server（接收 HTTP）或 Worker（消費 SQS 佇列）。"},{name:"Deployment policy",warn:!0,desc:"Immutable 最安全但仍會短暫雙倍資源；Rolling 分批更新避免停機。"},{name:"Instance type & capacity",desc:"Min / Max / Desired instances 與 instance type，決定成本曲線。"},{name:"Health check path",warn:!0,desc:"設錯路徑會讓環境一直顯示 Degraded 並觸發替換。"},{name:"Environment variables",desc:"集中管理設定；敏感值建議用 Secrets Manager 動態讀取。"},{name:"Enhanced health reporting",desc:"提供更細緻的健康狀態（需要 paying for 額外的 CloudWatch 指標）。"},{name:"Managed updates",desc:"在維護窗自動更新平台版本，關閉就要自己盯。"}],pricing:{model:"Beanstalk **不收平台費**，只付底下的 EC2、ELB、RDS、S3 等資源，以及可選的增強健康報告。",free:"與 EC2 免費方案相同（單機 t2.micro 環境可免費跑 12 個月）。",rows:[{tier:"Beanstalk 服務費",price:"免費",note:"只為建立的資源付費。",level:0},{tier:"單機環境（t3.micro）",price:"約 $8 / 月",note:"開發測試用，沒有 ELB 也沒有高可用。",level:1},{tier:"負載平衡環境（2×m6i.large + ALB）",price:"約 $170 / 月",note:"正式環境的最小可用配置。",level:3},{tier:"Enhanced health reporting",price:"$0.0015 / 小時 / 執行個體",note:"額外 CloudWatch 指標費用。",level:1}],traps:["Immutable / Blue-Green 部署期間會**短暫雙倍資源**，帳單會有尖峰。","用環境內建 RDS，一旦刪除環境資料庫也一起消失——正式環境請獨立開 RDS。","關閉環境不等於刪除；沒刪掉的環境持續計費。"]},cli:["# 用 EB CLI 部署","eb init -p node.js-20 my-app --region ap-northeast-1","eb create prod-env --instance-type m6i.large --min-instances 2","eb deploy","eb status && eb logs"],exam:["「開發者不想碰基礎設施、但要能擴縮」→ Beanstalk。","Worker Tier 一定要配 **SQS**，這是辨識關鍵字。","部署不能停機 → Rolling、Immutable 或 Blue/Green。","Beanstalk 免費，但你付它建立的資源。"],gotchas:["環境內建 RDS 的生命週期跟環境綁在一起，刪環境就沒了。","`.ebextensions` 寫錯會讓部署整個失敗且錯誤訊息不清楚。","Health check 路徑設定錯誤會造成環境不斷替換機器。"],related:["ec2","auto-scaling","elb","app-runner"]},{id:"auto-scaling",name:"Auto Scaling Group (ASG)",zh:"自動擴縮群組",category:"compute",emoji:"\uD83D\uDCC8",tagline:"依需求自動加減機器：流量來多開幾台，閒下來自動關掉。",aliases:["asg","scaling","擴縮","自動擴展"],intro:["**Auto Scaling Group** 管理一群 EC2（或容器、RDS 讀取副本等）：設定「最小 / 期望 / 最大」數量，ASG 會持續確認實際數量符合期望，機器掛掉就自動補一台。","搭配 **Launch Template**（規格書）與 **Scaling Policy**（何時擴、擴多少），就是一個能自動應付流量變化的架構。","ASG 也是**高可用**的核心：把機器分散到多個 AZ 與多個子網，一台 AZ 掛掉其他還能撐。"],concepts:[{term:"Launch Template",desc:"AMI、instance type、Security Group、User Data 的模板。比舊的 Launch Configuration 支援版本控管與混合規格。"},{term:"Desired / Min / Max Capacity",desc:"ASG 會把數量維持在 Desired；擴縮不會超過 Max；Min 保證底線。"},{term:"Target Tracking",desc:"最常用：例如「維持平均 CPU 在 50%」，ASG 自動算出要幾台。"},{term:"Step Scaling",desc:"依 CloudWatch alarm 的嚴重程度分級擴縮（例如 CPU > 70 加 2 台、> 90 加 5 台）。"},{term:"Scheduled Scaling",desc:"已知的流量高峰（例如每週一早上）事先排程。"},{term:"Cooldown / Warmup",desc:"擴縮後的冷卻時間，避免指標還沒反應就連續加減機器造成震盪。"}],interactions:[{to:"ec2",dir:"out",how:"依 Launch Template 建立與終止 EC2；機器不健康會被替換。"},{to:"elb",dir:"both",how:"ASG 把新機器註冊到 Target Group，ELB 做 health check；不健康的機器會被 ASG 換掉。"},{to:"cloudwatch",dir:"in",how:"CPU / RequestCount / SQS 深度等指標驅動 scaling policy，也可發送 ASG 活動通知。"},{to:"sns",dir:"out",how:"擴縮事件發通知到 SNS，Email / Lambda 都能收到。"},{to:"vpc",dir:"in",how:"指定多個子網（多 AZ）才能高可用；ASG 會盡量平均分散。"},{to:"iam",dir:"in",how:"Service-linked role 讓 ASG 有權限建立與終止機器。"},{to:"ecs",dir:"out",how:"ECS 的 Capacity Provider 用 ASG 管理底層 EC2 容量。"},{to:"systems-manager",dir:"out",how:"新機器啟動後用 SSM Run Command / State Manager 安裝軟體、套用基準設定。"}],settings:[{name:"Min / Desired / Max",required:!0,desc:"Max 是成本護欄，設太高會意外暴增；Min 至少 2 才有多 AZ 高可用。"},{name:"Subnets (Multi-AZ)",required:!0,warn:!0,desc:"只選一個子網等於放棄高可用，這是最常見的初學者錯誤。"},{name:"Scaling policy type",required:!0,desc:"Target tracking 最省事；Step 適合突發；Scheduled 應對已知高峰。"},{name:"Cooldown period",desc:"預設 300 秒。設太短會反覆增減機器，設太長則反應不及。"},{name:"Health check type",warn:!0,desc:"EC2（只看機器）或 ELB（含應用回應）。用 ELB 才會替換「機器活著但服務壞掉」的實例。"},{name:"Termination policy",desc:"優先終止哪台：OldestLaunchTemplate、NewestInstance、ClosestToNextInstanceHour 等。"},{name:"Instance refresh / 混合政策",desc:"更新 AMI 時滾動替換；可設定 On-Demand 與 Spot 的比例來省錢。"},{name:"Lifecycle hooks",desc:"在執行個體啟動 / 終止的過渡狀態停住並執行自訂動作，最多 1 小時（或 48 小時延長）。"}],pricing:{model:"ASG 本身**免費**，你付的是它建立 / 終止的資源（EC2、EBS 等）。",free:"不適用（ASG 沒有服務費）。",rows:[{tier:"ASG 服務費",price:"免費",note:"只有底下資源要付費。",level:0},{tier:"穩定的兩台 m6i.large",price:"約 $140 / 月",note:"高可用的基準配置。",level:2},{tier:"尖峰擴到 10 台",price:"每小時 +$0.96",note:"彈性成本：只在需要的那幾小時多付。",level:3},{tier:"搭配 Spot 混合政策",price:"省 50–70%",note:"用 70% Spot + 30% On-Demand 這類比例壓低平均成本。",level:1}],traps:["沒有設 Max，程式有 bug 造成 CPU 飆高 → 無限擴到預算上限。","Cooldown 設太短 + 指標延遲 → 反覆震盪（flapping），反而更貴。","只放一個 AZ 讓高可用失效，省下的錢可能抵不過一次停機。"]},cli:["aws autoscaling create-auto-scaling-group \\","  --auto-scaling-group-name web-asg \\","  --launch-template LaunchTemplateName=web-lt,Version='$Latest' \\","  --min-size 2 --max-size 10 --desired-capacity 2 \\",'  --vpc-zone-identifier "subnet-aaa,subnet-bbb" \\',"  --target-group-arns arn:aws:elasticloadbalancing:..."],exam:["擴縮策略關鍵字：**不確定流量、想自動** → Target Tracking；**已知高峰時間** → Scheduled；**依 alarm 分級** → Step。","「機器活著但服務沒回應要換掉」→ Health check type 設 **ELB**。","更新 AMI 不停機 → Instance Refresh 或 Rolling 替換。","要同時省錢又高可用 → 混合 On-Demand + Spot 的 ASG 政策。"],gotchas:["Scaling 的指標（如 CPU）是平均值且延遲 1–3 分鐘，突發流量需要更高 Min 或更快的策略。","Lifecycle hook 卡住沒放行，機器會一直停在 Pending 狀態。","Desired capacity 手動改過之後，policy 可能會把它改回去。"],related:["ec2","elb","cloudwatch","ecs"]},{id:"ecr",name:"Amazon ECR",zh:"彈性容器映像倉庫",category:"compute",emoji:"\uD83D\uDDC3️",tagline:"存放 Docker image 的私有倉庫，跟 ECS / EKS 天生一對。",aliases:["registry","docker hub","映像","image"],intro:["**ECR（Elastic Container Registry）** 是 AWS 的容器映像倉庫：`docker push` 把 image 推上去，ECS / EKS / Lambda 都從這裡拉。","每個映像都是私有且有 IAM 權限控制，支援**跨 Region 複製**、**跨帳號共享**與 **image scanning**（掃 CVE 弱點）。","也有 **ECR Public**（公開倉庫，等於 AWS 版的 Docker Hub）以及 **ECR Pull Through Cache**（把外部 registry 的映像快取到私有 ECR，繞過 Docker Hub 限流）。"],concepts:[{term:"Repository",desc:"一個 repo 放一個映像的所有版本；可用 namespace（`team/app`）。"},{term:"Tag vs Digest",desc:"tag 可變（`:latest`），digest（`sha256:...`）不可變，正式部署建議用 digest 或 immutable tag。"},{term:"Image scanning",desc:"Basic（推送時掃）與 Enhanced（掃更多類型、持續掃，額外計費，需 Inspector）。"},{term:"Lifecycle policy",desc:"自動刪除舊映像，例如「只保留最近 10 個」——**不做這件事，儲存費會一直長**。"},{term:"Cross-Region / Cross-Account",desc:"Replication 複製到其他 Region；Repository policy 允許其他帳號拉取。"}],interactions:[{to:"ecs",dir:"out",how:"ECS Task Definition 指定 ECR image URI，Execution Role 需有 `ecr:GetDownloadUrlForLayer` 等權限。"},{to:"eks",dir:"out",how:"Pod 從 ECR 拉映像；私有 repo 需要 imagePullSecret 或節點角色權限。"},{to:"lambda",dir:"out",how:"Lambda 支援容器映像部署（最大 10 GB），映像同樣放 ECR。"},{to:"iam",dir:"in",how:"誰能 push / pull 由 repository policy 與 IAM policy 決定。"},{to:"cloudformation",dir:"in",how:"用 IaC 建立 repo、權限與 lifecycle policy，讓映像倉庫也能版本控管。"},{to:"kms",dir:"both",how:"映像可選擇用 KMS 加密（靜態加密）。"},{to:"inspector",dir:"out",how:"Enhanced scanning 由 Amazon Inspector 提供持續弱點掃描。"}],settings:[{name:"Image tag mutability",required:!0,warn:!0,desc:"`MUTABLE`（預設，可覆蓋 tag）或 `IMMUTABLE`（禁止覆蓋，正式環境建議）。"},{name:"Scan on push",desc:"推送時自動掃描，基本免費。"},{name:"Encryption",desc:"AES-256 預設；要 KMS 就選 KMS 模式（跨帳號分享會受 key policy 影響）。"},{name:"Lifecycle policy",warn:!0,desc:"必設：例如 `tagStatus=untagged` 保留 14 天，或只保留最近 10 個映像。"},{name:"Repository policy",desc:"跨帳號或跨服務授權，例：允許特定帳號 pull。"},{name:"Replication rule",desc:"多 Region 部署時自動複製映像，避免跨區拉取延遲與流量費。"}],pricing:{model:"按**儲存容量**（GB-月）+ **資料傳輸**計費；拉取同 Region 進 EC2/ECS 不算流量費。",free:"免費額度：每月 500 MB 私有儲存（12 個月）。",rows:[{tier:"私有儲存",price:"$0.10 / GB-月",note:"只算壓縮後的映像層大小。",level:1},{tier:"Public 儲存",price:"$0.10 / GB-月",note:"ECR Public 另有 50 GB/月免費。",level:1},{tier:"跨 Region / 出網際網路傳輸",price:"$0.09 / GB 起",note:"同 Region 拉取免費。",level:2},{tier:"Enhanced scanning",price:"依 Inspector 計價",note:"Basic scanning 免費但功能較少。",level:2}],traps:["CI 每次 push 都帶新 tag 卻不清理，映像堆積如山 → 用 lifecycle policy 自動刪。","跨 Region 拉 image 會**產生流量費**，多區部署請用 replication。","`latest` tag 在不同環境可能指向不同映像，導致「部署了但沒更新」的鬼故事。"]},cli:["aws ecr create-repository --repository-name myapp --image-tag-mutability IMMUTABLE","aws ecr get-login-password --region ap-northeast-1 | docker login --username AWS --password-stdin <acct>.dkr.ecr.ap-northeast-1.amazonaws.com","docker build -t myapp . && docker tag myapp:1 <acct>.dkr.ecr.../myapp:1","docker push <acct>.dkr.ecr.../myapp:1"],exam:["ECS 拉不到 image → 檢查 **Execution Role** 權限與 Region。","要避免 Docker Hub 限流 → **Pull Through Cache**。","正式部署用 **immutable tag + digest**，避免 `latest` 的不確定性。","Lambda 用容器映像部署時映像放 ECR，映像上限 10 GB。"],gotchas:["忘了設 lifecycle policy，儲存費每個月默默成長。","跨帳號拉映像需要 repository policy，只給 IAM 權限不夠。","KMS 加密的模式下跨帳號分享需要同時給 KMS key 權限。"],related:["ecs","eks","lambda","inspector"]},{id:"fargate",name:"AWS Fargate",zh:"無伺服器容器",category:"compute",emoji:"\uD83E\uDD4F",tagline:"不用管 EC2 的容器執行方式：只宣告容器要多少 CPU 與記憶體，底層主機 AWS 幫你顧。",aliases:["serverless container","無伺服器容器","fargate"],intro:["**Fargate** 不是獨立服務，而是 ECS 與 EKS 的一種 **launch type**：你不再需要維護 EC2 叢集、不需要考慮容量規劃、不用修補作業系統，AWS 直接給你容器執行環境。","代價是單價較高（約為同規格 EC2 的 1.5–2 倍），而且限制較多：不支援 privileged 容器、不能自己選 instance type、不支援 GPU（EKS 後期支援部分情境）。","判斷準則很簡單：**負載穩定且很大、要極致省成本 → EC2；負載零散、團隊不想管機器 → Fargate**。"],concepts:[{term:"Task / Pod 大小",desc:"以 vCPU 與 GB 為單位配置（0.25 vCPU ~ 16 vCPU）。"},{term:"Ephemeral storage",desc:"每個 Task 預設 20 GB 暫存空間，可調到 200 GB（額外計費）。"},{term:"Fargate Spot",desc:"折扣約 70% 的容量，中斷前會有 2 分鐘通知，適合可重試的批次工作。"},{term:"awsvpc 網路模式",desc:"Fargate 唯一支援的模式：每個 Task 有自己的 ENI 與私有 IP，Security Group 直接綁 Task。"}],interactions:[{to:"ecs",dir:"in",how:"指定 `launchType: FARGATE` 或使用 Capacity Provider 把 ECS Task 交給 Fargate 執行。"},{to:"eks",dir:"in",how:"EKS 用 Fargate Profile，符合 namespace / label 的 Pod 自動跑在 Fargate。"},{to:"ecr",dir:"in",how:"映像來源，拉取需要 Execution Role 或 Pod 身分的權限。"},{to:"elb",dir:"in",how:"ALB / NLB 透過 awsvpc 模式直接把流量導到 Task IP。"},{to:"cloudwatch",dir:"out",how:"log 與 Container Insights 指標送到 CloudWatch。"},{to:"efs",dir:"both",how:"唯一支援的共享檔案系統選項，多 Task 共享資料要靠它。"},{to:"secrets-manager",dir:"in",how:"Task Definition 的 secrets 區塊注入敏感值，避免寫進環境變數。"},{to:"vpc",dir:"both",how:"必須指定子網與 Security Group，注意私有子網需要 NAT 或 VPC Endpoint 才能對外。"}],settings:[{name:"CPU / Memory 組合",required:!0,warn:!0,desc:"Fargate 只允許特定組合（例如 0.5 vCPU 配 1–4 GB），設錯會直接建立失敗。"},{name:"Platform version",desc:"`LATEST` 或指定 `1.4.0` 等版本；不同版本支援的功能不同。"},{name:"Ephemeral storage",desc:"預設 20 GB，需要大量暫存檔（例如資料處理）才調高。"},{name:"Capacity provider strategy",desc:"可用 FARGATE_SPOT 搭配基本 FARGATE，兼顧成本與穩定。"},{name:"子網與 Security Group",required:!0,desc:"私有子網 + NAT 是常見組合；要連 RDS 記得開對應 port 的 Security Group。"},{name:"Log configuration",warn:!0,desc:"沒設 log 就等於容器掛掉時兩眼全黑。"}],pricing:{model:"以 vCPU-小時 + GB-小時計費，**最低計算單位為 1 分鐘**，從映像下載完成才開始算。",free:"沒有免費額度（新帳號的免費方案屬於 EC2）。",rows:[{tier:"Linux / x86 vCPU",price:"$0.04048 / vCPU-小時",note:"1 vCPU 連續跑一個月約 $29。",level:3},{tier:"Linux / x86 記憶體",price:"$0.004445 / GB-小時",note:"2 GB 約 $6.5/月。",level:2},{tier:"Windows",price:"約 $0.046 / vCPU-小時",note:"比 Linux 貴，且需要較大記憶體。",level:4},{tier:"Fargate Spot",price:"約 3 折",note:"可中斷的批次工作最佳選擇。",level:1}],traps:["多個小容器合成一個 Task 有時更便宜（省下每個 Task 的固定開銷與 ENI）。","容器啟動慢（例如拉大 image）會讓每次擴縮都有一段「已計費但還沒服務」的時間。","Fargate 沒有 Reserved / Savings Plans 折扣，只能靠 Spot 與正確 sizing 省錢。"]},exam:["「不想維運 EC2 但要跑容器」→ **Fargate**；「限制最少、要 GPU、要最省」→ EC2 launch type。","Fargate 只支援 **awsvpc** 網路模式。","多 Task 共享儲存 → **EFS**（Fargate 不支援 EBS 多附件）。","EKS 的無伺服器選項就是 Fargate Profile。"],gotchas:["不支援 privileged、host network、daemonset（部分情境），需要這些功能只能回 EC2。","每個 Task 一個 ENI，大量小 Task 會消耗子網 IP。","沒有 Savings Plans，長期大負載可能比 EC2 + RI 貴上不少。"],related:["ecs","eks","ecr","efs"]},{id:"app-runner",name:"AWS App Runner",zh:"全託管容器 / Web 應用服務",category:"compute",emoji:"\uD83D\uDE80",tagline:"把容器或原始碼丟上去，直接得到一個有 HTTPS、會自動擴縮的網址。",aliases:["apprunner","paas","全託管"],intro:["**App Runner** 是最省事的容器部署方式：來源可以是 ECR 映像或 GitHub repo，它自動建置、部署、附上 HTTPS 網域、做負載平衡與自動擴縮。","它與 ECS + Fargate 的差別是「**幾乎不用設定**」：沒有 Task Definition、沒有 Service、沒有 ALB 設定，但也因此彈性最少（無法自訂網路進階設定、無法掛多個檔案系統）。","適合內部工具、API 服務、快速 demo；不適合需要精細網路控制或特殊 sidecar 架構的系統。"],concepts:[{term:"Service",desc:"一個部署單位，包含來源設定、執行環境、擴縮與健康檢查。"},{term:"Auto scaling configuration",desc:"設定併發上限（例如每個 instance 100 個併發請求）與 Max concurrency，達到上限就加執行個體。"},{term:"VPC Connector",desc:"要連私有 RDS / ElastiCache 時需要的網路連接器。"},{term:"Custom domain",desc:"可綁定自有網域並自動簽發憑證（透過 App Runner 或 ACM）。"}],interactions:[{to:"ecr",dir:"in",how:"直接部署 ECR 中的映像，支援自動部署（映像更新就重新部署）。"},{to:"rds",dir:"both",how:"透過 VPC Connector 連線到私有資料庫，是它最常見的用途。"},{to:"cloudwatch",dir:"out",how:"服務 log 與指標送到 CloudWatch。"},{to:"secrets-manager",dir:"in",how:"環境變數可引用 Secrets Manager / SSM 的值。"},{to:"route53",dir:"in",how:"自訂網域用 CNAME / Alias 指向 App Runner 服務網址。"},{to:"vpc",dir:"both",how:"VPC Connector 讓服務能進入 VPC 私有子網。"}],settings:[{name:"Source (image / repository)",required:!0,desc:"ECR 映像（可設自動部署）或 GitHub repo（App Runner 幫你 build）。"},{name:"Port & health check",required:!0,desc:"容器監聽的 port 與健康檢查路徑，設錯服務永遠不會變成 Running。"},{name:"CPU / Memory",required:!0,desc:"0.25 vCPU / 0.5 GB 起的固定組合。"},{name:"Max concurrency",desc:"每個執行個體能接受的併發數，直接影響擴縮與成本。"},{name:"Auto deploy",desc:"ECR 映像更新時是否自動重新部署。"},{name:"VPC Connector",warn:!0,desc:"沒設定就無法連私有子網的資料庫。"}],pricing:{model:"以「佈建記憶體 + vCPU 使用量」計費，**服務閒置仍收基本費用**，屬於「有流量才貴、沒流量也有一點成本」的模式。",free:"提供試用額度（依帳號與活動）；正式使用沒有永久免費方案。",rows:[{tier:"佈建記憶體",price:"$0.007 / GB-小時",note:"0.5 GB 一個月約 $2.5。",level:1},{tier:"vCPU 使用",price:"$0.064 / vCPU-小時",note:"只在處理請求時計費。",level:3},{tier:"自動擴縮後 2 個實例",price:"約 $25 / 月",note:"受限於 max instances 設定。",level:2}],traps:["Min instances 設太高 → 無流量也一直付錢。","Max concurrency 設太低 → 每個請求都開新實例，成本暴增。"]},exam:["「最少設定、最快上線」→ App Runner；「需要精細網路 / sidecar」→ ECS + Fargate。","連私有 RDS 的關鍵字：**VPC Connector**。"],related:["ecs","fargate","elastic-beanstalk"]}];var f$=[{id:"s3",name:"Amazon S3",zh:"物件儲存 · Simple Storage Service",category:"storage",emoji:"\uD83E\uDEA3",tagline:"AWS 的萬用硬碟：任何檔案都丟進來，全世界都能讀，資料幾乎不會不見。",aliases:["bucket","物件儲存","object storage","bucket","靜態網站"],intro:["**S3（Simple Storage Service）** 是物件儲存：你在 **Bucket** 裡放 **Object**（檔案 + metadata + key），每個 bucket 名稱全球唯一，資料存在某個 Region。","它的三大特性是 **無限容量**、**11 個 9 的耐久性（11 nines）** 與 **高度可用**。物件不能像硬碟一樣「改一個 byte」，只能整個覆蓋——所以它適合檔案、備份、靜態網站、資料湖，不適合當資料庫。","S3 是 AWS 的樞紐服務：Log、備份、資料湖、靜態網站、CDN 來源、大數據輸入，幾乎所有服務都以它為中心。"],concepts:[{term:"Bucket / Object / Key",desc:"Bucket 是容器（全球唯一名稱、屬於某個 Region）；Object 是檔案；Key 是完整路徑（`photos/2026/cat.jpg`）。"},{term:"Storage Class",desc:"Standard / Intelligent-Tiering / Standard-IA / One Zone-IA / Glacier Instant / Glacier Flexible / Glacier Deep Archive，愈冷愈便宜但取回愈慢愈貴。"},{term:"Versioning",desc:"保留物件所有版本，可以復原誤刪或覆蓋。搭配 MFA Delete 防止被惡意刪除。"},{term:"Lifecycle Rule",desc:"自動把舊資料轉到更便宜的 class，或到期直接刪除——控制成本最重要的設定。"},{term:"Pre-Signed URL",desc:"給臨時授權的網址，讓沒有 AWS 憑證的人也能上傳 / 下載特定物件（有到期時間）。"},{term:"Replication",desc:"CRR（跨 Region）或 SRR（同 Region）自動複製，可用於合規與災難復原。"},{term:"Storage Lens",desc:"全組織的用量與成本分析儀表板，找出沒有 Lifecycle 的 bucket。"}],interactions:[{to:"cloudfront",dir:"out",how:"CloudFront 以 S3 為 origin 做 CDN，並用 OAC（Origin Access Control）限制只能透過 CloudFront 讀取。"},{to:"ec2",dir:"both",how:"應用程式讀寫 S3；大量流量建議走 VPC Endpoint（Gateway 類型）避免 NAT 費用。"},{to:"lambda",dir:"both",how:"S3 事件通知觸發 Lambda（圖片壓縮、檔案校驗）；Lambda 也反過來寫入結果。"},{to:"athena",dir:"both",how:"Athena 直接對 S3 上的檔案下 SQL，是「資料湖 + 查詢」的標準組合。"},{to:"glue",dir:"both",how:"Glue Crawler 掃 S3 建立 Data Catalog，ETL 任務讀寫 S3。"},{to:"iam",dir:"in",how:"Bucket policy 與 IAM policy 共同決定存取權限，兩種都要過才會成功。"},{to:"kms",dir:"both",how:"SSE-KMS 用 KMS key 加密物件，並產生 CloudTrail 稽核記錄。"},{to:"route53",dir:"in",how:"用 Alias record 把網域指到 S3 靜態網站端點或 CloudFront。"},{to:"eventbridge",dir:"out",how:"開啟 EventBridge 整合後，S3 事件可以送到 EventBridge 做更複雜的路由。"}],settings:[{name:"Block Public Access",required:!0,warn:!0,desc:"帳號層級與 bucket 層級都有。預設全開（擋住公開），要放靜態網站必須明確關掉——這是資料外洩最常見的元兇。"},{name:"Versioning",warn:!0,desc:"建議開啟；但要注意未刪除的舊版本仍會計費，要搭配 Lifecycle 清除非當前版本。"},{name:"Encryption",required:!0,desc:"SSE-S3（預設，免費）、SSE-KMS（可稽核、可跨帳號控制）、SSE-C（自己帶 key）、Client-side。"},{name:"Lifecycle rules",warn:!0,desc:"例：30 天轉 Standard-IA、90 天轉 Glacier、365 天刪除。沒設就是一直付 Standard 的錢。"},{name:"Object Ownership / ACL",desc:"建議用 `Bucket owner enforced` 關閉 ACL，只用 policy 管權限（ACL 是舊時代的東西）。"},{name:"Static website hosting",desc:"需要開啟並設定 index / error document，且必須關閉 Block Public Access。"},{name:"CORS",warn:!0,desc:"前端網頁直接抓 S3 檔案時必須設定；設定錯會出現「No Access-Control-Allow-Origin」的錯誤。"},{name:"Transfer Acceleration",desc:"透過 Edge 加速跨洲上傳，費用較高，只在上傳端離 bucket 很遠時才值得。"},{name:"Object Lock / MFA Delete",desc:"合規場景用 WORM（一次寫多次讀）鎖定；MFA Delete 防止版本被永久刪除。"}],pricing:{model:"按 **儲存容量（GB-月）** + **請求次數** + **資料傳輸** 計費。請求費用在大量小檔案時會比儲存費還貴。",free:"免費方案：5 GB Standard 儲存 + 20,000 GET + 2,000 PUT（12 個月）。",rows:[{tier:"S3 Standard",price:"$0.023 / GB-月",note:"最貴但最快最耐用，常用資料放這裡。",level:3},{tier:"S3 Standard-IA",price:"$0.0125 / GB-月",note:"很少讀但仍需即時取用；有 30 天最短存放期與取回費。",level:2},{tier:"S3 Glacier Instant Retrieval",price:"$0.004 / GB-月",note:"毫秒級取回但便宜 5 倍，適合每季讀一次的老資料。",level:1},{tier:"S3 Glacier Deep Archive",price:"$0.00099 / GB-月",note:"最便宜，取回要 12–48 小時，適合法規歸檔。",level:0},{tier:"PUT / GET 請求",price:"$0.005 / 1000 requests（PUT，Standard）",note:"上百萬個小檔案會讓請求費超過儲存費。",level:2},{tier:"資料傳輸 Out",price:"$0.09 / GB（前 10 TB）",note:"傳到網際網路才收；傳到 CloudFront 有優惠價格。",level:2}],traps:["**同一 Region 內 S3 → EC2 的流量免費，但經過 NAT Gateway 就要錢**：請用 Gateway 型 VPC Endpoint（免費）。","未清理的舊版本與不完整分段上傳（multipart）也會計費，記得加 Lifecycle 規則清 `AbortIncompleteMultipartUpload`。","Glacier 類別有**最短存放期**（90 / 180 天），提早刪除會被罰款。","大量小檔案 → 改用較大的物件或壓縮打包，可省下大量請求費。","跨 Region 複製的資料傳輸費與請求費都要算，別以為複製是免費的。"]},cli:["# 建立 bucket 並上傳（注意 region）","aws s3 mb s3://my-notes-2026 --region ap-northeast-1","aws s3 cp ./report.pdf s3://my-notes-2026/reports/","aws s3 sync ./dist s3://my-notes-2026/site --delete","","# 產生 10 分鐘有效的下載連結","aws s3 presign s3://my-notes-2026/report.pdf --expires-in 600"],exam:["「**便宜、可即時取回的長期儲存**」→ Glacier Instant Retrieval；「**最便宜、可等幾小時**」→ Deep Archive。","「**不確定的存取模式、想自動最佳化**」→ Intelligent-Tiering。","前端直傳 S3 → 用 **Pre-Signed URL**，不要給 Access Key。","跨帳號存取、公開網站 → 用 **Bucket Policy**；跨服務授權 → IAM Role。","CloudFront + S3 要限制「只能透過 CDN 讀取」→ **OAC（Origin Access Control）**。","一次（one-zone）與多 AZ 的差別：One Zone-IA 便宜但 AZ 掛掉就沒了。","S3 不是檔案系統、不能掛載成網路磁碟（要那樣請用 EFS 或 S3 File Gateway）。"],gotchas:["Bucket 名稱**全球唯一**且不能用大寫，取名失敗通常是撞名。","物件沒有真正的資料夾，`/` 只是 key 的一部分，所以「改名資料夾」等於複製所有物件。","S3 一致性現在是強一致性（strong consistency），但仍然不支援「部分修改」一個物件。","刪除 bucket 前必須先清空所有版本，否則會刪不掉。","Static website endpoint 只支援 HTTP，要 HTTPS 就必須配 CloudFront。"],related:["cloudfront","athena","vpc-endpoints","kms","ebs"]},{id:"ebs",name:"Amazon EBS",zh:"區塊儲存 · Elastic Block Store",category:"storage",emoji:"\uD83D\uDCBD",tagline:"EC2 的虛擬硬碟：可以隨時擴容、快照備份、加解密，但一次只能掛一台（少數例外）。",aliases:["volume","硬碟","區塊儲存","snapshot"],intro:["**EBS** 是給 EC2 用的網路磁碟（block storage）。它綁在**單一 AZ**，透過網路連到機器，所以機器換掉、硬碟還在（除非你設定一起刪除）。","這是一顆「硬碟」，所以你可以格式化、建檔案系統、當資料庫的儲存層——S3 做不到這些。但 EBS 也不能像 S3 那樣被多台機器同時讀寫（`io1/io2` Multi-Attach 例外，且限同 AZ）。","效能與 durability 取決於**磁碟類型**與**容量 / IOPS 設定**，這是選型時最重要的知識點。"],concepts:[{term:"gp3 / gp2",desc:"通用型 SSD。gp3 是預設選項：基準 3000 IOPS 可**獨立調高**（不必加大容量），比 gp2 便宜；gp2 的 IOPS 跟容量綁死（3 IOPS/GB）。"},{term:"io2 Block Express",desc:"最高效能的 SSD，支援極高 IOPS 與 Multi-Attach，給大型資料庫用。"},{term:"st1 / sc1",desc:"HDD：st1 適合串流與大檔案吞吐（throughput），sc1 最便宜但慢，只適合冷資料。"},{term:"Snapshot",desc:"增量備份，存在 S3（你看不到 bucket），可以跨 Region 複製、建立新磁碟。"},{term:"Encryption",desc:"磁碟加密（KMS），快照與由快照建立的磁碟自動繼承加密狀態。"},{term:"Multi-Attach",desc:"只有 io1/io2 支援，讓同 AZ 的多台 EC2 同時掛載同一個磁碟（需要叢集檔案系統配合）。"}],interactions:[{to:"ec2",dir:"both",how:"EBS 掛到 EC2 當系統碟或資料碟；`DeleteOnTermination` 決定機器刪除時磁碟要不要留。"},{to:"kms",dir:"in",how:"加密磁碟需要 KMS key；沒有 kms:CreateGrant 權限就無法建立加密磁碟。"},{to:"aws-backup",dir:"in",how:"用 AWS Backup 集中排程快照與保留政策，比手動建立快照可靠。"},{to:"cloudwatch",dir:"out",how:"Volume 的讀寫延遲、IOPS、佇列長度等指標送到 CloudWatch（gp2 的 burst 餘額也在這裡看）。"},{to:"auto-scaling",dir:"in",how:"ASG 建立機器時依 Launch Template 建立 / 掛載 EBS。"},{to:"ec2",dir:"out",how:"快照可以用來建立新磁碟或自訂 AMI，是備份與複製環境的基本功。"},{to:"s3",dir:"out",how:"快照實際存在 S3 上（由 AWS 管理），你也可以另外把檔案同步到自己的 bucket 做雙保險。"}],settings:[{name:"Volume type",required:!0,desc:"大部分情況用 gp3；需要極高 IOPS → io2；要便宜大容量 → st1 / sc1。"},{name:"Size / IOPS / Throughput",required:!0,warn:!0,desc:"gp3 的 IOPS 與 throughput 與容量**分開計價**，效能調高要多付錢。"},{name:"Delete on Termination",warn:!0,desc:"系統碟預設 true、資料碟預設 false。設錯會資料消失或多付一顆沒用的硬碟。"},{name:"Encryption",warn:!0,desc:"帳號層級可設「預設加密」，避免忘記設定。未加密的快照無法直接複製到已加密環境（要重新加密）。"},{name:"AZ",required:!0,warn:!0,desc:"磁碟與機器一定要同一個 AZ 才能掛載，跨 AZ 只能透過快照複製。"},{name:"Multi-Attach",desc:"僅 io1/io2 且同 AZ；需要叢集感知的檔案系統（如 GFS2）才能安全共用。"},{name:"Snapshot schedule",desc:"用 Data Lifecycle Manager（DLM）自動建立與保留快照。"},{name:"Instance Store 替代",desc:"極高 IOPS、可犧牲資料的場景（快取、暫存）用 instance store 更划算。"}],pricing:{model:"以 **GB-月** 計費（gp3 另有 IOPS 與 throughput 單位費用）；快照以 **GB-月** 增量計費。",free:"免費方案：30 GB gp2/gp3 + 1 GB 快照（12 個月）。",rows:[{tier:"gp3",price:"$0.08 / GB-月",note:"3000 IOPS 與 125 MB/s 已內含，超出的部分另外收費。",level:2},{tier:"gp2",price:"$0.10 / GB-月",note:"貴一點且效能與容量綁定，新環境建議直接用 gp3。",level:2},{tier:"io2 Block Express",price:"$0.125 / GB-月 + $0.065 / IOPS-月",note:"極高效能，資料庫用，成本三級跳。",level:5},{tier:"st1 HDD",price:"$0.045 / GB-月",note:"大容量吞吐型，適合日誌與串流。",level:1},{tier:"sc1 HDD",price:"$0.015 / GB-月",note:"最便宜，冷資料專用。",level:0},{tier:"Snapshot 標準",price:"$0.05 / GB-月",note:"只算實際變更過的增量資料。",level:1}],traps:["**停止的 EC2 仍收 EBS 費用**，這是「關機怎麼還有帳單」的最常見原因。","gp2→gp3 通常更便宜又快，但很多舊環境沒改，白白多付。","快照雖然是增量，但累積幾十個版本後總量仍可觀；用 DLM 設定保留期限。","io2 的 IOPS 費用遠高於容量費，規劃時要算清楚。"]},cli:["aws ec2 create-volume --availability-zone ap-northeast-1a \\","  --size 100 --volume-type gp3 --iops 6000 --throughput 250 --encrypted","aws ec2 attach-volume --volume-id vol-123 --instance-id i-456 --device /dev/xvdf",'aws ec2 create-snapshot --volume-id vol-123 --description "before upgrade"'],exam:["需要 **暫時性的超高效能儲存、資料可以不要** → Instance Store；需要**持久、可備份** → EBS。","IOPS 不足但不想加容量 → **gp3**（可獨立調整 IOPS）。","多台 EC2 同時讀寫同一個磁碟 → **io2 Multi-Attach**（同 AZ）。","跨 AZ 搬磁碟 → 只能靠**快照**。","根目錄磁碟刪除時要一起刪 → 勾 `DeleteOnTermination`。"],gotchas:["EBS 綁 AZ，跨 AZ 部署時每台機器的磁碟都是獨立的。","snapshot 是增量但**還原時是完整磁碟**，第一次還原會比較慢（lazy loading，可用 Fast Snapshot Restore 加速但要錢）。","未加密磁碟無法直接變成加密，必須透過加密快照重建。","gp2 有 burst 機制，用完 burst credit 效能會掉，小容量的 gp2 特別容易發生。"],related:["ec2","aws-backup","kms","efs","s3"]},{id:"efs",name:"Amazon EFS",zh:"彈性檔案系統（NFS）",category:"storage",emoji:"\uD83D\uDDC2️",tagline:"多台 Linux 機器共用的網路磁碟：會自己長大、長小，像雲端的 NFS。",aliases:["nfs","檔案系統","file system","共享儲存"],intro:["**EFS（Elastic File System）** 是託管的 **NFS** 檔案系統，可以同時被**多台 EC2 / ECS / EKS / Lambda** 掛載（同 Region 跨 AZ），容量自動擴縮，不用事先規劃。","適合「多台機器要看到同一份檔案」的場景：Web 伺服器共用的上傳目錄、容器共享設定、機器學習的訓練資料集、CMS 的 shared storage。","缺點是比 EBS 貴、且延遲較高（網路檔案系統），也不是 Windows 用的（Windows 要用 [[fsx|FSx for Windows]]）。"],concepts:[{term:"Storage Class",desc:"Standard（多 AZ）與 One Zone（單 AZ，便宜 47%）。另有 IA（Infrequent Access）與 Archive 層，靠 Lifecycle 自動搬移。"},{term:"Performance Mode",desc:"General Purpose（預設，延遲低）與 Max I/O（高吞吐但延遲較高，現在很少需要）。"},{term:"Throughput Mode",desc:"Bursting（依容量決定吞吐）、Provisioned（指定吞吐量，適合容量小但要高效能）、Elastic（自動依用量調整，推薦）。"},{term:"Mount Target",desc:"每個 AZ 一個 mount target，機器用 `mount -t nfs4` 掛載對應 AZ 的位址。"},{term:"Access Point",desc:"用應用程式層級的路徑與權限（POSIX UID/GID）隔離，Lambda / 容器最常用。"}],interactions:[{to:"ec2",dir:"both",how:"多台 EC2 掛載同一個 EFS，共用上傳檔案與設定；跨 AZ 也能同時掛載。"},{to:"ecs",dir:"both",how:"Fargate 支援 EFS volume，讓多個 Task 共享持久化資料。"},{to:"eks",dir:"both",how:"EFS CSI Driver 提供 ReadWriteMany 的 PV，補足 EBS 只能單 Pod 的限制。"},{to:"lambda",dir:"both",how:"Lambda 可以掛載 EFS（需在 VPC 內），適合需要大檔案或共享狀態的函式。"},{to:"vpc",dir:"in",how:"必須在 VPC 內，每個 AZ 建立 mount target 並開放 NFS（2049）Security Group。"},{to:"kms",dir:"in",how:"EFS 靜態加密使用 KMS key（也可選用 TLS 做傳輸中加密）。"},{to:"cloudwatch",dir:"out",how:"提供 BurstCreditBalance、PercentIOLimit、ClientConnections 等指標。"},{to:"datasync",dir:"in",how:"從地端 NFS 或 S3 同步資料到 EFS，是混合雲搬遷的常見組合。"}],settings:[{name:"Storage class",required:!0,desc:"多 AZ 高可用 → Standard；可接受單 AZ 且要省錢 → One Zone。"},{name:"Throughput mode",required:!0,warn:!0,desc:"Bursting 在小容量時吞吐極低，容易踩雷；Elastic 是現在的最佳預設。"},{name:"Lifecycle management",warn:!0,desc:"設定「N 天沒存取就移到 IA / Archive」，可省下 80% 以上成本。"},{name:"Encryption at rest",desc:"建立時設定，無法之後更改（要建新的再搬）。"},{name:"Access points",desc:"為每個應用建立獨立入口與 POSIX 權限，避免權限大亂鬥。"},{name:"Security Group / Mount target",warn:!0,desc:"沒開 2049 就完全掛不上；NFS 沒有內建身分驗證，安全性全靠網路層。"},{name:"Backup policy",desc:"內建備份（AWS Backup）可一鍵啟用，EFS 不是備份方案本身。"}],pricing:{model:"按 **實際使用容量（GB-月）** 計費，沒有預先配置容量的概念；另有 throughput 與 IA 層的費用。",free:"沒有免費額度（新帳號 EC2 免費方案不含 EFS）。",rows:[{tier:"Standard（多 AZ）",price:"$0.30 / GB-月",note:"比 S3 貴 13 倍，但換來多機共享與 POSIX 語意。",level:4},{tier:"Standard-IA",price:"$0.016 / GB-月",note:"加收存取費，適合很少讀的檔案。",level:1},{tier:"One Zone",price:"$0.16 / GB-月",note:"便宜約 47%，但 AZ 故障時資料不可用。",level:2},{tier:"Provisioned throughput",price:"$6 / MB/s-月",note:"Elastic 模式則依實際吞吐計費（$0.03/GB 讀、$0.06/GB 寫）。",level:4}],traps:["容量按**檔案實際大小**計費，刪檔案要等一段時間才會反映（有延遲）。","Bursting 模式在小容量時吞吐只有幾 MB/s，誤以為 EFS 很慢。","沒設 Lifecycle，所有資料都留在最貴的 Standard 層。","被大量不同 AZ 的機器掛載會產生跨 AZ 流量費。"]},cli:["aws efs create-file-system --performance-mode generalPurpose --throughput-mode elastic --encrypted","aws efs create-mount-target --file-system-id fs-123 --subnet-id subnet-aaa --security-groups sg-456","# 在 EC2 上掛載","sudo mount -t nfs4 -o nfsvers=4.1,rsize=1048576,wsize=1048576 fs-123.efs.ap-northeast-1.amazonaws.com:/ /mnt/efs"],exam:["「**多台 Linux 機器共享檔案**」→ EFS；「**Windows 共享**」→ FSx for Windows；「**單機硬碟**」→ EBS。","要**省錢又不需要多 AZ** → One Zone。","Linux 容器需要 ReadWriteMany 的 PV → EFS。","EFS 是 NFS（不是 SMB），Windows 不能直接掛。","成本高於 S3，適合真的需要檔案系統語意的場景。"],gotchas:["NFS 沒有認證機制，安全邊界是 Security Group 與 VPC。","Zone 選錯（One Zone 建在 A，機器在 B）會掛不上。","加密設定建立後不可改。","大量小檔案頻繁讀寫的效能不如本地 EBS。"],related:["fsx","ec2","ecs","eks","datasync"]},{id:"fsx",name:"Amazon FSx",zh:"高效能檔案系統家族",category:"storage",emoji:"\uD83E\uDE9F",tagline:"四種專業檔案系統任選：Windows、Lustre、NetApp ONTAP、OpenZFS。",aliases:["windows file server","lustre","ontap","openzfs","smb"],intro:["**FSx** 是一組「託管的專業檔案系統」，因為不同的工作負載需要不同的檔案系統語意，所以 AWS 提供四種：","**FSx for Windows File Server**（SMB、AD 整合，Windows 應用與共用槽）、**FSx for Lustre**（HPC / 機器學習的極高吞吐）、**FSx for NetApp ONTAP**（企業級功能與多協定）、**FSx for OpenZFS**（支援 ZFS 快照與壓縮）。","判斷方式：**Windows / SMB → Windows File Server；HPC 或 S3 資料集 → Lustre；要 NFS+SMB 多協定與企業功能 → ONTAP；要 ZFS 特性 → OpenZFS**。"],concepts:[{term:"FSx for Windows",desc:"原生 SMB / NTFS，支援 Active Directory 整合、DFS、Shadow Copies，可跨 AZ 部署（Multi-AZ）。"},{term:"FSx for Lustre",desc:"為 HPC 設計，可達數百 GB/s 吞吐；可**直接連結 S3 bucket** 當成檔案系統讀寫。"},{term:"FSx for NetApp ONTAP",desc:"支援 NFS、SMB、iSCSI，有 SnapMirror、去重、壓縮、分層等企業級功能。"},{term:"FSx for OpenZFS",desc:"NFS 介面 + ZFS 快照 / 複製，適合想從地端 ZFS 搬上來的場景。"},{term:"Lustre 的 scratch vs persistent",desc:"Scratch 便宜但不複製資料（適合暫存），Persistent 會複製且高可用（適合長期）。"}],interactions:[{to:"ec2",dir:"both",how:"Linux 機器掛 Lustre / OpenZFS，Windows 機器掛 Windows File Server。"},{to:"s3",dir:"both",how:"Lustre 可以連結 S3 資料集，把物件當檔案讀；也可把結果寫回 S3。"},{to:"directory-service",dir:"in",how:"Windows File Server 需要 AD（AWS Managed Microsoft AD 或自建）做身分驗證。"},{to:"vpc",dir:"in",how:"建在 VPC 內，跨 AZ 用 Multi-AZ 部署，Security Group 控制 SMB/NFS 存取。"},{to:"aws-backup",dir:"in",how:"FSx 支援自動備份與 AWS Backup 集中政策（Lustre 除外）。"},{to:"datasync",dir:"in",how:"把地端檔案伺服器資料搬到 FSx。"},{to:"lambda",dir:"in",how:"少見但可行：Lambda 在 VPC 內掛載 FSx for Windows（Lustre 不支援 Lambda）。"},{to:"batch",dir:"both",how:"HPC 批次工作搭配 Lustre 是典型組合。"}],settings:[{name:"FSx 類型",required:!0,desc:"先決定要用哪一種：Windows、Lustre、ONTAP、OpenZFS，之後不能換。"},{name:"Deployment type",required:!0,desc:"Single-AZ（便宜）與 Multi-AZ（高可用，standby 會自動接手）。"},{name:"Storage capacity / 類型",required:!0,desc:"SSD（低延遲）與 HDD（大容量便宜）可選；後續可擴容但不能縮。"},{name:"Throughput capacity",warn:!0,desc:"Windows / ONTAP 要指定 MB/s 等級，選太低會成為效能瓶頸。"},{name:"AD 整合",warn:!0,desc:"Windows File Server 必須決定加入哪個 AD、用哪個 OU 與服務帳號。"},{name:"加密",desc:"KMS 靜態加密 + 可選傳輸中加密。"},{name:"Backup / Snapshot",desc:"自動備份排程與保留天數；Lustre 提供 S3-backed 的替代方案。"}],pricing:{model:"按 **每 GB-月儲存** + **吞吐容量** 計費（Windows / ONTAP），Lustre 亦按容量與類型。備份另有 GB-月費用。",free:"沒有免費額度。",rows:[{tier:"Windows File Server SSD",price:"$0.13 / GB-月 + 吞吐費",note:"32 MB/s 吞吐約 $0.21/小時，入門價位不低。",level:3},{tier:"Lustre SSD",price:"$0.145 / GB-月",note:"HPC 等級效能，常搭配暫存與 S3 資料集。",level:3},{tier:"ONTAP SSD",price:"$0.125 / GB-月 + 吞吐費",note:"企業功能多，價格相對高。",level:3},{tier:"HDD 選項（Lustre / Windows）",price:"$0.013 / GB-月 起",note:"容量大但延遲高，適合歸檔或大量序列讀取。",level:1}],traps:["Windows / ONTAP 的**吞吐容量費用可能超過儲存費**，先估算需要的 MB/s。","Multi-AZ 的成本約為 Single-AZ 的兩倍。","容量只能增加不能減少，規劃錯了要重建。"]},exam:["「**Windows 應用、SMB、AD 整合**」→ FSx for Windows File Server。","「**HPC / 機器學習、極高吞吐、連結 S3**」→ FSx for Lustre。","「**多協定（NFS + SMB + iSCSI）、企業功能**」→ FSx for NetApp ONTAP。","Linux 共享且預算優先 → EFS；Windows 共享 → FSx for Windows。"],gotchas:["FSx 不接受 lambda 掛載 Lustre；不同 FSx 家族的支援能力差很多。","Lustre scratch 不會複製資料，機器故障時可能丟資料。","遷移現有 FSx 到另一種類型不像改設定，需要資料搬移。"],related:["efs","storage-gateway","directory-service","aws-backup"]},{id:"storage-gateway",name:"AWS Storage Gateway",zh:"混合雲儲存閘道",category:"storage",emoji:"\uD83C\uDF09",tagline:"讓地端伺服器無痛使用雲端儲存：三種模式對應檔案、磁碟區與磁帶。",aliases:["hybrid","混合雲","檔案閘道","volume gateway","tape"],intro:["**Storage Gateway** 是把地端環境連上 AWS 儲存的橋樑。它是地端的 VM / 硬體，提供標準介面（NFS / SMB / iSCSI），背後把資料送到 S3、EBS 快照或 Glacier。","三種模式：**S3 File Gateway**（NFS/SMB → S3，最常用）、**Volume Gateway**（iSCSI 磁碟區 → S3 + EBS 快照）、**Tape Gateway**（虛擬磁帶櫃 → S3 Glacier，取代實體 LTO）。","核心價值是「**保留既有應用架構**」：應用不用改，檔案仍在地端快取，只是備份與歸檔自動上雲。"],concepts:[{term:"S3 File Gateway",desc:"地端以 NFS / SMB 掛載，檔案存成 S3 物件；本機保留快取讓熱資料讀得快。"},{term:"Volume Gateway",desc:"Cached（主資料在雲端、本機快取）與 Stored（主資料在地端、非同步備份到雲端）。"},{term:"Tape Gateway",desc:"建立 Virtual Tape Library，備份軟體以為在寫磁帶，其實存到 S3 / Glacier。"},{term:"Local Cache",desc:"本機硬碟當快取，容量決定熱資料命中率與效能。"},{term:"File Share / Access",desc:"S3 File Gateway 有多種檔案共享與 access pattern 設定。"}],interactions:[{to:"s3",dir:"out",how:"所有模式的資料最終存放於 S3（Volume Gateway 的快照也是 S3-backed）。"},{to:"s3",dir:"out",how:"Tape Gateway 的虛擬磁帶與 S3 Lifecycle 可把歸檔資料推進 Glacier 系列儲存類別。"},{to:"ebs",dir:"out",how:"Volume Gateway 的快照可還原成 EBS volume，直接掛到 EC2。"},{to:"aws-backup",dir:"in",how:"Volume Gateway 可納入 AWS Backup 的集中政策。"},{to:"iam",dir:"in",how:"閘道需要 service role 與權限才能寫入 S3。"},{to:"direct-connect",dir:"in",how:"大量資料同步建議走 Direct Connect，比公網 VPN 穩定便宜。"},{to:"kms",dir:"in",how:"加密資料 00 TB 用 100 Mbps 上傳要 90 天以上——這時候 Snowball 只要一週。"],concepts:[{term:"Snowball Edge",desc:"有 Storage Optimized（80 TB）與 Compute Optimized 兩種；可在地端跑 Lambda 與 EC2 做邊緣處理。"},{term:"Snowcone",desc:"8 TB（HDD）/ 14 TB（SSD），可透過 DataSync agent 使用，適合小型站點。"},{term:"運算能力",desc:"Compute Optimized 可跑 Lambda 函式 / EC2 執行個體，在無網路的環境先處理資料。"},{term:"加密",desc:"資料以 KMS 256-bit 加密，金鑰不會離開 AWS。"},{term:"Job / Cluster",desc:"一次搬運任務；多台裝置可組成 cluster 增加容量與運算。"}],interactions:[{to:"s3",dir:"out",how:"匯入的資料最終進入指定 S3 bucket（可指定 Glacier 等 storage class 與 Lifecycle）。"},{to:"kms",dir:"in",how:"使用 KMS key 加密裝置內容，並在解密匯入時驗證。"},{to:"lambda",dir:"in",how:"Snowball Edge Compute Optimized 可在地端執行 Lambda 做前處理。"},{to:"ec2",dir:"in",how:"同樣在地端執行 EC2 相容的執行個體做邊緣運算。"},{to:"iam",dir:"in",how:"建立 job 需要 IAM 權限與 S3 授權。"},{to:"datasync",dir:"out",how:"Snowcone / Edge 上可執行 DataSync agent 做自動化同步。"}],settings:[{name:"裝置類型",required:!0,desc:"依資料量與是否需要邊緣運算選擇；資料量小於 10 TB 且網路可行就用 DataSync。"},{name:"S3 bucket / prefix",required:!0,desc:"匯入目的地，建議先建立專用 bucket 與規則。"},{name:"KMS key",required:!0,desc:"沒有 key 就無法解密取回資料。"},{name:"Shipping address / 物流",desc:"需要能收貨的地址與人員，跨國運送要處理海關文件。"},{name:"Edge computing 設定",desc:"部署 Lambda / AMI 到裝置，以及回傳的結果處理方式。"},{name:"Job type",desc:"Import to S3、Export from S3、Local compute and storage。"}],pricing:{model:"依 **裝置類型收取固定費用**（含運送與 10 天使用期）+ 少量資料傳輸費；延長使用另計。",free:"沒有免費額度。",rows:[{tier:"Snowcone",price:"約 $60 / 次 + 額外天數",note:"資料量小、偏遠地區現場使用。",level:2},{tier:"Snowball Edge Storage Optimized",price:"約 $300 / 次（含 10 天）",note:"80 TB 裝置，最常見的選擇。",level:3},{tier:"運算最佳化 / GPU 版本",price:"約 $400–$600 / 次",note:"能在地端跑 ML 推論等運算。",level:4},{tier:"資料匯入費用",price:"$0 起（進 AWS 免傳輸費）",note:"S3 儲存與 Lifecycle 費用另計。",level:0}],traps:["超過 10 天租期會按天加收，忘了寄回就持續計費。","若要從 S3 匯出到裝置，匯出會產生資料傳輸費。","裝置不見了要賠償（很貴），物流與保管要小心。"]},exam:["「**TB 等級以上、網路太慢 / 不穩定、一次搬遷**」→ Snowball。","「**幾 TB、現場小型**」→ Snowcone。","「**需要在地端運算**」→ Snowball Edge Compute Optimized。","「**持續性的資料同步**」→ DataSync；「一次性大量」→ Snow Family。","「**PB 等級**」→ 多台 Snowball Edge 或 Snowmobile。"],gotchas:["Snowball 進出資料的速度受限於你的地端磁碟與網路，實際複製時間要算進去。","Snowball 與 Storage Gateway 常被混淆：前者是搬運，後者是長期混合架構。","出口匯出（Export）的費用與時間都比匯入高。"],related:["s3","datasync","storage-gateway","aws-backup"]},{id:"aws-backup",name:"AWS Backup",zh:"集中式備份服務",category:"storage",emoji:"\uD83D\uDEDF",tagline:"一個地方管理所有服務的備份：排程、保留、跨 Region、跨帳號一次搞定。",aliases:["backup","備份","保管庫","vault"],intro:["**AWS Backup** 把散落在各服務的備份功能集中管理：EC2（EBS 快照）、EBS、EFS、FSx、RDS、Aurora、DynamoDB、DocumentDB、Neptune、Storage Gateway、S3、Redshift 等。","你定義 **Backup Plan**（排程 + 保留規則），指定 **Backup Vault**（加密儲存庫），備份就自動執行，並支援**跨 Region 與跨帳號**複製以符合合規要求。","跟直接寫 Lambda 做快照相比，它提供稽核、保留鎖定（Vault Lock，WORM）、以及一眼看盡所有資源保護狀態的介面。"],concepts:[{term:"Backup Plan",desc:"備份排程（cron）、保留期限、生命週期（冷儲存轉換）。"},{term:"Backup Vault",desc:"存放備份的容器，可用 KMS 加密並設定存取政策。"},{term:"Vault Lock",desc:"合規模式（Compliance）下無法刪除，WORM 保護——被勒索軟體攻擊時的最後防線。"},{term:"Resource Assignment",desc:"用 tag 自動把新資源納入備份（例如 `backup=daily`）。"},{term:"Cross-Region / Cross-Account",desc:"自動複製備份到其他 Region 或隔離帳號，這是最實際的防勒索做法。"},{term:"Restore Testing",desc:"定期自動還原測試，確保備份真的能用。"}],interactions:[{to:"ebs",dir:"in",how:"EBS 快照是主要備份對象，還原後可掛到 EC2。"},{to:"rds",dir:"in",how:"RDS / Aurora 的 snapshot 與時間點還原（PITR）由 Backup 統一管理。"},{to:"dynamodb",dir:"in",how:"DynamoDB 的 on-demand backup 可納入計畫。"},{to:"efs",dir:"in",how:"EFS 的 automatic backup 由 AWS Backup 提供。"},{to:"s3",dir:"in",how:"S3 備份（含版本）可納入。"},{to:"kms",dir:"in",how:"Vault 與備份加密使用 KMS key，跨帳號備份需要 key policy 配合。"},{to:"organizations",dir:"both",how:"用 Backup Policy 在組織層級強制所有帳號套用備份計畫。"},{to:"cloudwatch",dir:"out",how:"備份任務成功 / 失敗事件可觸發告警與通知。"},{to:"iam",dir:"in",how:"備份角色需要有各服務的快照權限。"}],settings:[{name:"Backup schedule / window",required:!0,desc:"cron 表達式與備份時間窗；避開業務高峰。"},{name:"Retention",required:!0,desc:"保留天數 / 月數 / 年數。保留愈久成本愈高。"},{name:"Lifecycle to cold storage",warn:!0,desc:"設定 N 天後轉到冷儲存，可省 70% 以上，但還原更久。"},{name:"Vault Lock",desc:"Compliance 模式一旦設定就無法移除，設定前想清楚。"},{name:"Cross-Region copy / Cross-Account copy",desc:"合規與勒索防護的關鍵；注意跨區傳輸費。"},{name:"Resource assignment by tag",desc:"沒有 tag 的資源不會被備份，建議建立 tag 政策。"},{name:"Windows VSS / 應用一致性",desc:"EC2 備份若要應用一致性（如 SQL Server）需啟用 VSS。"}],pricing:{model:"按 **備份儲存（GB-月）**+ **還原時的資料量** 計費，加上跨 Region 複製的傳輸費；備份服務本身免費。",free:"沒有免費額度（EBS 快照有 1 GB 免費）。",rows:[{tier:"Warm storage（一般備份）",price:"$0.05 / GB-月",note:"與 EBS 快照同價。",level:1},{tier:"Cold storage",price:"$0.01 / GB-月",note:"需至少 90 天保留，還原較慢。",level:0},{tier:"還原資料",price:"$0.02 / GB",note:"大量還原（災難復原）時要估進去。",level:1},{tier:"跨 Region 複製",price:"傳輸費 + 目的地的儲存費",note:"跨區備份等於兩份成本。",level:2}],traps:["備份保留期愈長，儲存費愈像複利；定期檢視真的需要留多久。","跨 Region 複製看起來便宜，但累積起來是雙倍儲存。","沒有開啟 Vault Lock 的備份可以被有權限的人刪除，勒索軟體最愛。"]},exam:["跨服務、跨帳號的集中備份政策 → **AWS Backup**。","合規要求的不可刪除備份 → **Vault Lock（Compliance 模式）**。","勒索軟體防護 → 跨帳號 + Vault Lock + 冷儲存。","RPO / RTO 很短的需求 → 看 [[elastic-disaster-recovery|AWS Elastic Disaster Recovery]] 而不是備份。"],gotchas:["Backup 不是複寫：RPO 以小時計，不能取代 Multi-AZ 或 DR 策略。","不支援的服務（例如 ElastiCache、Redshift 部分功能）仍需各自的備份機制。","備份角色權限不足會讓任務默默失敗，要看 CloudWatch 事件。"],related:["ebs","rds","organizations","elastic-disaster-recovery"]},{id:"datasync",name:"AWS DataSync",zh:"資料同步服務",category:"storage",emoji:"\uD83D\uDD01",tagline:"把檔案從地端或雲端之間搬來搬去，自動化、可驗證、比 scp 快很多。",aliases:["sync","搬資料","rsync","檔案同步"],intro:["**DataSync** 是自動化的檔案傳輸服務：在地端 NFS / SMB / HDFS 或雲端 S3 / EFS / FSx 之間搬移資料，內建加密、完整性驗證、頻寬控制與排程。","它會**自動處理 metadata（權限、時間戳）** 並可做**增量同步**，速度比自製 rsync / scp 腳本快得多，還能在 CloudWatch 看到每個檔案的成功與失敗。","一次搬大量資料到 S3？可以搭配 **Snowcone** 當 DataSync agent，或直接用 Snowball。長期混合架構持續同步則用 DataSync 排程。"],concepts:[{term:"Agent",desc:"地端需要一台 VM agent 存取來源檔案系統（雲端對雲端不需要）。"},{term:"Location",desc:"來源與目的地的定義（NFS / SMB / HDFS / S3 / EFS / FSx）。"},{term:"Task",desc:"一次傳輸設定：來源、目的、排程、驗證方式、頻寬上限。"},{term:"Data verification",desc:"只驗證檔案大小與時間（快）或完整 checksum（慢但可靠）。"},{term:"Filtering",desc:"可用 include / exclude pattern 只搬特定檔案（例如只搬 `*.csv`）。"}],interactions:[{to:"s3",dir:"both",how:"最常見的目的地：地端檔案系統 → S3，並可指定 storage class 與 metadata。"},{to:"efs",dir:"both",how:"地端 NFS → EFS，Linux 應用上雲時的第一步。"},{to:"fsx",dir:"both",how:"搬到 FSx for Windows（SMB）或 Lustre（HDFS / NFS），含 Windows ACL 保留。"},{to:"snow-family",dir:"both",how:"Snowcone 內建 DataSync agent，離線搬運也能自動化。"},{to:"vpc",dir:"both",how:"雲端端的 location 需要 VPC 端點或子網存取權限。"},{to:"kms",dir:"in",how:"傳輸中 TLS 與靜態加密使用 KMS。"},{to:"cloudwatch",dir:"out",how:"BytesTransferred、FilesSkipped 等指標與 log，是驗證搬遷完整性的依據。"},{to:"iam",dir:"in",how:"任務執行角色需要來源與目的地的讀寫權限。"}],settings:[{name:"Source / Destination location",required:!0,desc:"地端需要 agent；S3 目的地建議啟用 integrity 與 logging。"},{name:"Task mode",required:!0,desc:"Basic（依預設邏輯覆蓋）或 Enhanced（可選保留 metadata、覆蓋行為更細緻）。"},{name:"Transfer mode",warn:!0,desc:"只傳有變更的資料（incremental）才是重點，設定錯誤會全量重傳。"},{name:"Verification",desc:"Checksum 最可靠但較慢；純大小比對最快但風險高。"},{name:"Bandwidth limit",warn:!0,desc:"不限速會把公司對外頻寬吃光，一定要設。"},{name:"Schedule",desc:"可週期性同步（例如每小時），是混合雲的持續同步方案。"},{name:"CloudWatch logs",desc:"開啟可看到每個被略過或失敗的檔案。"}],pricing:{model:"按 **傳輸的資料量（GB）** 計費（$0.0125 / GB），加上來源與目的地的請求、儲存與流量費。",free:"沒有免費額度。",rows:[{tier:"資料傳輸",price:"$0.0125 / GB",note:"10 TB 約 $128，通常比人工維運便宜。",level:1},{tier:"雲端端傳輸（同 Region）",price:"$0.0125 / GB + 請求費",note:"S3 ↔ EFS 等同 Region 移動仍有請求成本。",level:1},{tier:"Agent 執行成本",price:"EC2 / VM 成本",note:"地端 VM 由你負擔；AWS 端建議用 m5 系列。",level:2}],traps:["頻繁小檔案同步會讓請求費超過傳輸費。","跨 Region 傳輸會另外收流量費。","Agent 頻寬或 CPU 不足會讓同步比預期慢很多。"]},exam:["「**持續性、自動化的檔案同步**」→ DataSync。","「**一次性、PB 等級、網路不足**」→ Snow Family。","「**需要保留 POSIX / Windows metadata**」→ DataSync（而非簡單 copy）。","Storage Gateway 是「保留地端存取介面」，DataSync 是「把資料搬過去」。"],gotchas:["不支援「雙向同步」：它是單向任務（要雙向就建兩個任務，但衝突處理要自己負責）。","SMB 來源的 ACL 保留需要特定設定。","忘記設頻寬上限會影響生產網路。"],related:["s3","efs","fsx","snow-family","storage-gateway"]}];var x$=[{id:"rds",name:"Amazon RDS",zh:"關聯式資料庫服務（SQL）",category:"database",emoji:"\uD83D\uDC18",tagline:"託管的 PostgreSQL / MySQL / SQL Server / Oracle / MariaDB：資料庫還是你的，維運是 AWS 的。",aliases:["sql","mysql","postgres","資料庫","oracle","mssql"],intro:["**RDS（Relational Database Service）** 幫你管理資料庫的底層：安裝、修補、備份、Multi-AZ 容錯、讀取擴展，你只要管 schema 與資料。","支援 **PostgreSQL、MySQL、MariaDB、Oracle、SQL Server**，以及自家相容版 [[aurora|Aurora]]。你不能 SSH 進資料庫主機（這是刻意的設計），也因此少了「作業系統層」的維運負擔。","什麼時候不用 RDS？資料量極大需要自訂調校 → 自己在 EC2 上跑；需要非關聯式或超高併發 → [[dynamodb|DynamoDB]]；需要全球分散 → Aurora Global Database。"],concepts:[{term:"Multi-AZ",desc:"同步複製到另一個 AZ 的 standby，主機故障時自動切換（約 1–2 分鐘）。**這是高可用，不是讀取擴展**。"},{term:"Read Replica",desc:"非同步複製的唯讀副本，用來分散讀取流量；可以跨 AZ 甚至跨 Region。"},{term:"Backup / PITR",desc:"自動備份最多保留 35 天，可還原到任意時間點（Point-in-Time Recovery）。"},{term:"Parameter Group / Option Group",desc:"資料庫參數（例如 `max_connections`）與功能選項（例如 Oracle 的 APEX）的設定集合。"},{term:"Subnet Group",desc:"資料庫要放在哪些子網（通常是兩個私有子網才支援 Multi-AZ）。"},{term:"RDS Proxy",desc:"連線池代理，解決 Lambda / 大量短連線打爆資料庫的問題。"}],interactions:[{to:"ec2",dir:"in",how:"應用程式從 EC2（或容器）連線到 RDS 的 3306 / 5432 port，透過 Security Group 控制來源。"},{to:"lambda",dir:"in",how:"Lambda 連線 RDS 一定要搭配 **RDS Proxy**，否則併發一高就會耗盡連線數。"},{to:"secrets-manager",dir:"both",how:"RDS 可以自動輪換密碼並存到 Secrets Manager，應用程式動態取得憑證。"},{to:"kms",dir:"in",how:"RDS 靜態加密使用 KMS key（建立後無法更改，要改只能重建）。"},{to:"cloudwatch",dir:"out",how:"提供 CPU、連線數、儲存空間、ReplicaLag 等指標，可設定告警。"},{to:"aws-backup",dir:"in",how:"快照與 PITR 可納入中央備份政策與跨帳號複製。"},{to:"vpc",dir:"in",how:"資料庫放在私有子網，只有應用層能連線；不要開公開存取。"},{to:"iam",dir:"both",how:"IAM Database Authentication 讓應用用 IAM 憑證登入，不必管理密碼。"},{to:"elasticache",dir:"out",how:"讀取量大的應用在前面加一層 Redis / Memcached 快取。"}],settings:[{name:"Engine & version",required:!0,desc:"引擎一旦選定不能改（只能透過快照還原到新引擎）。"},{name:"Multi-AZ deployment",required:!0,warn:!0,desc:"生產環境必開；開發環境可關閉省成本。注意它**不會增加讀取效能**。"},{name:"Storage type & autoscaling",desc:"gp3 / io1 等；開啟 storage autoscaling 避免「磁碟滿了就整個掛掉」。"},{name:"Public accessibility",warn:!0,desc:"預設 No。設 Yes 且 Security Group 開太大等於把資料庫放到公網。"},{name:"Backup retention period",warn:!0,desc:"預設 7 天，可到 35 天。設 0 等於關閉自動備份（很危險）。"},{name:"Deletion protection",desc:"防止誤刪；但設了之後連 CloudFormation 刪除都會失敗，記得先關。"},{name:"Encryption at rest",warn:!0,desc:"建立時就要決定；未加密的執行個體不能事後加密，只能加密快照再還原。"},{name:"Enhanced Monitoring / Performance Insights",desc:"看得到實際的 SQL 與等待事件，是調校效能的第一步。"}],pricing:{model:"依 **執行個體規格（小時）** + **儲存空間（GB-月）** + **備份超出量** + **I/O（io1）** 計費。Multi-AZ 約為單機的**兩倍**。",free:"免費方案：t2/t3.micro 750 小時 + 20 GB 儲存（12 個月）。",rows:[{tier:"db.t3.micro（單機）",price:"約 $0.017 / 小時",note:"約 $12/月，只在開發測試用。",level:1},{tier:"db.m6g.large（Multi-AZ）",price:"約 $0.30 / 小時",note:"約 $220/月，正式環境的常見起點。",level:3},{tier:"儲存 gp3",price:"$0.115 / GB-月",note:"加上 IOPS 與 throughput 加購費。",level:2},{tier:"備份儲存",price:"$0.095 / GB-月",note:"等於資料庫大小的備份量免費，超過才收費。",level:1}],traps:["Multi-AZ 是**兩倍費用**，很多開發環境忘了關。","**Storage autoscaling** 沒開，磁碟滿了資料庫直接進 storage-full 狀態而停擺。","Read Replica 也要錢，而且跨 Region 的複製有流量費。","快照保留超過免費額度後持續計費，舊環境常累積幾百 GB。"]},cli:["aws rds create-db-instance \\","  --db-instance-identifier app-db --db-instance-class db.m6g.large \\",'  --engine postgres --master-username admin --master-user-password "$PW" \\',"  --allocated-storage 100 --storage-type gp3 \\","  --multi-az --backup-retention-period 14 --deletion-protection",'aws rds describe-db-instances --query "DBInstances[].Endpoint.Address"'],exam:["「**高可用 / 自動容錯**」→ Multi-AZ；「**分散讀取**」→ Read Replica。","「**跨 Region 災難復原**」→ Read Replica 跨區 + 提升為獨立資料庫（或 Aurora Global）。","Lambda 大量併發連資料庫 → **RDS Proxy**。","「**無法 SSH、無法改 OS**」是 RDS 的定義（要能改就用 EC2 自架）。","「**資料庫加密**」→ KMS；「**不要寫密碼在程式裡**」→ Secrets Manager + 自動輪換。","需要唯讀副本跨區、又要能寫入 → Aurora Global Database。"],gotchas:["Read Replica 是非同步，可能讀到舊資料（replica lag）。","Multi-AZ 的 standby 不能拿來查詢（Aurora 的 read replica 可以）。","加密設定不可事後更改。","小規格 + 高併發容易撞到 `max_connections` 上限。","SQL Server / Oracle 的授權模式（License Included vs BYOL）會大幅影響價格。"],related:["aurora","dynamodb","elasticache","secrets-manager","iam"]},{id:"aurora",name:"Amazon Aurora",zh:"雲原生關聯式資料庫",category:"database",emoji:"\uD83C\uDF0C",tagline:"AWS 自研的 MySQL / PostgreSQL 相容引擎：快 5 倍、儲存自動長大、最多 15 個讀取副本。",aliases:["mysql","postgresql","serverless","global database"],intro:["**Aurora** 是 AWS 為雲端重新設計的關聯式引擎，相容 **MySQL** 與 **PostgreSQL** 協定，但底層是自己做的分散式儲存層：資料自動複製 **6 份、跨 3 個 AZ**，容量以 10 GB 為單位自動成長到 128 TB。","它比標準 MySQL 快 5 倍、比 PostgreSQL 快 3 倍，支援最多 **15 個 read replica**（共用同一份儲存，複製延遲通常 < 100 ms），並提供 **Aurora Global Database**（跨區複寫、災難復原 RTO < 1 分鐘）。","**Aurora Serverless v2** 可以在沒有流量時縮到接近 0，適合開發環境與間歇性負載；代價是冷啟動與單價較高。"],concepts:[{term:"Cluster / Writer / Reader",desc:"一個 cluster 有一個 writer endpoint 與一個 reader endpoint，背後是多個執行個體共用儲存。"},{term:"Custom Endpoint",desc:"自訂端點把特定 reader 分組（例如只給報表用），做不同工作負載隔離。"},{term:"Global Database",desc:"跨 Region 複寫（通常 < 1 秒延遲），次級 Region 可快速提升為主。"},{term:"Serverless v2",desc:"以 ACU 為單位自動縮放（0.5–128 ACU），秒級調整，不必猜測規格。"},{term:"Backtrack",desc:"MySQL 相容版可在最近 72 小時內「倒帶」到某個時間點，不用還原整個資料庫。"},{term:"Aurora ML",desc:"直接在 SQL 裡呼叫 SageMaker / Comprehend，做資料庫內推論。"}],interactions:[{to:"rds",dir:"in",how:"Aurora 屬於 RDS 家族：用同樣的 API、參數群組概念與備份機制。"},{to:"lambda",dir:"in",how:"Serverless v2 搭配 RDS Proxy 可以承接 Lambda 的高併發連線。"},{to:"ec2",dir:"in",how:"應用程式從 VPC 內連線，透過 Security Group 與子網群組控制。"},{to:"s3",dir:"both",how:"`LOAD DATA FROM S3` 匯入資料，或把查詢結果匯出到 S3（`SELECT INTO OUTFILE S3`）。"},{to:"secrets-manager",dir:"both",how:"支援自動輪換 master 密碼。"},{to:"cloudwatch",dir:"out",how:"AuroraReplicaLag、VolumeBytesUsed、ACU 使用量等指標。"},{to:"sagemaker",dir:"out",how:"Aurora ML 讓 SQL 直接呼叫 ML 模型做推論。"},{to:"global-accelerator",dir:"in",how:"全球使用者要連到最近的 Aurora 端點時，可用 Global Accelerator 加速。"}],settings:[{name:"Engine (MySQL / PostgreSQL)",required:!0,desc:"相容性決定你能用哪些語法與工具；兩者不能互換。"},{name:"Provisioned vs Serverless v2",required:!0,warn:!0,desc:"穩定高負載用 Provisioned（便宜）；不可預測或間歇用 Serverless v2（彈性但單價高）。"},{name:"Replica count / 讀取擴展",desc:"最多 15 個；搭配 reader endpoint 自動分流。"},{name:"Multi-AZ（writer standby）",desc:"Aurora 儲存本身已跨 3 AZ，但**writer 執行個體**仍建議設第二台做 failover。"},{name:"Backtrack / PITR",desc:"Backtrack 快但有限制（僅 MySQL 相容、保留 72 小時）；PITR 到 35 天。"},{name:"Deletion protection",desc:"防誤刪，正式環境一定要開。"},{name:"Global Database",desc:"跨 Region 需求時開啟，注意次級 Region 的儲存與複寫成本。"},{name:"Enhanced Monitoring / Performance Insights",desc:"找出慢查詢與鎖等待的必要工具。"}],pricing:{model:"**執行個體（小時）+ 儲存（GB-月）+ I/O（視版本）+ 備份**。I/O 費用是 Aurora 最容易被忽略的成本。",free:"沒有 Aurora 專屬免費額度（可用 RDS 免費方案）。",rows:[{tier:"db.r6g.large（writer）",price:"約 $0.29 / 小時",note:"約 $210/月；再加一台 reader 就翻倍。",level:3},{tier:"儲存",price:"$0.10 / GB-月",note:"自動成長，用多少算多少。",level:2},{tier:"I/O（Standard）",price:"$0.20 / 每百萬次",note:"大量小查詢會讓 I/O 費用超過運算費；I/O-Optimized 版本可改為固定費率。",level:3},{tier:"Serverless v2",price:"$0.12 / ACU-小時",note:"低流量時接近 0，但滿載時比 Provisioned 貴。",level:2},{tier:"Global Database",price:"複寫 I/O + 跨區流量",note:"跨區資料傳輸費常被低估。",level:3}],traps:["Aurora 的 **I/O 費用**可以比運算費還高，要評估是否改用 I/O-Optimized。","Reader 執行個體不會自動幫你省錢：沒流量時關掉它（或善用 Serverless v2 縮到 0.5 ACU）。","Serverless v2 有最低 ACU（0.5）一直計費，測試環境長期閒置也是成本。","Global Database 的跨區複寫是雙向成本（來源 I/O + 跨區流量）。"]},cli:["aws rds create-db-cluster --db-cluster-identifier app \\","  --engine aurora-postgresql --engine-version 15.4 \\",'  --master-username admin --master-user-password "$PW" \\',"  --db-subnet-group-name private-subnets","aws rds create-db-instance --db-cluster-identifier app \\","  --db-instance-class db.r6g.large --engine aurora-postgresql"],exam:["要 **15 個讀取副本、低複製延遲** → Aurora（不是 RDS Multi-AZ）。","「**跨 Region、RTO < 1 分鐘**」→ Aurora Global Database。","「**開發環境、負載不可預測、要能縮到很小**」→ Aurora Serverless v2。","不小心改壞資料、要**快速倒帶** → Aurora Backtrack（僅 MySQL 相容）。","Aurora 儲存 **6 份跨 3 AZ**，比一般 RDS 的 Multi-AZ 更強。","「需要 RDS 但相容性不足 / 需要特殊 extension」→ 可能得用標準 RDS PostgreSQL。"],gotchas:["Aurora 不支援所有原生 MySQL / PostgreSQL 功能（例如某些 extension）。","Serverless v1 已淘汰，新專案請直接用 v2。","Reader endpoint 是負載平衡層，連線後可能落在不同 reader，不保證讀到最新資料。","Global Database 的次級 Region 是唯讀，提升（failover）後的 RPO 通常為秒級。"],related:["rds","dynamodb","elasticache","sagemaker"]},{id:"dynamodb",name:"Amazon DynamoDB",zh:"NoSQL 鍵值 / 文件資料庫",category:"database",emoji:"⚡",tagline:"毫秒級、無限擴展、完全託管的 NoSQL：設計好 key 就能撐住任何流量。",aliases:["nosql","key-value","document","dax","serverless db"],intro:["**DynamoDB** 是全託管的 NoSQL（key-value + document），設計目標是**穩定的個位數毫秒延遲**與**無上限的水平擴展**。沒有伺服器要管，容量用「讀寫容量單位」或 on-demand 模式計價。","它的效能完全取決於 **Primary Key 設計**：Partition Key 決定資料怎麼分散，Sort Key 決定同一個 partition 內的排序與查詢能力。設計得好，怎麼擴都不會慢；設計得差（熱分區），再多容量也沒用。","它不是「SQL 的替代品」：沒有 JOIN、沒有跨表交易（單一 API 可交易 100 個項目）、查詢能力受限。需要複雜查詢請搭配 [[opensearch|OpenSearch]]，需要報表請匯出到 S3 + Athena。"],concepts:[{term:"Partition Key（HASH）",desc:"決定資料存在哪個分區。基數要高、分布要均勻，避免熱分區。"},{term:"Sort Key（RANGE）",desc:"同一個 partition key 下的排序鍵，讓你能做範圍查詢（`begins_with`、`between`）。"},{term:"GSI / LSI",desc:"GSI（Global Secondary Index）可換 key 且能隨時新增（有自己的容量）；LSI 只能建表時建立、共用容量。"},{term:"RCU / WCU",desc:"讀寫容量單位：1 RCU = 每秒一次強一致性讀取（4 KB）；1 WCU = 每秒一次寫入（1 KB）。"},{term:"On-Demand vs Provisioned",desc:"On-Demand 自動擴縮、單價較高（適合不可預測）；Provisioned 較便宜並支援 auto scaling。"},{term:"DAX",desc:"記憶體內快取，可把讀取延遲降到微秒級，適合重複讀取的熱資料。"},{term:"Streams / TTL",desc:"Streams 記錄項目變更（觸發 Lambda）；TTL 自動刪除過期項目，完全不收費。"}],interactions:[{to:"lambda",dir:"both",how:"Lambda 讀寫 DynamoDB；Streams 反過來觸發 Lambda 做後續處理（最經典的組合）。"},{to:"api-gateway",dir:"in",how:"API Gateway + Lambda + DynamoDB 是無伺服器 API 的標準三件套。"},{to:"kinesis-data-streams",dir:"out",how:"Streams 可送到 Kinesis（或 Firehose）做分析與歸檔。"},{to:"s3",dir:"out",how:"用 Export to S3 做零消耗的整表備份與分析。"},{to:"athena",dir:"in",how:"分析 S3 上的匯出資料（無法直接對 DynamoDB 下 SQL）。"},{to:"iam",dir:"in",how:"細緻到「項目層級」的權限控制（`dynamodb:LeadingKeys` 條件）。"},{to:"kms",dir:"in",how:"靜態加密（AWS 擁有或客戶管理的 KMS key，加密不會影響效能）。"},{to:"global-accelerator",dir:"in",how:"DynamoDB Global Tables 提供多 Region 主動-主動複寫，搭配加速器給全球使用者。"},{to:"cloudwatch",dir:"out",how:"看 ConsumedReadCapacity、ThrottledRequests、SuccessfulRequestLatency。"}],settings:[{name:"Table class",required:!0,desc:"Standard 或 Standard-IA（不常讀的資料可省 60% 儲存費）。"},{name:"Capacity mode",required:!0,warn:!0,desc:"On-Demand（自動、單價高）vs Provisioned（便宜但需規劃）。新表建議先用 On-Demand 觀察。"},{name:"Partition key 設計",required:!0,warn:!0,desc:"最關鍵的設定。避免單一值佔八成流量（例如 `status=active`），要加上日期或雜湊。"},{name:"GSI 的 partition key",warn:!0,desc:"GSI 有自己的容量設定，設定太低會 throttle 整個寫入。"},{name:"Point-in-Time Recovery (PITR)",warn:!0,desc:"預設關閉！開啟後可還原到 35 天內任何秒；費用依資料量計算。"},{name:"Streams",desc:"NEW_IMAGE / OLD_IMAGE / NEW_AND_OLD_IMAGES，24 小時保留。"},{name:"TTL attribute",desc:"設定一個 epoch 秒數欄位，過期自動刪除，適合 session、log。"},{name:"Global Tables",desc:"多 Region 主動-主動複寫（需開啟 Streams），可解決跨區延遲與災難復原。"}],pricing:{model:"**On-Demand**（每百萬次讀寫請求）或 **Provisioned**（每小時容量單位）+ **儲存（GB-月）** + 備份 + 資料傳輸。",free:"免費方案：25 GB 儲存 + 25 RCU / 25 WCU（永久免費額度的一部分）。",rows:[{tier:"On-Demand 寫入",price:"$1.25 / 百萬 WCU",note:"每個 1 KB 項目算一次。",level:2},{tier:"On-Demand 讀取",price:"$0.25 / 百萬 RCU（最終一致性）",note:"強一致性讀取是兩倍價。",level:1},{tier:"Provisioned",price:"$0.00065 / WCU-小時",note:"穩定負載可省 50–70%。",level:1},{tier:"儲存",price:"$0.25 / GB-月",note:"Standard 表；IA 表為 $0.10。",level:3},{tier:"PITR 備份",price:"$0.20 / GB-月",note:"常被遺忘的固定成本。",level:2},{tier:"DAX",price:"$0.0134 / 小時（t3.small 起）",note:"僅在大量重複讀取時划算。",level:2}],traps:["掃描（`Scan`）會讀取整張表，容量消耗與費用極高——生產環境應避免。","GSI 會**複製一份資料**：寫入一次等於付兩次寫入成本（表 + 每個 GSI）。","最終一致性讀取是強一致性的一半價格，能接受舊資料就用它。","PITR 是固定月費，資料量大的表要重新評估保留策略。","On-Demand 在流量暴增時很安全但單價高；長期穩定服務建議切到 Provisioned。"]},cli:["aws dynamodb create-table --table-name orders \\","  --attribute-definitions AttributeName=pk,AttributeType=S AttributeName=sk,AttributeType=S \\","  --key-schema AttributeName=pk,KeyType=HASH AttributeName=sk,KeyType=RANGE \\","  --billing-mode PAY_PER_REQUEST","aws dynamodb put-item --table-name orders \\",`  --item '{"pk":{"S":"user#1"},"sk":{"S":"2026-09-29"},"total":{"N":"320"}}'`],exam:["「**毫秒級、無限擴展、無伺服器**」→ DynamoDB。","讀取爆量且延遲要求極低、重複讀取多 → **DAX**。","需要**多 Region 主動-主動** → Global Tables。","需要「自動刪除過期資料」→ **TTL**。","需要「變更觸發流程」→ **Streams** + Lambda。","冷啟動不重要但要**防止熱分區** → 檢討 partition key 基數。","複雜查詢 / JOIN → 換成 RDS / Aurora，或把資料複製到 OpenSearch。"],gotchas:["沒有跨 partition 的交易；`TransactWriteItems` 最多 100 項且成本兩倍。","Scan 很貴、很慢，幾乎都是設計不良的訊號。","GSI 的 eventual consistency：從 GSI 讀到的資料可能落後。","改變 key schema 只能重建表 + 搬資料。","單一 partition 有 3000 RCU / 1000 WCU 上限，這是熱分區的物理天花板。"],related:["lambda","kinesis-data-streams","elasticache","opensearch"]},{id:"elasticache",name:"Amazon ElastiCache",zh:"記憶體快取（Redis / Memcached）",category:"database",emoji:"\uD83D\uDE80",tagline:"把資料庫的壓力接走：微秒級讀取的 Redis 或簡單的 Memcached。",aliases:["redis","memcached","cache","快取","session"],intro:["**ElastiCache** 是託管的 in-memory 資料庫，兩個引擎：**Redis**（資料結構豐富、支援持久化、複製、叢集模式）與 **Memcached**（純多執行緒 key-value，最簡單）。","它的用途有三類：**資料庫快取**（讀取快取、寫入時快取）、**Session 儲存**（讓無狀態的機器共用登入狀態）、**即時排行榜 / 訊息**（Redis 的 Sorted Set、Pub/Sub、Stream）。","選擇原則：需要持久化、複製、複雜資料結構、跨 AZ 高可用 → **Redis**；只要最簡單的分散式快取、要水平擴展且不需持久化 → **Memcached**。"],concepts:[{term:"Node / Shard / Cluster",desc:"Redis 叢集模式可水平分片；Memcached 是用 node 數量決定容量。"},{term:"Replication Group",desc:"Redis 的一主多從架構，支援自動 failover 到 replica。"},{term:"Cache Strategies",desc:"Lazy Loading（讀時才填）、Write-Through（寫時同步更新）、TTL（過期自動清）。"},{term:"Eviction Policy",desc:"記憶體滿了要刪誰：`allkeys-lru`、`volatile-lru`、`noeviction`（寫入直接失敗）。"},{term:"Cluster Mode",desc:"Redis cluster 支援分片與更高的寫入吞吐，但用戶端要支援 cluster 協定。"},{term:"AUTH / 加密",desc:"可用 Redis AUTH token（存於 Secrets Manager）與 TLS 傳輸加密。"}],interactions:[{to:"rds",dir:"in",how:"最典型的用途：擋在 RDS 前面，把熱門查詢的結果快取起來。"},{to:"aurora",dir:"in",how:"Aurora 讀取量大時用 Redis 吸收重複查詢。"},{to:"ec2",dir:"in",how:"應用程式（EC2 / 容器）連到 ElastiCache 端點，通常在同一個 VPC 私有子網。"},{to:"lambda",dir:"in",how:"Lambda 需要放在 VPC 內才能連線（會增加冷啟動時間）。"},{to:"dynamodb",dir:"both",how:"用 DAX 做 DynamoDB 快取，或用 ElastiCache 自己實作多種來源的快取層。"},{to:"secrets-manager",dir:"in",how:"儲存與輪換 Redis AUTH token。"},{to:"cloudwatch",dir:"out",how:"看 CPU、Evictions、CurrConnections、CacheHits/Misses，判斷快取效率。"},{to:"cloudtrail",dir:"out",how:"Redis 有慢查詢 log；ElastiCache 也支援 ElastiCache for Redis 的 log delivery 到 CloudWatch。"}],settings:[{name:"Engine",required:!0,desc:"Redis（功能多、可持久化）或 Memcached（最簡單、多執行緒）。"},{name:"Node type & 數量",required:!0,desc:"記憶體要能裝下熱資料；數量決定容量與可用性。"},{name:"Multi-AZ & Automatic failover",required:!0,warn:!0,desc:"Redis 生產環境必開，否則主節點掛掉就是服務中斷。"},{name:"Eviction policy",warn:!0,desc:"設 `noeviction` 會讓寫入失敗；快取用途通常選 `allkeys-lru`。"},{name:"Backup / Snapshot",desc:"Redis 支援自動快照（RDB），可還原到新叢集；Memcached 沒有持久化。"},{name:"Encryption (TLS / at-rest)",desc:"建立時決定，之後不能改——這是常見的坑。"},{name:"Subnet group & Security Group",warn:!0,desc:"要與應用程式在同 VPC；開放給整個網段是常見的安全問題。"},{name:"Parameter group",desc:"可調 `maxmemory-policy`、`timeout` 等參數。"}],pricing:{model:"按 **節點類型與數量（小時）** + 備份儲存 + 資料傳輸計費。不像 DynamoDB 有「容量單位」，你付的是固定的節點。",free:"免費方案：t2.micro / t3.micro 750 小時（12 個月）。",rows:[{tier:"cache.t3.micro",price:"約 $0.017 / 小時",note:"約 $12/月，開發測試用。",level:1},{tier:"cache.r6g.large（Multi-AZ）",price:"約 $0.34 / 小時",note:"約 $250/月，含 replica。",level:3},{tier:"Serverless（Redis）",price:"$0.90 / GB-小時起",note:"依實際使用的記憶體與 ECPU 計費，適合不可預測流量。",level:3},{tier:"備份儲存",price:"$0.085 / GB-月",note:"快照長期累積仍要錢。",level:1}],traps:["節點是**按小時計費且一直開著**（不像 DynamoDB 按請求），沒流量時也是固定成本。","Multi-AZ 等於兩倍節點費。","跨 AZ 的客戶端連線流量也要算錢。","快取命中率低於 60% 通常代表策略有問題，花了錢卻沒解決問題。"]},cli:["aws elasticache create-replication-group \\","  --replication-group-id app-cache --engine redis --engine-version 7.1 \\","  --cache-node-type cache.r6g.large --num-node-groups 1 --replicas-per-node-group 1 \\","  --automatic-failover-enabled --transit-encryption-enabled \\","  --cache-subnet-group-name private-subnets"],exam:["需要**持久化 / 複製 / 資料結構 / 多 AZ** → Redis；只要**最簡單的多執行緒快取** → Memcached。","Session 集中管理 → Redis。","排行榜、計數器、Pub/Sub → Redis（Sorted Set / INCR / Pub-Sub）。","資料庫讀取變慢、重複查詢多 → 加 ElastiCache（Lazy Loading 策略）。","Redis AUTH 憑證 → 放在 **Secrets Manager** 並輪換。"],gotchas:["Memcached 沒有持久化、沒有複製、沒有 TLS，不適合放重要資料。","加密與 cluster mode 建立後無法更改（要重建）。","快取與資料庫的一致性要靠 TTL 或寫入時失效策略，否則會讀到舊資料。","ElastiCache 不能跨 Region 複寫（Redis 的 Global Datastore 可支援但有限制）。"],related:["rds","dynamodb","aurora","cloudwatch"]},{id:"redshift",name:"Amazon Redshift",zh:"資料倉儲（Data Warehouse）",category:"database",emoji:"\uD83C\uDFED",tagline:"PB 級的 SQL 分析引擎：把資料倉儲搬上雲，用 SQL 做 BI 與報表。",aliases:["data warehouse","olap","bi","columnar","redshift spectrum"],intro:["**Redshift** 是**列式儲存**的資料倉儲，專為 OLAP（分析）設計：一次掃描大量資料做彙總與 JOIN，而不是高頻的單筆交易。","它把資料分散到多個節點並行處理（MPP），搭配 **Spectrum** 可以直接查詢 S3 上的外部資料，或用 **Redshift Serverless** 不用管叢集大小。","它是「分析用」的資料庫：不適合拿來當應用程式的線上資料庫（OLTP），也不適合非結構化資料（那是 [[athena|Athena]] + [[glue|Glue]] 的地盤）。"],concepts:[{term:"Leader / Compute Node",desc:"Leader 負責規劃查詢，Compute 節點負責實際運算與儲存。"},{term:"RA3 / DC2",desc:"RA3 是託管儲存（可獨立擴充運算與儲存、支援跨叢集資料共享）；DC2 是本地 SSD、便宜但綁定。"},{term:"Distribution / Sort Key",desc:"決定資料怎麼分散與排序，直接影響 JOIN 與查詢效能（EVEN / KEY / ALL）。"},{term:"Spectrum",desc:"直接查 S3 上的 Parquet / ORC 等外部資料，零載入。"},{term:"Redshift Serverless",desc:"以 RPU 為單位自動擴縮，適合間歇性分析負載。"},{term:"Concurrency Scaling / WLM",desc:"尖峰時自動加臨時叢集，維持查詢佇列不塞車。"}],interactions:[{to:"s3",dir:"both",how:"COPY 指令從 S3 載入資料（最快）；UNLOAD 把結果寫回 S3；Spectrum 直接查詢。"},{to:"glue",dir:"in",how:"Glue ETL 與 Data Catalog 讓 S3 上的資料可以被 Spectrum 查詢。"},{to:"kinesis-data-streams",dir:"in",how:"Kinesis / Firehose 可近即時把串流資料灌進 Redshift。"},{to:"data-firehose",dir:"in",how:"Firehose 支援直接寫入 Redshift（經 S3 中轉）。"},{to:"quicksight",dir:"out",how:"BI 報表最常見的資料來源。"},{to:"dms",dir:"in",how:"從 Oracle / SQL Server 等異質資料庫持續複寫到 Redshift。"},{to:"lake-formation",dir:"in",how:"資料湖的權限治理，讓 Redshift 與其他分析服務共用資料。"},{to:"kms",dir:"in",how:"叢集與快照加密。"}],settings:[{name:"Provisioned vs Serverless",required:!0,desc:"Serverless 用 RPU 計費，免管叢集；Provisioned 更適合穩定的大型負載。"},{name:"Node type & count",required:!0,warn:!0,desc:"ra3.xlplus 起跳；選太小會讓查詢一直排隊。"},{name:"Distribution key / Sort key",warn:!0,desc:"選錯會導致跨節點搬移資料（重分配），是效能最大殺手。"},{name:"Sort key 壓縮編碼",desc:"正確的 compression encoding 可省下大量儲存與 I/O。"},{name:"AQUA / Concurrency Scaling",desc:"AQUA 加速查詢快取；Concurrency Scaling 在尖峰自動加叢集（有免費時數）。"},{name:"Enhanced VPC Routing",desc:"強制所有 COPY / UNLOAD 流量走 VPC，符合安全要求。"},{name:"Snapshot / Cross-Region snapshot",desc:"自動快照與跨區複製，用於 DR。"}],pricing:{model:"**Provisioned**：節點小時費 + 託管儲存；**Serverless**：RPU 小時費（最低 8 RPU）。Spectrum 另收查詢的資料掃描量。",free:"免費試用（依活動），長期使用無免費額度。",rows:[{tier:"ra3.xlplus",price:"約 $1.086 / 小時",note:"約 $790/月，這是入門正式規格。",level:4},{tier:"Serverless",price:"$0.375 / RPU-小時",note:"8 RPU 起跳，短期分析比開叢集便宜。",level:4},{tier:"RA3 託管儲存",price:"$0.024 / GB-月",note:"運算與儲存分離，可各自擴充。",level:1},{tier:"Spectrum 查詢",price:"$5 / TB 掃描",note:"掃得愈多付得愈多，分區與欄式格式很重要。",level:3},{tier:"Concurrency Scaling",price:"$0.375 / RPU-小時（超出免費時數）",note:"每月有免費點數，尖峰過後要留意。",level:3}],traps:["Spectrum 掃描量大時比載入到叢集還貴：用 Parquet + 分區可省 90%。","叢集開著就一直在燒錢，分析完記得 pause（Provisioned 支援暫停）。","查詢沒有最佳化（缺 sort key、太多小檔案）會讓成本與時間雙輸。"]},exam:["「**PB 級資料、SQL 分析、BI 報表**」→ Redshift。","「**不載入、直接查 S3**」→ Redshift Spectrum 或 Athena。","「**串流資料近即時進倉**」→ Kinesis Firehose → Redshift。","「**不想管叢集、偶爾分析**」→ Redshift Serverless。","OLTP（交易型）→ RDS / Aurora，不是 Redshift。"],gotchas:["Redshift 是單一 AZ 的叢集（可跨 AZ 還原快照），不像 Aurora 多 AZ 儲存。","大量小檔寫入 S3 再 COPY 會很慢，要先合併成大檔。","資料分布不均（dist key 選錯）會讓少數節點成為瓶頸。","Redshift 不支援所有 PostgreSQL 語法，別以為是「貴一點的 Postgres」。"],related:["athena","glue","quicksight","data-firehose","s3"]},{id:"documentdb",name:"Amazon DocumentDB",zh:"MongoDB 相容文件資料庫",category:"database",emoji:"\uD83D\uDCC4",tagline:"相容 MongoDB 的託管文件資料庫：JSON 文件、可擴展儲存、多 AZ 複寫。",aliases:["mongodb","json","document db","nosql"],intro:["**DocumentDB** 是 AWS 自製、相容 MongoDB API 的文件資料庫，把 MongoDB 的維運（複寫、備份、擴容）變成託管服務，儲存自動成長到 64 TB。","它使用與 Aurora 類似的分散式儲存（6 份跨 3 AZ），最多 15 個 read replica，適合既有的 MongoDB 應用不想自己維運叢集的場景。","注意：它不是 MongoDB 本身（例如不支援某些 aggregation 或 API 版本），正式遷移前一定要做相容性測試。"],concepts:[{term:"Cluster / Instance",desc:"一個 cluster 含一個 primary 與多個 replica；應用連到 cluster endpoint。"},{term:"Document / Collection",desc:"JSON 文件與集合，與 MongoDB 概念一致。"},{term:"相容性版本",desc:"目前主要相容 MongoDB 3.6 / 4.0 / 5.0 API。"},{term:"Change Streams",desc:"類似 MongoDB 的 change stream，可觸發後續處理。"}],interactions:[{to:"ec2",dir:"in",how:"應用程式用標準 MongoDB driver 連線，通常在私有子網。"},{to:"lambda",dir:"in",how:"Lambda 在 VPC 內存取（記得連線池管理）。"},{to:"kms",dir:"in",how:"靜態加密（建立時設定）。"},{to:"cloudwatch",dir:"out",how:"CPU、連線數、BufferCache 命中率等指標。"},{to:"dms",dir:"in",how:"從自建 MongoDB 或 RDS 遷移到 DocumentDB。"},{to:"s3",dir:"out",how:"匯出快照到 S3 做長期保存與分析。"}],settings:[{name:"Instance class & count",required:!0,desc:"primary 與 replica
