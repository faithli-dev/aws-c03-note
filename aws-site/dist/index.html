lify 是「快速起步」，企業級需求常需要自己組裝 S3 + CloudFront + CodePipeline。","AppFlow 是獨立服務，和 Amplify Hosting 沒有直接關係（名稱容易混淆）。","SSR 的成本模型與純靜態網站差很多。"],related:["cloudfront","s3","cognito","lambda","route53"]},{id:"pinpoint",name:"Amazon Pinpoint",zh:"客戶互動與行銷活動",category:"migration",emoji:"\uD83C\uDFAF",tagline:"對客戶發送 Email / SMS / 推播 / 語音，並追蹤成效與分群。",aliases:["marketing","campaign","sms","push notification","行銷"],intro:["**Pinpoint** 是多通路客戶互動服務：**Email、SMS、Push（行動推播）、Voice**，支援**客群分群（Segments）**、**行銷活動（Campaign）**、**旅程（Journeys，多步驟自動化）**，並提供**開啟率 / 點擊率 / 轉換**分析。","與 [[ses|SES]] 的差別：SES 是「**寄 Email 的引擎**」（交易信）；Pinpoint 是「**行銷活動與客戶旅程平台**」（含分群、A/B 測試、跨通路）。","常見用途：App 的使用者推播、促銷活動簡訊、新用戶 onboarding 旅程（註冊後第 1 天 Email、第 3 天推送）。"],concepts:[{term:"Project / Application",desc:"一個行銷專案（含設定、通路與資料）。"},{term:"Segment",desc:"客群分群：靜態（匯入名單）或動態（依屬性 / 行為即時更新）。"},{term:"Campaign",desc:"一次性或排程的行銷活動（可 A/B 測試訊息與發送時間）。"},{term:"Journey",desc:"多步驟自動化流程（含等待、條件分支、多通路）。"},{term:"Channel",desc:"Email / SMS / Push / Voice / In-app。"},{term:"Endpoint",desc:"可觸達的目標（電話號碼、裝置 token、Email）。"}],interactions:[{to:"ses",dir:"both",how:"Email 通路的底層是 SES（Pinpoint 管理行銷流程，SES 負責寄送）。"},{to:"sns",dir:"both",how:"行動推播與 SMS 底層與 SNS 相關；事件也可發到 SNS。"},{to:"s3",dir:"in",how:"匯入客群資料或匯出活動成效。"},{to:"lambda",dir:"both",how:"事件觸發 Lambda（例如使用者註冊 → 啟動 Journey）；Pinpoint 也可呼叫 Lambda 自訂邏輯。"},{to:"kinesis-data-streams",dir:"out",how:"匯出事件資料做分析。"},{to:"quicksight",dir:"out",how:"行銷成效分析（透過 S3 / Athena）。"},{to:"cognito",dir:"in",how:"應用的使用者身分與屬性。"},{to:"eventbridge",dir:"out",how:"活動與旅程事件可路由到其他服務。"}],settings:[{name:"Channel 設定（Email / SMS / Push）",required:!0,warn:!0,desc:"SMS 需要申請長碼 / 短碼 / 免付費號碼，各國規定不同（美國要 10DLC 註冊）。"},{name:"Sending quota / 沙箱",desc:"SMS 與 Email 都有配額，且需要申請提升。"},{name:"Segment 的更新頻率",desc:"動態分群會依事件即時更新（影響成本與準確度）。"},{name:"Quiet hours / 最佳發送時間",warn:!0,desc:"避免半夜發送（合規與體驗）。"},{name:"Campaign 的 A/B 測試與排程",desc:"測試訊息與發送時間，看哪個轉換率高。"},{name:"Journey 的分支與等待",desc:"多步驟流程的設計與終止條件。"},{name:"Event stream / 匯出",desc:"把事件送到 Kinesis 做後續分析（預設會保留有限期間）。"}],pricing:{model:"**依發送的通路計費**：Email（每千封）、SMS（依國家，最常是主要成本）、Push（每百萬則）、Voice。+ 每月活躍端點費用。",free:"免費方案：每月 5,000 個端點、1,000 次推播、Email 額度、部分 SMS 額度（12 個月）。",rows:[{tier:"Email",price:"$0.0001 / 封（約 $1/千封）",note:"與 SES 相近。",level:0},{tier:"SMS（美國）",price:"約 $0.0075 / 則",note:"各國差異大。",level:2},{tier:"SMS（其他國家）",price:"$0.02–$0.10 / 則",note:"國際簡訊是最大成本。",level:4},{tier:"Push 推播",price:"$1.00 / 百萬則",note:"非常便宜。",level:0},{tier:"每月活躍端點",price:"$0.0012 / 端點",note:"10 萬使用者約 $120/月。",level:2},{tier:"Voice",price:"$0.013 / 分鐘起",note:"語音通話較貴。",level:2}],traps:["大量 SMS 行銷（尤其國際）費用極高，務必先算單價。","每月活躍端點費用與使用者成長同步上升。","SMS 的註冊（10DLC / 短碼）需要時間與費用，事前規劃重要。"]},exam:["「**行銷活動、分群、跨通路（Email + SMS + Push）**」→ Pinpoint。","「**交易信（訂單確認、驗證碼）**」→ SES。","「**App 推送通知**」→ Pinpoint（或 SNS Mobile Push）。","「**多步驟自動化客戶旅程**」→ Pinpoint Journeys。"],gotchas:["Pinpoint 與 SES 都使用相同的寄送基礎，但功能定位不同。","SMS 的法規（10DLC、opt-in 記錄）比技術設定更花時間。","Journey 執行中的使用者無法無痛移轉到新版 Journey。"],related:["ses","sns","lambda","kinesis-data-streams","quicksight"]},{id:"batch",name:"AWS Batch",zh:"批次運算排程",category:"migration",emoji:"\uD83C\uDF71",tagline:"把大量批次工作排進佇列，AWS 自動開機器跑完再關掉。",aliases:["batch computing","hpc","job queue","批次"],intro:["**AWS Batch** 是託管的批次排程：你定義**工作定義（Job Definition）**、**佇列（Job Queue）** 與**運算環境（Compute Environment）**，Batch 依需求啟動 EC2（或 Fargate / Spot）執行工作，結束後自動縮回 0。","它適合「大量、可平行、非即時」的工作：影像轉檔、基因定序、財務模擬、ML 前處理、報表產生。","與 [[lambda|Lambda]] 的差別：Lambda 有 15 分鐘限制且不適合長時間／需要大量 CPU/GPU 的工作；Batch 沒有時間限制（用容器執行），而且能利用 Spot 省下大量成本。"],concepts:[{term:"Job Definition",desc:"容器映像、資源需求（vCPU / memory）、環境變數、重試次數。"},{term:"Job Queue",desc:"工作的排隊處，設定優先順序與對應的運算環境。"},{term:"Compute Environment",desc:"Managed（Batch 管理 ASG）或 Unmanaged；可混用 On-Demand 與 Spot。"},{term:"Job 狀態",desc:"SUBMITTED → PENDING → RUNNABLE → STARTING → RUNNING → SUCCEEDED / FAILED。"},{term:"Array Jobs",desc:"一次提交大量相似工作（例如 1,000 張圖片轉檔）。"},{term:"Dependency",desc:"工作之間的相依（A 完成才跑 B）。"}],interactions:[{to:"ec2",dir:"out",how:"運算環境底層是 EC2（可混用 Spot 與 On-Demand）。"},{to:"fargate",dir:"out",how:"Batch 支援 Fargate 運算環境（免管理節點）。"},{to:"ecr",dir:"in",how:"工作定義使用 ECR 中的容器映像。"},{to:"s3",dir:"both",how:"輸入資料與輸出結果（最常見的資料交換方式）。"},{to:"step-functions",dir:"in",how:"Step Functions 啟動 Batch 工作並等待完成（編排長流程）。"},{to:"eventbridge",dir:"both",how:"排程觸發（cron）或工作狀態事件觸發後續動作。"},{to:"cloudwatch",dir:"out",how:"工作狀態與日誌（Batch 的 job log 在 CloudWatch Logs）。"},{to:"cloudwatch",dir:"out",how:"工作狀態與日誌（Batch 的 job log 在 CloudWatch Logs）。"}],settings:[{name:"Compute environment 類型",required:!0,warn:!0,desc:"Managed（建議）會自動管理 ASG；Unmanaged 需要自己建。"},{name:"Instance types / vCPU 上限",required:!0,desc:"設定可用的 instance 家族與最大 vCPU（成本護欄）。"},{name:"Spot 比例與策略",warn:!0,desc:"Spot 便宜但會被回收，工作要能重試（設定 `attempts`）。"},{name:"Job retry 策略",warn:!0,desc:"設定重試次數與 `evaluateOnExit`（依錯誤碼決定重試）。"},{name:"Array job 大小",desc:"大量相似工作用 array job 而非逐一提交（效率高很多）。"},{name:"Job 的 timeout 與資源",desc:"vCPU / memory 不足會讓工作排不進去或 OOM。"},{name:"Queue 優先順序",desc:"多團隊共用叢集時的公平性設計。"}],pricing:{model:"**AWS Batch 免費**，你付的是底層 EC2 / Fargate 的費用（用 Spot 可省 70%）。",free:"Batch 本身免費。",rows:[{tier:"Batch 服務費",price:"免費",note:"沒有額外費用。",level:0},{tier:"On-Demand EC2",price:"依規格",note:"跑完自動縮到 0。",level:2},{tier:"Spot EC2",price:"省 60–90%",note:"批次工作的最佳選擇。",level:1},{tier:"Fargate",price:"依 vCPU/GB-秒",note:"免管理但單價較高。",level:3}],traps:["運算環境的 `maxvCpus` 設太高 → 工作暴增時成本失控。","工作沒有重試設定，Spot 被回收就整批失敗。","長時間使用 On-Demand 而非 Spot → 成本高三倍。"]},exam:["「**大量平行、容器化、長時間的批次工作**」→ AWS Batch。","「**Lambda 的 15 分鐘限制不夠**」→ Batch（或 ECS / Fargate）。","「**HPC 工作排程**」→ Batch（+ FSx for Lustre 做高速儲存）。","「**工作之間有相依與流程**」→ Step Functions + Batch。"],gotchas:["Job queue 與 compute environment 的設定錯誤會讓工作卡在 RUNNABLE。","工作容器內的 log 需要設 log driver（否則看不到輸出）。","Spot 中斷會讓工作失敗，需要設計 checkpooint / 重試。"],related:["ec2","fargate","step-functions","ecr","fsx"]},{id:"outposts",name:"AWS Outposts",zh:"地端 AWS 機櫃",category:"migration",emoji:"\uD83C\uDFE2",tagline:"把 AWS 的機櫃放進你的機房：低延遲、資料落地，但用同樣的 API。",aliases:["hybrid","on-premises","edge","地端"],intro:["**Outposts** 是 AWS 安裝在**你機房裡**的實
