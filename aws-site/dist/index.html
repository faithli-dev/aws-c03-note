月）** 計費，寫入以 bytes 計。",free:"沒有免費額度。",rows:[{tier:"寫入",price:"$0.50 / 百萬筆寫入（約 $0.05/GB）",note:"批次寫入較便宜（每筆 1 KB 以下）。",level:2},{tier:"Memory store 儲存",price:"$0.036 / GB-小時",note:"按小時計，保留期愈長愈貴。",level:4},{tier:"Magnetic store 儲存",price:"$0.03 / GB-月",note:"長期儲存便宜很多。",level:1},{tier:"查詢",price:"$0.01 / GB 掃描",note:"查詢時間範圍愈大掃得愈多。",level:2}],traps:["Memory store 太長會讓費用暴增（按小時計價）。","查詢一次掃太長時間範圍，費用跟著放大。"]},exam:["「**IoT 感測器 / 應用指標 / 時間戳查詢**」→ Timestream。","關聯式儲存指標會爆炸貴 → 時間序列資料庫。"],related:["dynamodb","cloudwatch","quicksight","redshift"]},{id:"opensearch",name:"Amazon OpenSearch Service",zh:"搜尋與日誌分析引擎",category:"database",emoji:"\uD83D\uDD0D",tagline:"全文檢索 + 日誌分析：從一堆文字裡秒找到你要的那一筆。",aliases:["elasticsearch","kibana","search","log analytics","全文檢索"],intro:["**OpenSearch**（前身是 Elasticsearch）是分散式搜尋引擎：支援**全文檢索**、模糊比對、facets 聚合與 log 分析，並內建 **OpenSearch Dashboards**（原 Kibana）做視覺化。","兩個主要用途：**應用程式的搜尋功能**（商品搜尋、文件檢索）與 **日誌分析**（搭配 Kinesis Firehose / Fluent Bit 收集 log）。","它**不是主要資料庫**：通常是從 RDS / DynamoDB 把資料同步過來做檢索。"],concepts:[{term:"Index / Document / Shard",desc:"index 是文件的集合，分散在多個 shard 上，每個 shard 有一個 primary 與 replica。"},{term:"Analyzer",desc:"分詞方式（中文需要 IK 之類的分詞器），直接決定搜尋結果好壞。"},{term:"Dedicated Master Node",desc:"專責管理叢集狀態，生產環境（3 台）建議必備。"},{term:"UltraWarm / Cold storage",desc:"把舊資料放到便宜的 S3-backed 節點，仍能用 SQL / Dashboards 查。"},{term:"OpenSearch Serverless",desc:"免管理叢集，以 OCU 計費，適合不可預測的搜尋或日誌量。"}],interactions:[{to:"data-firehose",dir:"in",how:"最常見的日誌管線：CloudWatch Logs → Firehose → OpenSearch → Dashboards。"},{to:"cloudwatch",dir:"in",how:"用訂閱（subscription filter）把 log 匯出到 OpenSearch。"},{to:"lambda",dir:"both",how:"Lambda 寫入索引、查詢資料或在索引事件時觸發處理。"},{to:"dynamodb",dir:"in",how:"Streams → Lambda → OpenSearch，讓 NoSQL 資料也能全文檢索。"},{to:"kinesis-data-streams",dir:"in",how:"串流資料近即時寫入搜尋索引。"},{to:"cognito",dir:"in",how:"Dashboards 用 Cognito 做登入驗證（或 SAML / IAM）。"},{to:"s3",dir:"both",how:"快照備份到 S3；也可查詢 S3 上的資料（部分版本）。"},{to:"vpc",dir:"in",how:"放在 VPC 內或用公開端點 + 存取政策限制 IP。"}],settings:[{name:"Instance type & count",required:!0,warn:!0,desc:"資料量、shard 數與查詢量決定規格；設定太小會出現 JVM 記憶體壓力與查詢逾時。"},{name:"Dedicated master nodes",warn:!0,desc:"生產環境 3 台，避免叢集狀態管理影響效能。"},{name:"UltraWarm / Cold tier",desc:"舊 log 移到便宜層，能省 80% 以上。"},{name:"Access policy / Fine-grained access control",desc:"依 index 與角色授權，日誌含敏感資料時必設。"},{name:"Encryption (at rest / node-to-node)",desc:"KMS 加密與節點間 TLS（在同 VPC 內也建議開啟）。"},{name:"Automated snapshot",desc:"每日快照到 S3，供還原與 DR。"},{name:"Index State Management (ISM)",desc:"自動 rollover、刪除舊 index——控制成本的核心設定。"}],pricing:{model:"**Provisioned**：執行個體小時 + EBS + UltraWarm 儲存；**Serverless**：OCU 小時（最低 2 OCU）。",free:"沒有免費額度（免費方案可試用，另有 OpenSearch Serverless 的試用點數）。",rows:[{tier:"t3.small.search（開發用）",price:"約 $0.036 / 小時",note:"只能用來測試。",level:1},{tier:"m6g.large.search ×2",price:"約 $0.30 / 小時",note:"約 $220/月，不含儲存。",level:3},{tier:"EBS gp3 儲存",price:"$0.122 / GB-月",note:"log 量大的話是主要成本。",level:2},{tier:"UltraWarm",price:"約同規格熱節點的 1/3",note:"查詢較慢但便宜很多。",level:1},{tier:"Serverless",price:"$0.24 / OCU-小時",note:"最低 2 OCU（約 $350/月）就一直計費，要留意。",level:4}],traps:["沒設 ISM，舊 index 永遠留著，儲存費線性成長。","Shard 過多（每個 index 開 5 個 shard）會浪費資源並拖慢查詢。","Serverless 的最低 OCU 固定費用不低，小流量不一定划算。","UltraWarm 與 Cold 需要手動搬移策略（ISM），不然永遠在熱層。"]},exam:["「**全文搜尋、模糊比對、log 分析 + 視覺化**」→ OpenSearch。","「**CloudWatch Logs 要近即時分析**」→ 訂閱過濾器/ Firehose → OpenSearch。","OpenSearch 是**輔助**資料庫，不取代 RDS / DynamoDB。","想省 log 儲存成本 → UltraWarm / Cold + ISM 政策。"],gotchas:["中文分詞需要另外安裝 plugin（AWS 版本已支援部分分詞）。","OpenSearch 版本升級不是完全向後相容，要測試。","VPC 模式的叢集無法直接在瀏覽器打開 Dashboards（需要跳板或 VPN）。","公開端點若 access policy 太寬鬆，等於把 log 直接公開。"],related:["data-firehose","cloudwatch","kinesis-data-streams","lambda"]},{id:"keyspaces",name:"Amazon Keyspaces",zh:"Cassandra 相容資料庫",category:"database",emoji:"\uD83E\uDDF1",tagline:"託管的 Apache Cassandra：寬列（wide column）資料模型，無伺服器擴展。",aliases:["cassandra","wide column","cql"],intro:["**Keyspaces** 是與 **Apache Cassandra** 相容的託管資料庫（CQL 語法），適合大量寫入的寬列資料：IoT、訊息、時間序列式的事件記錄。","無伺服器、按需自動擴展，讀寫以 **RCU / WCU**（與 DynamoDB 相同模式）計費，或用 provisioned 模式。","它跟 DynamoDB 的差別：需要 CQL / Cassandra 生態與資料模型時選 Keyspaces，否則多數情況 DynamoDB 的整合度更好。"],concepts:[{term:"Keyspace / Table / Row",desc:"Keyspace 類似 schema，內含多個 table。"},{term:"Partition key / Clustering column",desc:"與 Cassandra 相同的資料分散概念。"},{term:"Capacity mode",desc:"On-Demand 或 Provisioned（含 auto scaling）。"},{term:"TTL",desc:"支援資料自動過期刪除。"}],interactions:[{to:"lambda",dir:"both",how:"用 Cassandra driver 讀寫（需在 VPC 內或用 IAM + TLS 端點）。"},{to:"ec2",dir:"in",how:"應用程式沿用既有 CQL 程式碼連線。"},{to:"kinesis-data-streams",dir:"in",how:"串流資料寫入寬列資料表。"},{to:"cloudwatch",dir:"out",how:"讀寫容量與節流指標。"},{to:"kms",dir:"in",how:"靜態加密（預設用 AWS 擁有的金鑰）。"}],settings:[{name:"Capacity mode",required:!0,desc:"On-Demand 適合不可預測；Provisioned 更便宜。"},{name:"Point-in-time recovery",warn:!0,desc:"預設關閉，需要時要手動開啟。"},{name:"Table-level encryption",desc:"可指定客戶管理的 KMS key（較少見）。"},{name:"Client-side TLS / IAM",desc:"連線必須使用 TLS 與 SigV4 簽章。"}],pricing:{model:"**On-Demand**：每百萬次讀寫（RRU/WRU）；**Provisioned**：每小時容量 + 儲存。",free:"沒有免費額度。",rows:[{tier:"On-Demand 寫入",price:"$1.45 / 百萬 WRU",note:"每 1 KB 一次。",level:2},{tier:"On-Demand 讀取",price:"$0.29 / 百萬 RRU",note:"最終一致性較便宜。",level:1},{tier:"儲存",price:"$0.30 / GB-月",note:"按實際資料量。",level:3},{tier:"PITR 備份",price:"$0.20 / GB-月",note:"與 DynamoDB 類似。",level:2}],traps:["沒有 provisioned 折扣時單價比 DynamoDB 略高。","PITR 是固定成本。"]},exam:["「**Cassandra 相容、寬列、大寫入量**」→ Keyspaces。","能用 DynamoDB 就用 DynamoDB；已經有 Cassandra 應用不想維運才選 Keyspaces。"],related:["dynamodb","timestream","opensearch"]}];var e$=[{id:"vpc",name:"Amazon VPC",zh:"虛擬私有雲（你的專屬網路）",category:"network",emoji:"\uD83C\uDF10",tagline:"在 AWS 裡圈出你自己的網段：子網、路由、防火牆、對外連線都由你決定。",aliases:["subnet","cidr","nat gateway","security group","nacl","網路"],intro:["**VPC（Virtual Private Cloud）** 是你在某個 Region 內建立的隔離網路，用 **CIDR** 定義網段（例如 `10.0.0.0/16`），再切成多個 **Subnet**（每個子網綁一個 AZ）。","「**Public Subnet**」與「**Private Subnet**」不是 AWS 的設定選項，而是**路由表的結果**：有指向 Internet Gateway 的路由就是 public，沒有的就是 private。","最重要的兩個安全機制：**Security Group**（有狀態、綁資源、只能允許）與 **NACL**（無狀態、綁子網、可允許也可拒絕）。"],concepts:[{term:"CIDR / Subnet",desc:"VPC 網段與子網切分。`/16` 是常見 VPC 大小，`/24` 給應用、`/28` 給小服務。"},{term:"Internet Gateway (IGW)",desc:"讓 public subnet 的資源能雙向連上網際網路。"},{term:"NAT Gateway",desc:"讓 private subnet 的資源「單向對外」上網（不能被外部主動連入）。要 NAT 在 public subnet、並有 Elastic IP。"},{term:"Route Table",desc:"決定子網的流量往哪裡走；每個子網要明確關聯路由表。"},{term:"Security Group",desc:"執行個體層級的防火牆，**有狀態**（回應流量自動允許），只能新增 allow 規則。"},{term:"Network ACL",desc:"子網層級的防火牆，**無狀態**（進出都要各自寫規則），支援 deny 規則，規則是編號排序。"},{term:"VPC Peering / Transit Gateway",desc:"VPC 之間互連：少量用 peering（不可遞移），大量集中用 Transit Gateway。"},{term:"VPC Endpoint",desc:"不經公網就能存取 S3 / DynamoDB（Gateway 型，免費）或私有 API（Interface 型，PrivateLink）。"}],interactions:[{to:"ec2",dir:"in",how:"所有 EC2 都跑在某個子網內，安全群組決定誰能連進來。"},{to:"elb",dir:"both",how:"ALB / NLB 跨多個子網部署，把外部或內部流量導到後端。"},{to:"route53",dir:"in",how:"用 hosted zone 與記錄把名稱解析到 VPC 內的資源或外部入口。"},{to:"lambda",dir:"in",how:"Lambda 加入 VPC 才能連私有資源，但要注意需要 NAT 才能上網。"},{to:"rds",dir:"in",how:"資料庫放私有子網（DB Subnet Group），只允許應用層的 SG 連入。"},{to:"vpc-endpoints",dir:"out",how:"PrivateLink / Gateway endpoint 讓流量不經過 Internet 或 NAT。"},{to:"transit-gateway",dir:"out",how:"多 VPC 與地端網路互連的樞紐。"},{to:"direct-connect",dir:"in",how:"專線接入 VPC，取得穩定頻寬與私有連線。"},{to:"cloudwatch",dir:"out",how:"VPC Flow Logs 記錄網路流量，用於資安調查與疑難排解。"}],settings:[{name:"CIDR block",required:!0,warn:!0,desc:"一旦建立無法更改（只能加 secondary CIDR）。**不要與地端或其他 VPC 重疊**，否則無法互連。"},{name:"Subnet 的 AZ 與大小",required:!0,warn:!0,desc:"多 AZ 才能高可用；子網太小（如 /28 只有 11 個可用 IP）會成為擴展瓶頸。"},{name:"Auto-assign public IP",warn:!0,desc:"Public subnet 才需要；private subnet 設了反而危險。"},{name:"NAT Gateway 數量與位置",warn:!0,desc:"每個 AZ 一個才不會跨 AZ 失效，但成本也翻倍——這是常見的成本 / 可用性取捨。"},{name:"Security Group 規則",required:!0,warn:!0,desc:"只開必要 port 與來源；SG 之間可以用「參照另一個 SG」而不是 IP 網段。"},{name:"NACL 規則",desc:"預設全開；若自訂規則，記得**雙向**都要允許（含 ephemeral ports 1024-65535）。"},{name:"VPC Flow Logs",desc:"存到 CloudWatch Logs 或 S3；ALL / ACCEPT / REJECT 可選。"},{name:"DNS hostnames / resolution",desc:"需要 private DNS 名稱或與其他 VPC 互連時要啟用。"}],pricing:{model:"**VPC 本身免費**。付費的是 NAT Gateway、PrivateLink、流量與 VPN/Direct Connect。",free:"VPC、子網、路由表、Security Group、NACL、IGW 全部免費。",rows:[{tier:"VPC / Subnet / IGW / SG",price:"免費",note:"基礎網路元件不收費。",level:0},{tier:"NAT Gateway",price:"$0.045 / 小時 + $0.045 / GB",note:"一個月約 $33 起，加上流量費——帳單殺手第一名。",level:3},{tier:"Gateway Endpoint（S3 / DynamoDB）",price:"免費",note:"不用就太可惜了。",level:0},{tier:"Interface Endpoint（PrivateLink）",price:"$0.01 / 小時 / AZ + $0.01 / GB",note:"每個 AZ 都要算，多 AZ 部署要乘以數量。",level:2},{tier:"跨 AZ 流量",price:"$0.01 / GB 各方向",note:"同一 Region 不同 AZ 之間也收費。",level:1},{tier:"資料傳輸 Out",price:"$0.09 / GB 起",note:"出網際網路。",level:2}],traps:["**NAT Gateway 是「按小時 + 按流量」雙重收費**，忘掉一個沒用的 NAT 每月就是 $33。","EC2 讀 S3 走 NAT 要付流量費，改走 Gateway Endpoint 就免費。","同一 Region 跨 AZ 的流量（AZ-a 的應用打 AZ-b 的資料庫）也要錢，架構上盡量同 AZ 溝通。","多 AZ 部署 Interface Endpoint 是每個 AZ 各一筆費用。"]},cli:["aws ec2 create-vpc --cidr-block 10.0.0.0/16","aws ec2 create-subnet --vpc-id vpc-123 --cidr-block 10.0.1.0/24 --availability-zone ap-northeast-1a","aws ec2 create-internet-gateway && aws ec2 attach-internet-gateway --vpc-id vpc-123 --internet-gateway-id igw-1","aws ec2 create-nat-gateway --subnet-id subnet-pub --allocation-id eipalloc-1","aws ec2 authorize-security-group-ingress --group-id sg-1 --protocol tcp --port 443 --cidr 0.0.0.0/0"],exam:["「**private subnet 需要對外下載套件**」→ NAT Gateway（放 public subnet）。","「**不要讓外部主動連入**」→ NAT（不是 IGW）。","「**SG vs NACL**」：SG 有狀態 / 只能 allow；NACL 無狀態 / 可 deny / 子網層級。","「**VPC 無法與地端連線**」→ 檢查 CIDR 是否重疊。","「**不經公網存取 S3**」→ Gateway Endpoint；「**私有存取第三方 API / 自建服務**」→ Interface Endpoint（PrivateLink）。","「**多 VPC 互連、要集中管理**」→ Transit Gateway；「**只有兩個 VPC**」→ Peering。"],gotchas:["AWS 每個子網會保留 5 個 IP（network、router、DNS、future、broadcast）。","Peering 不具遞移性：A-B、B-C 互連不等於 A 能連 C。","Security Group 不能 deny，要「封鎖特定 IP」得靠 NACL 或 Network Firewall。","Default VPC 方便但常常被開得亂七八糟，正式環境建議自建。","Elastic IP 沒有綁定執行中的資源會被收費。"],related:["vpc-endpoints","route53","cloudfront","transit-gateway","direct-connect"]},{id:"route53",name:"Amazon Route 53",zh:"DNS 與網域註冊",category:"network",emoji:"\uD83E\uDDED",tagline:"把網域指到正確的地方：DNS 解析、健康檢查、多種路由策略與網域註冊。",aliases:["dns","domain","hosted zone","failover","latency routing"],intro:["**Route 53** 是 AWS 的 DNS 服務（名稱來自 DNS 埠 53），也是網域註冊商。你在 **Hosted Zone** 裡建立記錄（A、AAAA、CNAME、MX…），回答「這個網域對應到哪裡」。","它的價值不只是 DNS：內建**健康檢查**與**多種路由策略**（Simple、Weighted、Latency、Failover、Geolocation、Geoproximity、Multi-Value），讓 DNS 本身就是一層流量管理與災難復原機制。","還有 **Private Hosted Zone**：只在 VPC 內可解析的內部域名（例如 `db.internal`），是內部服務發現的常見做法。"],concepts:[{term:"Hosted Zone",desc:"一個網域的記錄容器。Public（對外）或 Private（綁 VPC）。"},{term:"Record Types",desc:"A（IPv4）、AAAA（IPv6）、CNAME、Alias、MX、TXT、NS、SOA。"},{term:"Alias vs CNAME",desc:"Alias 指向 AWS 資源（免費、可在 apex 使用、可綁 health check）；CNAME 指向任何網域但不能用於 apex（根網域）。"},{term:"TTL",desc:"快取的存活時間。切換前先調低（例如 60 秒）才能快速生效。"},{term:"Routing Policy",desc:"Simple、Weighted（A/B 測試）、Latency（延遲最低）、Failover（主備）、Geolocation（依國家）、Geoproximity（依距離 + bias）、Multi-Value（多值 + 健康檢查）。"},{term:"Health Check",desc:"主動監控端點（HTTP / TCP / CloudWatch alarm），失敗時把流量切到備援。"},{term:"Traffic Flow",desc:"用視覺化方式組合多層路由策略（例如地理 + 延遲 + 加權）。"}],interactions:[{to:"cloudfront",dir:"out",how:"最常見的組合：Alias 記錄指向 CloudFront 發佈，把網域接到 CDN。"},{to:"elb",dir:"out",how:"Alias 指向 ALB / NLB 的 DNS 名稱，並可搭配健康檢查做 failover。"},{to:"s3",dir:"out",how:"Alias 指向 S3 靜態網站端點（注意只能指到同 Region 名稱）。"},{to:"global-accelerator",dir:"out",how:"Anycast IP 綁定，再用 Route 53 指向加速器。"},{to:"acm",dir:"in",how:"憑證驗證需要在 Route 53 建立 CNAME（DNS validation），自動續期。"},{to:"vpc",dir:"both",how:"Private Hosted Zone 綁定 VPC 提供內部域名解析。"},{to:"ec2",dir:"out",how:"A 記錄指向 Elastic IP 或直接用 Alias 指到負載平衡器。"},{to:"cloudwatch",dir:"both",how:"健康檢查狀態可觸發 CloudWatch alarm 做自動化處理。"}],settings:[{name:"Record type（Alias vs CNAME）",required:!0,warn:!0,desc:"根網域只能用 Alias 或 A 記錄；Alias 免費且支援 health check。"},{name:"TTL",warn:!0,desc:"預設 300 秒。計畫切換前調低到 60，切換完成再調回。"},{name:"Routing policy",required:!0,desc:"先問目的：省延遲、分散風險、A/B 測試、還是災難復原？"},{name:"Health check（含 failover 類型）",warn:!0,desc:"Failover 策略一定要設定，否則不會切換。"},{name:"Set ID",desc:"使用非 Simple 策略時每筆記錄都要有唯一 Set ID。"},{name:"Domain registration / 自動續約",desc:"別讓網域過期（續約失敗會直接下線）。"},{name:"DNSSEC",desc:"提升 DNS 安全性，需在註冊商設定 DS 記錄。"},{name:"Private Hosted Zone association",desc:"要明確關聯 VPC，否則查不到。"}],pricing:{model:"**Hosted Zone 月費 + 查詢次數**，加上網域註冊年費與健康檢查月費。",free:"沒有免費額度（每月第一個 hosted zone 在部分方案中免費）。",rows:[{tier:"Hosted Zone",price:"$0.50 / 月",note:"每個 public 或 private zone。",level:1},{tier:"標準查詢",price:"$0.40 / 百萬次",note:"前 10 億次；流量大時才明顯。",level:1},{tier:"延遲型 / 地理型查詢",price:"$0.60 / 百萬次",note:"進階策略單價較高。",level:1},{tier:"健康檢查",price:"$0.50 / 月 / 端點（可選 $1–$2 加速）",note:"多端點 + 多 Region 會累積。",level:1},{tier:"網域註冊（.com）",price:"約 $14 / 年",note:"依 TLD 不同。",level:1}],traps:["健康檢查是**每端點每月**計費，多 Region 多端點會變成一筆固定支出。","TTL 太長導致切換慢，平時就該壓低（例如 60 秒），不要等事故才改。","查詢量極大的大型網站要注意 DNS 查詢費。"]},cli:["aws route53 create-hosted-zone --name example.com --caller-reference $RANDOM","aws route53 change-resource-record-sets --hosted-zone-id Z123 --change-batch file://record.json",'# record.json: { "Changes":[{ "Action":"UPSERT","ResourceRecordSet":{ "Name":"www.example.com","Type":"A","AliasTarget":{"DNSName":"dualstack.my-alb-123.ap-northeast-1.elb.amazonaws.com","HostedZoneId":"Z14GRHDCWA56QT","EvaluateTargetHealth":true}}} ] }'],exam:["「**A/B 測試、逐步切流量**」→ Weighted。","「**最低延遲、全球使用者**」→ Latency-based。","「**台灣使用者看到台灣站，日本看到日本站**」→ Geolocation。","「**主站掛掉自動切備援**」→ Failover + Health Check。","「**根網域指向 CloudFront / ALB**」→ Alias 記錄（CNAME 不能用）。","內部域名解析 → Private Hosted Zone。","ACM 憑證驗證的最快方式 → Route 53 CNAME 驗證。"],gotchas:["用 CNAME 指到 Elastic Load Balancer 的名稱是錯的（要用 Alias）。","Alias 只能指向同 Region 的 S3 網站端點（跨區要用 CloudFront）。","Health check 檢查的是 DNS 名稱，如果端點本身有問題也可能誤判，建議搭配 alarm 檢查。","轉移註冊商時要小心 NS 記錄設定，否則會出現解析黑洞。"],related:["cloudfront","elb","global-accelerator","acm","vpc"]},{id:"cloudfront",name:"Amazon CloudFront",zh:"內容傳遞網路（CDN）",category:"network",emoji:"\uD83D\uDEF0️",tagline:"把內容快取到全球 400+ 個節點：使用者離你多遠都很快，還順便擋攻擊。",aliases:["cdn","edge","快取","oac","signed url"],intro:["**CloudFront** 是 CDN：使用者請求先到最近的 **Edge Location**，有快取就直接回應（快），沒有就回 **Origin**（S3 / ALB / EC2 / 自訂 HTTP）取資料並快取。","除了加速，它還提供 **HTTPS 憑證（ACM）**、**Signed URL / Cookie**（付費內容保護）、**Geo Restriction**、**Field-level encryption**，並可掛 **AWS WAF / Shield** 抵擋攻擊。","與 **Global Accelerator** 的差別：CloudFront 是**快取內容**（HTTP/HTTPS，可快取）；Global Accelerator 是**加速任何 TCP/UDP 流量**（不快取）。"],concepts:[{term:"Distribution / Origin",desc:"一組設定與其來源。Origin 可以是 S3、ALB、API Gateway、甚至外部 HTTP 伺服器。"},{term:"Cache Behavior",desc:"依 path pattern 決定快取策略、TTL、允許的 HTTP 方法、要不要轉發 cookie / header。"},{term:"OAC / OAI",desc:"Origin Access Control（新）／Origin Access Identity（舊）：讓 S3 只接受來自這個 CDN 的請求。"},{term:"TTL / Invalidation",desc:"Min / Default / Max TTL 決定快取時間；`Invalidation` 可以強制清除（每月 1000 條免費）。"},{term:"Cache Key",desc:"決定「什麼算同一份快取」：query string、cookie、header 都算。設計太細會讓命中率崩掉。"},{term:"Signed URL / Signed Cookie",desc:"給付費內容臨時授權（用 CloudFront key pair 或 Trusted Key Group）。"},{term:"CloudFront Functions / Lambda@Edge",desc:"在 Edge 執行輕量邏輯（改標頭、重導、A/B 測試）；Functions 更快更便宜，Lambda@Edge 功能更強。"}],interactions:[{to:"s3",dir:"in",how:"最常見的靜態網站 / 檔案來源，用 OAC 限制只能透過 CDN 讀取。"},{to:"elb",dir:"in",how:"動態內容的 origin：ALB 後面是 EC2 / 容器，CloudFront 負責快取靜態資源。"},{to:"acm",dir:"in",how:"憑證必須在 **us-east-1** 簽發才能綁 CloudFront（很容易踩）。"},{to:"waf",dir:"in",how:"在 Edge 層過濾 SQL injection、XSS、惡意 IP，攻擊流量在離使用者最近的地方就被擋下。"},{to:"shield",dir:"in",how:"Shield Advanced 提供 DDoS 成本保護與進階緩解。"},{to:"lambda",dir:"in",how:"Lambda@Edge 在 origin request / viewer request 階段改寫請求與回應。"},{to:"route53",dir:"in",how:"用 Alias 記錄把網域指向 distribution（含 IPv6 時用 dualstack 名稱）。"},{to:"api-gateway",dir:"in",how:"API Gateway 當 origin 快取 API 回應，或做 edge-optimized 部署。"},{to:"cloudwatch",dir:"out",how:"CacheHitRate、OriginLatency、4xx/5xx 錯誤率等指標；access log 可存 S3。"}],settings:[{name:"Origin / Origin group",required:!0,desc:"多來源可做 failover（primary 掛掉自動用 secondary）。"},{name:"Viewer protocol policy",required:!0,desc:"建議 `Redirect HTTP to HTTPS` 或 `HTTPS only`。"},{name:"Allowed HTTP methods",desc:"靜態內容不需要 PUT / POST；只給最基本的方法可提升快取效率。"},{name:"Cache policy / TTL",required:!0,warn:!0,desc:"Min/Default/Max TTL 與 cache key 設定錯誤會導致命中率低或更新不即時。"},{name:"Origin request policy",warn:!0,desc:"要不要轉發 header / cookie / query string 到 origin；多轉一份就少一份快取命中。"},{name:"Price Class",warn:!0,desc:"決定使用哪些 Edge（All / 200 / 100）；只用主要區域可省傳輸費。"},{name:"Restrict viewer access（Signed URL）",desc:"付費內容必設；需要 key group 與應用端簽章邏輯。"},{name:"WAF / Geo restriction",desc:"可依國家封鎖或允許；法規要求（例如串流授權）常用。"},{name:"Access logs / Real-time logs",desc:"標準 log 到 S3（有延遲）；real-time log 可到 Kinesis 做即時分析。"}],pricing:{model:"依**資料傳輸（GB）** + **HTTP 請求數** + 快取失效 + Lambda@Edge / Functions 計費。傳輸費比直接用 S3 便宜。",free:"免費方案：每月 1 TB 傳輸 + 10,000,000 請求（12 個月）。",rows:[{tier:"資料傳輸（美國/歐洲）",price:"$0.085 / GB（前 10 TB）",note:"比 S3 直出的 $0.09 略便宜，且地理階梯定價。",level:2},{tier:"請求數",price:"$0.0075 / 10,000（HTTPS）",note:"大量小檔案時這項會變主要成本。",level:1},{tier:"Invalidation",price:"$0.005 / path（超過 1000 條）",note:"不要用失效來代替正確的 TTL 設計。",level:1},{tier:"CloudFront Functions",price:"$0.10 / 百萬次",note:"比 Lambda@Edge 便宜非常多。",level:1},{tier:"Lambda@Edge",price:"$0.60 / 百萬次 + 執行時間",note:"只在需要在 origin 階段做複雜處理時使用。",level:2},{tier:"Field-level encryption / 其他",price:"另計",note:"少用。",level:1}],traps:["**Cache hit ratio 低** → 幾乎所有請求都回到 origin，CDN 的價值消失（還多了延遲）。","Cache key 帶入太多變數（例如把整個 cookie 都算進去）會讓命中率掉到 0。","過度使用 invalidation：每次部署都清快取，不如用檔名 hash 版本化。","Price Class 選 All 會用到較貴的區域 Edge，成本較高。"]},cli:["aws cloudfront create-distribution --origin-domain-name my-bucket.s3.amazonaws.com \\","  --default-root-object index.html",'aws cloudfront create-invalidation --distribution-id E123 --paths "/index.html" "/images/*"'],exam:["「**全球加速靜態內容 / 影片**」→ CloudFront；「**加速 TCP/UDP、不能快取**」→ Global Accelerator。","「**限制 S3 只能被 CDN 讀**」→ OAC（+ bucket policy）。","「**憑證要在哪個 Region 簽**」→ us-east-1。","「**要保護付費影片**」→ Signed URL / Signed Cookie。","「**在 Edge 改寫 header**」→ CloudFront Functions（輕量）或 Lambda@Edge（複雜）。","「**減少 origin 負載**」→ 拉長 TTL、提高 cache hit ratio、用 origin shield。"],gotchas:["部署新版本後看不到更新 → 快取問題，用版本化檔名或 invalidation。","ACM 憑證不在 us-east-1 就無法綁定。","CloudFront 不會快取 4xx/5xx（可設定但要小心），origin 掛掉時錯誤會直接透傳。","OAI 正被 OAC 取代，新設定請用 OAC。","動態網站（每次回應都不同）用 CDN 效益低，重點是靜態資產與 TLS 終結。"],related:["s3","route53","waf","global-accelerator","acm"]},{id:"elb",name:"Elastic Load Balancing (ELB)",zh:"負載平衡器（ALB / NLB / GWLB）",category:"network",emoji:"⚖️",tagline:"把流量分給多台後端：健康檢查、TLS 終結、路徑路由都在這裡做。",aliases:["alb","nlb","load balancer","負載平衡","target group"],intro:["**ELB** 是託管的負載平衡服務，四種版本：**ALB**（Application，HTTP/HTTPS 第 7 層）、**NLB**（Network，TCP/UDP 第 4 層、極低延遲、固定 IP）、**GWLB**（Gateway，給防火牆設備用）、以及已淘汰的 **CLB**。","ELB 會**跨多個 AZ 部署**、對後端做 health check、自動剔除不健康的目標，並與 [[auto-scaling|Auto Scaling]]、[[waf|WAF]]、[[acm|ACM]] 無縫整合。","選型一句話：**需要看懂 HTTP（路徑、host、cookie）→ ALB；需要極高效能、固定 IP、非 HTTP 協定 → NLB**。"],concepts:[{term:"Listener / Rule",desc:"監聽 port 與協定，依條件（path、host、header）決定導到哪個 target group。"},{term:"Target Group",desc:"後端群組（EC2 instance、IP、Lambda、ALB）。健康檢查設定在這裡。"},{term:"Sticky Session",desc:"同一使用者固定導到同一台機器（ALB 用 cookie，NLB 用來源 IP）。"},{term:"Health Check",desc:"path / port / 閾值設定；設定錯誤會讓正常機器被判定不健康。"},{term:"Cross-Zone Load Balancing",desc:"是否把所有 AZ 的目標視為同一個池；ALB 預設開啟且免費，NLB 預設關閉且跨區流量要錢。"},{term:"Connection Draining / Deregistration Delay",desc:"關機前等待既有連線完成（預設 300 秒）。"},{term:"SNI",desc:"讓一個 listener 掛多張憑證（多網域 HTTPS）。"}],interactions:[{to:"ec2",dir:"out",how:"將流量分發到多台 EC2 並做健康檢查；ASG 會把新機器自動註冊到 target group。"},{to:"auto-scaling",dir:"both",how:"ASG 與 ELB 是標配組合：擴縮時自動加入 / 移出目標。"},{to:"acm",dir:"in",how:"HTTPS listener 使用 ACM 憑證，並可自動續期。"},{to:"waf",dir:"in",how:"ALB 可掛 WAF 過濾惡意請求（第 7 層）。"},{to:"route53",dir:"out",how:"Alias 記錄指向 ELB 的 DNS 名稱，並可依健康狀態做 failover。"},{to:"ecs",dir:"in",how:"動態 port mapping 讓多個容器共用 ALB；Service 自動註冊目標。"},{to:"cloudfront",dir:"out",how:"ALB 可以當 CloudFront 的 origin（動態內容），或 CloudFront 作為前方的 TLS / 快取層。"},{to:"lambda",dir:"in",how:"ALB 可以直接把請求丟給 Lambda（無伺服器後端）。"},{to:"cloudwatch",dir:"out",how:"TargetResponseTime、UnHealthyHostCount、5xx 等指標。"}],settings:[{name:"LB 類型",required:!0,desc:"HTTP/HTTPS + 進階路由 → ALB；TCP/UDP、固定 IP、極低延遲 → NLB。"},{name:"Scheme: internet-facing / internal",required:!0,desc:"對外或只給 VPC 內部使用。"},{name:"Subnets（至少 2 個 AZ）",required:!0,warn:!0,desc:"只選一個 AZ 就不具備高可用；ALB 需要 public subnet（internet-facing 時）。"},{name:"Security Group",required:!0,warn:!0,desc:"ALB 有 SG，NLB 沒有 SG（只能靠後端的 SG 或子網 NACL）。"},{name:"Health check path / 閾值",required:!0,warn:!0,desc:"設錯會導致全體不健康或無法剔除壞機器。"},{name:"Deregistration delay",desc:"部署時避免中斷既有請求；太高會拖慢部署。"},{name:"Cross-zone load balancing",warn:!0,desc:"NLB 開啟後跨 AZ 流量要收費；ALB 預設開啟。"},{name:"Idle timeout / Keep-alive",desc:"長連線 API 常見 5xx 的元兇（預設 60 秒）。"},{name:"Access logs / Deletion protection",desc:"存到 S3 做分析；防誤刪。"}],pricing:{model:"**每小時固定費 + LCU（容量單位）**：依新增連線、活躍連線、流量、規則評估數計費。",free:"沒有免費額度。",rows:[{tier:"ALB 固定費",price:"$0.0225 / 小時（約 $16/月）",note:"每個 AZ 都算，跨 AZ 部署成本相乘。",level:2},{tier:"ALB LCU",price:"$0.008 / LCU-小時",note:"依實際流量四項指標取最大值。",level:2},{tier:"NLB 固定費",price:"$0.0225 / 小時",note:"與 ALB 相近但 NLB LCU 較貴。",level:2},{tier:"NLB LCU",price:"$0.006 / LCU-小時",note:"處理大量連線時成本較高。",level:2},{tier:"GWLB",price:"$0.0125 / 小時 + $0.004 / GB",note:"防火牆 / IDS 專用。",level:2}],traps:["ELB 是**按小時計費**：測試環境忘了刪就一直收錢（每個 AZ 一筆）。","流量不大但連線數多（例如 IoT）會讓 LCU 費用超過預期。","NLB 開啟跨區負載平衡會產生跨 AZ 流量費。","ALB 的**規則數**也影響 LCU 計算，複雜路由會比較貴。"]},cli:["aws elbv2 create-load-balancer --name app-alb --type application \\","  --subnets subnet-a subnet-b --security-groups sg-1","aws elbv2 create-target-group --name app-tg --protocol HTTP --port 80 \\","  --vpc-id vpc-1 --health-check-path /health","aws elbv2 create-listener --load-balancer-arn $ALB_ARN \\","  --protocol HTTPS --port 443 --certificates CertificateArn=$CERT_ARN \\","  --default-actions Type=forward,TargetGroupArn=$TG_ARN"],exam:["「**依路徑 / 主機名稱路由、HTTP 標頭導向**」→ ALB。","「**固定 IP、極低延遲、非 HTTP（TCP/UDP）**」→ NLB。","「**需要靜態 IP 給防火牆白名單**」→ NLB（有 Elastic IP）。","「**NLB 沒有 Security Group**」是常考的細節。","「**WebSocket / gRPC**」→ ALB 支援。","「**Lambda 作為後端**」→ ALB 可以（不是 NLB）。","健康檢查失敗時要檢查：SG、health check path、port、AZ。"],gotchas:["Sticky session 會讓流量不平均，也可能造成部署時連線卡住。","NLB 是第 4 層，無法讀取 HTTP 標頭 → 不能做 path routing。","ALB 的 IP 會變（請用 DNS 名稱），需要固定 IP 就要 NLB。","CLB 已淘汰，考試若出現請選 ALB / NLB。","Deregistration delay 太短會在部署時產生 502。"],related:["auto-scaling","ec2","route53","waf","ecs"]},{id:"api-gateway",name:"Amazon API Gateway",zh:"API 管理服務",category:"network",emoji:"\uD83D\uDEAA",tagline:"無伺服器 API 的門面：認證、限流、快取、版本與監控都交給它。",aliases:["rest api","http api","websocket","apikey","stage"],intro:["**API Gateway** 幫你把後端（Lambda、EC2、任何 HTTP 端點、AWS 服務）包成穩定的 API：處理 TLS、認證授權、流量控管、請求驗證、快取與監控。","三種類型：**REST API**（功能最完整：API key、使用計畫、快取、要求驗證）、**HTTP API**（更便宜更快、支援 JWT 授權、適合純代理）、**WebSocket API**（雙向即時通訊）。","它是無伺服器架構的入口：`API Gateway + Lambda + DynamoDB` 幾乎是所有 serverless 應用的起點。"],concepts:[{term:"Resource / Method",desc:"REST 風格的資源路徑（`/users/{id}`）與 HTTP 方法。"},{term:"Stage",desc:"部署環境（dev / prod），有自己的 URL 與設定，可做 canary 部署。"},{term:"Integration",desc:"後端型態：Lambda proxy、HTTP proxy、AWS 服務（直接寫 DynamoDB、SQS）、Mock。"},{term:"Authorizer",desc:"IAM、Lambda authorizer（自訂）、Cognito User Pool、JWT（HTTP API）。"},{term:"Usage Plan / API Key",desc:"對第三方開放 API 時做配額與限流。"},{term:"Throttling",desc:"預設帳號層級每秒 10,000 請求、突發 5,000；可設 stage 或 method 層級限流。"},{term:"Endpoint Type",desc:"Edge-optimized（走 CloudFront）、Regional（區域端點）、Private（只能從 VPC 內用 Interface Endpoint 存取）。"}],interactions:[{to:"lambda",dir:"out",how:"最常見的後端：Lambda proxy integration，把整個請求（含標頭、body）傳給函式。"},{to:"cognito",dir:"in",how:"用 Cognito User Pool 作為 authorizer，讓前端直接取得 JWT 呼叫 API。"},{to:"iam",dir:"in",how:"IAM 授權（SigV4）適合服務對服務；也可用 Lambda authorizer 做自訂邏輯。"},{to:"waf",dir:"in",how:"在 API 前掛 WAF 過濾惡意請求（REST API 支援）。"},{to:"cloudfront",dir:"in",how:"CloudFront 當 API 的快取與 TLS 層，或使用 Edge-optimized 端點。"},{to:"step-functions",dir:"out",how:"API 觸發長時間工作流，同步回應改為非同步處理。"},{to:"sqs",dir:"out",how:"直接把請求丟進佇列（AWS 服務整合，不必經過 Lambda），做非同步緩衝。"},{to:"dynamodb",dir:"out",how:"直接整合 DynamoDB 做簡單 CRUD，省一層 Lambda（延遲與成本都較低）。"},{to:"cloudwatch",dir:"out",how:"執行 log、延遲、4xx/5xx、cache hit 等指標；也有 access log 到 Kinesis。"}],settings:[{name:"API 類型（REST / HTTP / WebSocket）",required:!0,desc:"HTTP API 便宜 70% 但功能較少；需要 API key / 使用計畫 / 快取 → REST。"},{name:"Endpoint type",required:!0,warn:!0,desc:"Private 端點只能從 VPC 內透過 Interface Endpoint 呼叫（企業內部 API 常用）。"},{name:"Authorization",required:!0,warn:!0,desc:"NONE 就是公開 API——這是最常見的資安事故來源。"},{name:"Throttling / Burst",warn:!0,desc:"防止後端被灌爆；Lambda 併發也要一起考慮。"},{name:"Caching（僅 REST）",desc:"按 GB-小時計費；需要 TTL 與 invalidation 策略。"},{name:"Request validation / Mapping templates",desc:"在入口就擋掉格式錯誤的請求，減少後端成本。"},{name:"Binary media types / 大小限制",desc:"payload 上限 10 MB，超過要用 S3 pre-signed URL。"},{name:"Custom domain + ACM",desc:"用自有網域（ACM 憑證需在相同 Region，Edge-optimized 要在 us-east-1）。"},{name:"Logging / X-Ray",desc:"執行 log 與 access log；追蹤請求在整個系統中的路徑。"}],pricing:{model:"**每百萬次 API 呼叫** + 資料傳輸 +（REST 才有的）快取儲存費。WebSocket 另按訊息數與連線分鐘計費。",free:"免費方案：每月 100 萬次 REST API 呼叫（12 個月）。",rows:[{tier:"HTTP API",price:"$1.00 / 百萬次",note:"最便宜，適合純代理。",level:1},{tier:"REST API",price:"$3.50 / 百萬次（前 333 百萬）",note:"功能多但單價為 HTTP API 的 3.5 倍。",level:2},{tier:"WebSocket",price:"$1.00 / 百萬訊息 + $0.25 / 百萬連線分鐘",note:"聊天 / 即時通知類應用。",level:2},{tier:"Caching（REST）",price:"$0.020 / GB-小時（0.5 GB 起）",note:"0.5 GB 一個月約 $14，常忘了關。",level:2},{tier:"Private API（Interface Endpoint）",price:"依時數 + 流量",note:"每個 AZ 都計費。",level:2}],traps:["**沒有設限流**的公開 API 一旦被爬蟲掃，Lambda 併發暴增、帳單也暴增。","REST API 快取設定好卻沒開，等於白花錢；開了但命中率低也一樣。","Payload 上限 10 MB，超過會直接 413（檔案要走 S3 pre-signed URL）。","Private API 的 VPC Endpoint 是按 AZ 計費的固定成本。"]},cli:["# 用 AWS CLI 建立 HTTP API（最簡單的代理）","aws apigatewayv2 create-api --name app-api --protocol-type HTTP --target arn:aws:lambda:...:function:handler","","# REST API 需要先建立 resource / method / integration / deployment","aws apigateway create-rest-api --name rest-api","aws apigateway create-deployment --rest-api-id $API_ID --stage-name prod"],exam:["「**無伺服器 API、要 JWT、要便宜**」→ HTTP API。","「**需要 API key、使用計畫、回應快取、要求驗證**」→ REST API。","「**即時雙向通訊（聊天）**」→ WebSocket API。","「**只能從 VPC 內部呼叫的 API**」→ Private endpoint + Interface Endpoint。","「**第三方合作夥伴要配額限制**」→ Usage Plan + API Key。","「**API 需要 Cognito 登入**」→ Cognito User Pools authorizer。","API Gateway 的 payload 限制 10 MB；檔案上傳要用 S3 pre-signed URL。"],gotchas:["API Gateway timeout 為 29 秒（無法調整）；長時間處理請改用非同步模式。","Lambda proxy integration 會把整個請求傳給函式，格式處理要正確。","CORS 需要另外在 API 上設定（尤其是用 Lambda proxy 時要自己回標頭）。","HTTP API 不支援 API key / 使用計畫 / 快取——需要這些功能只能選 REST API。","部署後忘記建立 deployment，修改不會生效（REST API 特有陷阱）。"],related:["lambda","cognito","cloudfront","waf","step-functions"]},{id:"global-accelerator",name:"AWS Global Accelerator",zh:"全球網路加速器",category:"network",emoji:"\uD83E\uDDF2",tagline:"用 Anycast IP 讓全球使用者走 AWS 的骨幹網路，不必靠公網繞路。",aliases:["anycast","accelerator","tcp","udp","加速"],intro:["**Global Accelerator** 提供兩個（或更多）**Anycast 靜態 IP**，全球使用者都會被導到最近的 AWS Edge，之後走 AWS 的內部骨幹網路到你的資源。","它不快取內容，純粹加速 **TCP / UDP** 流量（遊戲、VoIP、IoT、自訂協定），並可依健康狀態或權重把流量導到不同 Region 的端點。","跟 CloudFront 的差異是必考：**CloudFront = 快取內容（HTTP/HTTPS）**；**Global Accelerator = 加速傳輸（任何 TCP/UDP，不快取）**，而且提供**固定 IP**。"],concepts:[{term:"Anycast IP",desc:"同一組 IP 在全球多個 Edge 同時公告，使用者自然被導到最近的一個。"},{term:"Endpoint Group",desc:"一個 Region 裡的端點集合（ALB / NLB / EC2 / Elastic IP）。"},{term:"Traffic Dial / Endpoint Weight",desc:"用比例控制每個 Region 承接的流量，可做漸進式切換。"},{term:"Health Check",desc:"依端點健康狀態自動切換 Region，實現快速災難復原。"},{term:"Client Affinity",desc:"讓同一使用者的連線固定到同一個端點（有用 session 的服務需要）。"}],interactions:[{to:"elb",dir:"out",how:"最常見的端點型態：ALB / NLB，把加速流量導到後端服務。"},{to:"ec2",dir:"out",how:"直接以 EC2（Elastic IP）為端點，適合遊戲伺服器這類自訂協定。"},{to:"route53",dir:"both",how:"用自有網域 CNAME 到加速器的 DNS 名稱。"},{to:"cloudfront",dir:"both",how:"可搭配使用：CloudFront 處理快取的 HTTP 內容，Global Accelerator 處理其他流量。"},{to:"waf",dir:"in",how:"加速器不支援 WAF，若要第 7 層防護仍需掛在 ALB 或 CloudFront 上。"},{to:"shield",dir:"in",how:"Anycast + 邊緣吸收流量本身就是 DDoS 緩解的一部分。"},{to:"aurora",dir:"out",how:"搭配全域資料庫，讓各地使用者連到最近的讀取端點。"}],settings:[{name:"Accelerator type",required:!0,desc:"Standard（單一帳號）或 Custom Routing（指定 EC2 目的地，較少用）。"},{name:"Listener（port / protocol）",required:!0,desc:"TCP 或 UDP，指定要加速的 port 範圍。"},{name:"Endpoint groups（Region）",required:!0,warn:!0,desc:"通常放兩個以上 Region 才有意義（否則只是加速進 AWS）。"},{name:"Health check",warn:!0,desc:"預設 TCP；若端點是 ALB 建議調整 port / path，避免誤判。"},{name:"Client affinity",desc:"NONE 或 SOURCE_IP；需要 session 的服務選 SOURCE_IP。"},{name:"Traffic dial",desc:"漸進式轉移流量（例如 10% 到新 Region 測試）。"}],pricing:{model:"**固定小時費**（每個 accelerator）+ **每 GB 傳輸的 DT-Premium 費**。比起 CloudFront 多了固定費但涵蓋非 HTTP。",free:"沒有免費額度。",rows:[{tier:"Accelerator 小時費",price:"$0.025 / 小時（約 $18/月）",note:"不含流量。",level:2},{tier:"傳輸費（美國/歐洲）",price:"$0.015 / GB 起",note:"依來源與目的地 Region 不同（DT-Premium）。",level:1},{tier:"亞洲區傳輸",price:"$0.035 / GB 起",note:"較高，長距離傳輸成本要估算。",level:2},{tier:"Custom Routing",price:"較高的小時費",note:"特殊情境使用。",level:3}],traps:["固定小時費讓小流量的加速成本偏高——分析「值不值得」很重要。","端點放在多個 Region 時，跨區流量也要計費。","大家常誤以為它像 CloudFront 一樣能快取，其實不會。"]},exam:["「**固定 IP + 加速 TCP/UDP**」→ Global Accelerator。","「**全球 HTTP 加速 + 快取**」→ CloudFront。","「**需要把使用者導到最近 Region 的後端**」→ Global Accelerator（+ 健康檢查）。","「**白名單需要固定 IP**」→ Global Accelerator 的 Anycast IP（CloudFront 的 IP 不固定）。"],gotchas:["不支援第 7 層功能（路徑路由、WAF、快取）。","Endpoint 只能選 ALB / NLB / EC2 / EIP，不能直接指 Lambda。","健康檢查設定不當會導致流量全部導到健康的 Region，反而讓該區超載。"],related:["cloudfront","elb","route53","shield"]},{id:"direct-connect",name:"AWS Direct Connect & VPN",zh:"專線與站點對站點 VPN",category:"network",emoji:"\uD83D\uDD0C",tagline:"把辦公室接進 AWS：專線穩定可預期，VPN 便宜且快速建置。",aliases:["dx","vpn","專線","site-to-site","hybrid network"],intro:["兩種把地端網路接上 VPC 的方式：**Direct Connect（DX）** 是實體專線（1 Gbps / 10 Gbps / 100 Gbps），頻寬穩定、延遲可預期、流量費較低；**Site-to-Site VPN** 走公網的 IPsec 通道，建置快（幾分鐘）、便宜，但效能取決於網際網路。","最佳實務通常是**兩者並用**：DX 當主要通道（穩定），VPN 當備援（DX 斷線時自動切換）。","DX 也可以接 **Transit Gateway** 或 **Direct Connect Gateway**，一次接入多個 VPC 與多個 Region。"],concepts:[{term:"Virtual Interface (VIF)",desc:"DX 上的邏輯介面：Private VIF（進 VPC）、Public VIF（連 AWS 公網服務）、Transit VIF（進 Transit Gateway）。"},{term:"Connection / LAG",desc:"實體埠與鏈路聚合（LAG）提高頻寬與可用性。"},{term:"Hosted Connection",desc:"透過 AWS 合作夥伴（Partner）申請較小的頻寬（例如 50 Mbps）。"},{term:"Site-to-Site VPN",desc:"兩個 tunnel（不同 AZ 的端點）的 IPsec VPN，可設定 BGP 動態路由或靜態路由。"},{term:"Accelerated Site-to-Site VPN",desc:"VPN 走 Global Accelerator 加速，跨洲連線更穩定。"},{term:"Client VPN",desc:"給「個別使用者」用的 VPN（OpenVPN 協定），讓員工從家裡連進 VPC。"}],interactions:[{to:"vpc",dir:"out",how:"Private VIF 或 VPN 直接連接 VPC 的 Virtual Private Gateway。"},{to:"transit-gateway",dir:"out",how:"Transit VIF 接 TGW，一次管理多個 VPC 與地端網段。"},{to:"storage-gateway",dir:"both",how:"大量資料上傳 / 備份走 DX 更穩定便宜。"},{to:"datasync",dir:"out",how:"搬移大量檔案時走專線，避免公網壅塞。"},{to:"route53",dir:"both",how:"Hybrid DNS：地端與雲端互相解析（Route 53 Resolver inbound / outbound endpoint）。"},{to:"vpc-endpoints",dir:"in",how:"透過 Public VIF 存取 S3 / DynamoDB 或走 Interface Endpoint。"},{to:"fsx",dir:"both",how:"地端應用透過專線存取雲端檔案系統。"}],settings:[{name:"頻寬與位置",required:!0,desc:"DX 要選離你資料中心最近的 DX Location，並決定 1/10/100 Gbps。"},{name:"VIF 類型與 VLAN",required:!0,warn:!0,desc:"Private / Public / Transit 決定用途，設定錯就完全連不通。"},{name:"BGP ASN 與路由",required:!0,warn:!0,desc:"兩端 ASN 與網段不能衝突；要設定 route propagation 或靜態路由。"},{name:"VPN tunnel 選項",desc:"IKEv1 / IKEv2、預先共用金鑰、dead peer detection。"},{name:"冗餘設計",warn:!0,desc:"DX 建議兩條不同 DX Location（真的斷線時才知道痛）；VPN 本身有兩個 tunnel，但都終結在同一個 AZ 群組。"},{name:"MTU",desc:"DX 支援 1500（jumbo frame 可到 9001，但兩端都要支援）。"},{name:"Route 53 Resolver endpoints",desc:"Hybrid DNS 需要 inbound（地端查雲端）與 outbound（雲端查地端）endpoint。"}],pricing:{model:"**DX**：埠小時費（依速度）+ 資料傳輸 Out；**VPN**：每小時連線費 + 傳輸費。DX 的流量費比公網便宜很多。",free:"沒有免費額度。",rows:[{tier:"DX 1 Gbps 埠",price:"約 $0.30 / 小時（約 $220/月）",note:"分攤在多個專案後通常划算。",level:3},{tier:"DX 10 Gbps 埠",price:"約 $1.80 / 小時（約 $1,300/月）",note:"大流量企業。",level:4},{tier:"DX 資料傳輸",price:"$0.02 / GB 起",note:"比公網 $0.09 便宜許多，大量傳輸能回本。",level:1},{tier:"Site-to-Site VPN",price:"$0.05 / 小時 + $0.09 / GB",note:"約 $36/月，建置成本幾乎為零。",level:1},{tier:"Client VPN",price:"$0.10 / 小時 + $0.05 / 小時 / 連線",note:"遠端辦公情境。",level:2}],traps:["DX 埠費是固定月費，流量太小時可能比 VPN 貴。","只申請一條 DX 就當作高可用是錯誤設計（DX 本身可能實體斷線）。","跨 Region 的 DX 流量（DX Gateway）有另一層計費。","VPN 走公網，實際吞吐可能遠低於理論值（尤其跨洲）。"]},exam:["「**穩定頻寬、大量資料、低延遲、流量費便宜**」→ Direct Connect。","「**快速建立、便宜、可接受公網變動**」→ Site-to-Site VPN。","「**DX 斷線要有備援**」→ 第二條 DX 到不同 location，或 DX + VPN 備援。","「**一次接多個 VPC / 多個 Region**」→ Direct Connect Gateway + Transit Gateway。","「**員工在家連內網**」→ Client VPN。","「**地端與雲端互相解析 DNS**」→ Route 53 Resolver endpoints。"],gotchas:["DX 不是加密的（除非你自己跑 MACsec 或上層加密），敏感流量要另加 VPN over DX。","設定 BGP / VLAN 任何一端錯就完全不通，且不容易 debug。","DX 建置需要數天到數週（實體線路），急件請用 VPN。"],related:["vpc","transit-gateway","route53","storage-gateway"]},{id:"transit-gateway",name:"AWS Transit Gateway",zh:"網路樞紐（Hub-and-Spoke）",category:"network",emoji:"\uD83D\uDEDE",tagline:"用一個中央路由器把幾十個 VPC 與地端網路接起來，取代 N×N 的 peering 惡夢。",aliases:["tgw","hub and spoke","peering","網路樞紐"],intro:["VPC Peering 是點對點且**不具遞移性**：5 個 VPC 全互連要 10 條連線，而且每加一個都要重設路由。**Transit Gateway（TGW）** 把這件事變成 Hub-and-Spoke：所有 VPC / VPN / DX 接到 TGW，由 TGW 的 route table 決定誰能到誰。","TGW 支援 **跨 Region peering**、**多個 route table 做網段隔離**（例如 production 與 dev 不能互通）、以及**集中式網路安全檢查**（流量先經過 Inspection VPC）。","它取代了舊時代的「用 EC2 自建 NAT / VPN 集中器」，也讓上百個 VPC 的組織能有一致的網路治理。"],concepts:[{term:"Attachment",desc:"把 VPC / VPN / DX / Peering 接上 TGW 的連接點。"},{term:"TGW Route Table",desc:"決定 attachment 之間的路由，可做隔離與集中。"},{term:"Association / Propagation",desc:"子網關聯到 route table，路由自動傳播。"},{term:"Transit Gateway Peering",desc:"跨 Region 的 TGW 互連（不支援跨 Region 的 route propagation 全自動）。"},{term:"中央化出口（Egress）",desc:"所有 VPC 共用一個 VPC 的 NAT / 防火牆出海，便於稽核與成本管理。"},{term:"Multicast / Appliance mode",desc:"特殊需求（多播、對稱路由的防火牆）要開啟對應模式。"}],interactions:[{to:"vpc",dir:"in",how:"每個 VPC 建立 TGW attachment（指定子網），並在子網路由表加指向 TGW 的路由。"},{to:"direct-connect",dir:"in",how:"使用 Transit VIF 讓地端網路一次連到所有 VPC。"},{to:"vpc-endpoints",dir:"in",how:"集中式 Interface Endpoint（Shared Services VPC）讓所有 VPC 共用。"},{to:"guardduty",dir:"out",how:"Inspection VPC 內的 Network Firewall 與 Flow Logs 搭配 GuardDuty 做流量威脅偵測（appliance mode 保證對稱路由）。"},{to:"route53",dir:"both",how:"跨 VPC 的私有 DNS 解析（Private Hosted Zone 關聯多個 VPC 或使用 Resolver）。"},{to:"cloudwatch",dir:"out",how:"TGW 的流量與封包指標、Flow Logs。"}],settings:[{name:"Attachment 子網",required:!0,warn:!0,desc:"每個 AZ 一個子網，選太少會失去高可用。"},{name:"Route table 設計",required:!0,warn:!0,desc:"最重要：用多個 route table 做環境隔離（dev / prod / shared）。"},{name:"DNS support / Appliance mode",warn:!0,desc:"需要跨 VPC 解析 DNS 或對稱路由通過防火牆時必開。"},{name:"Default route table association / propagation",desc:"預設開啟會讓所有 attachment 互相可見——隔離需求要關掉。"},{name:"Cross-Region peering",desc:"設定跨區互連，注意跨區流量費。"},{name:"Flow Logs",desc:"集中記錄網路流量，用於合規與調查。"}],pricing:{model:"**每個 attachment 小時費 + 每 GB 處理費**（跨 Region peering 另有跨區流量費）。",free:"沒有免費額度。",rows:[{tier:"Attachment",price:"$0.05 / 小時（約 $36/月）",note:"每個 VPC / VPN 各一筆，10 個 VPC 就是 $360/月。",level:3},{tier:"資料處理",price:"$0.02 / GB",note:"與 AZ 流量費不同的計費項。",level:2},{tier:"跨 Region peering",price:"$0.05 / GB 起",note:"跨區流量較貴，要估算。",level:3},{tier:"Centralized NAT（附加）",price:"NAT Gateway 費用",note:"集中出口省下多個 NAT 的固定費。",level:3}],traps:["Attachment 固定費會隨著 VPC 數量累積。","以為 TGW 可以取代 Security Group / NACL：它只管路由，不管安全規則。","忘了 Flow Logs 也是要付費的（存到 CloudWatch Logs 的費用常被忽略）。"]},exam:["「**大量 VPC 互連、要集中管理**」→ Transit Gateway。","「**只是兩個 VPC 要互通**」→ VPC Peering（更便宜）。","「**地端一次連多個 VPC**」→ DX Gateway + Transit Gateway。","「**要集中檢查跨 VPC 流量**」→ Inspection VPC + Transit Gateway + Network Firewall。","Peering 不可遞移是必考點，TGW 可以解決這個問題。"],gotchas:["TGW 不是防火牆，安全還是由 SG / NACL / Network Firewall 負責。","同一個 VPC 不能同時用 peering 和 TGW 走同一段網段（路由衝突）。","Appliance mode 沒開會造成回程流量不對稱，防火牆會擋掉。"],related:["vpc","direct-connect","vpc-endpoints","route53"]},{id:"vpc-endpoints",name:"VPC Endpoints / AWS PrivateLink",zh:"私有連線端點",category:"network",emoji:"\uD83D\uDD12",tagline:"不繞公網、不經過 NAT，就能私有地存取 AWS 服務或別人的服務。",aliases:["privatelink","endpoint","gateway endpoint","interface endpoint"],intro:["**VPC Endpoint** 讓 VPC 內的資源（EC2、Lambda、RDS）能存取 AWS 服務或第三方服務**不經過 Internet / NAT**，流量留在 AWS 網路內。","兩種類型：**Gateway Endpoint**（只支援 S3 與 DynamoDB，免費，用路由表實作）與 **Interface Endpoint**（基於 **PrivateLink**，在子網建立 ENI 與私有 IP，支援數百種服務，要付費）。","除了安全，最大的價值是**省錢**：Gateway Endpoint 讓 S3 流量不經 NAT Gateway，可直接省下大量 NAT 流量費。"],concepts:[{term:"Gateway Endpoint",desc:"S3 / DynamoDB 專用，免費，加在子網路由表；**不支援跨 Region 或從地端透過 VPN/DX 使用**。"},{term:"Interface Endpoint",desc:"每個 AZ 一個 ENI（私有 IP），需開啟 Security Group，支援大部分 AWS 服務。"},{term:"Endpoint Policy",desc:"限制透過 endpoint 能存取哪些資源（例如只能讀某個 bucket）。"},{term:"PrivateLink",desc:"把「自己的服務」以 Endpoint Service 形式分享給其他 VPC / 帳號，不必做 VPC Peering。"},{term:"Endpoint Service / NLB",desc:"提供者用 NLB 定義服務，消費者建立 Interface Endpoint 連過去。"}],interactions:[{to:"s3",dir:"out",how:"Gateway Endpoint 是標配：省 NAT 流量費、避免公網暴露。"},{to:"dynamodb",dir:"out",how:"同樣支援 Gateway Endpoint（免費）。"},{to:"vpc",dir:"in",how:"需在 VPC 內設定並關聯子網；Interface Endpoint 還需要 Security Group。"},{to:"secrets-manager",dir:"out",how:"常見的 Interface Endpoint 服務之一，讓私有子網的應用取得憑證。"},{to:"kms",dir:"out",how:"私有子網要呼叫 KMS 加解密時，沒有 endpoint 就只能繞 NAT。"},{to:"ecr",dir:"out",how:"ECS / EKS 在私有子網拉映像需要 ECR 與 S3 的 endpoint（否則拉不到）。"},{to:"cloudwatch",dir:"out",how:"把 log 送到 CloudWatch Logs 也可以走 Interface Endpoint。"},{to:"transit-gateway",dir:"both",how:"集中式 endpoint（Shared Services VPC）搭配 TGW 讓所有 VPC 共用。"}],settings:[{name:"Endpoint 類型",required:!0,warn:!0,desc:"S3 / DynamoDB 選 Gateway（免費）；其他服務選 Interface（要錢）。"},{name:"關聯的子網 / route table",required:!0,warn:!0,desc:"Gateway 要加進子網路由表；Interface 要選 AZ 與子網，通常每個 AZ 都要。"},{name:"Enable DNS name",warn:!0,desc:"Interface Endpoint 必須啟用 private DNS，否則服務的公開域名不會解析到 endpoint。"},{name:"Security Group",required:!0,desc:"Interface Endpoint 需要 SG 允許來自 VPC 的 443 流量。"},{name:"Endpoint policy",desc:"限制可存取的資源（例如只能讀特定 S3 bucket，或只能呼叫特定 Secrets）。"},{name:"Private DNS 衝突",warn:!0,desc:"VPC 若已有自訂 DNS 或與服務域名衝突會解析失敗。"}],pricing:{model:"Gateway Endpoint **免費**；Interface Endpoint 按**每個 AZ 每小時 + 每 GB** 計費（PrivateLink 雙向都收）。",free:"Gateway Endpoint（S3 / DynamoDB）完全免費。",rows:[{tier:"Gateway Endpoint（S3 / DynamoDB）",price:"免費",note:"還能省下 NAT 流量費，效益最高。",level:0},{tier:"Interface Endpoint",price:"$0.01 / 小時 / AZ",note:"每個 AZ 每月約 $7.3；10 個服務 × 3 AZ = $219/月。",level:2},{tier:"資料處理",price:"$0.01 / GB",note:"依流量計費。",level:1},{tier:"NAT Gateway（對照組）",price:"$0.045 / 小時 + $0.045 / GB",note:"同樣流量走 NAT 貴 4 倍以上。",level:3}],traps:["Interface Endpoint 每個 AZ 都要建，成本以「服務數 × AZ 數」累積。","Gateway Endpoint **無法**用於地端透過 VPN / DX 存取的流量。","私有子網沒有 endpoint 又沒有 NAT，應用會直接連不上（拉不到映像、拿不到密鑰）。"]},exam:["「**S3 / DynamoDB 不經公網、又不想付 NAT 費**」→ Gateway Endpoint。","「**私有存取其他 AWS 服務（Secrets Manager / KMS / ECR）**」→ Interface Endpoint。","「**分享自己的服務給其他 VPC / 帳號，不做 peering**」→ PrivateLink Endpoint Service + NLB。","「**跨 Region 存取 S3 用 Gateway Endpoint**」是錯的（Gateway 不支援跨區）。","Private 子網的 ECS 拉不到 ECR 映像 → 檢查 Interface Endpoint 或 NAT。"],gotchas:["Gateway Endpoint 只在同一 Region 有效。","Interface Endpoint 的 SG 沒設好會 timeout（且不易察覺是 endpoint 問題）。","Endpoint policy 太嚴格會讓某些 API 呼叫神秘失敗。"],related:["vpc","s3","transit-gateway","ecr","kms"]}];var j$=[{id:"iam",name:"AWS IAM",zh:"身分與存取管理",category:"security",emoji:"\uD83D\uDD11",tagline:"誰可以做什麼：使用者、群組、角色與政策，全部由 IAM 決定。",aliases:["policy","role","user","group","權限","mfa"],intro:["**IAM（Identity and Access Management）** 是 AWS 的權限系統：定義**身分**（User / Group / Role）與**政策**（Policy），決定誰能對哪些資源做哪些動作。","核心觀念：**預設拒絕**（沒有明文允許就是不行）、**最小權限**（只給需要的權限）、**能用角色就不要用長期金鑰**。","三種典型身分：**User**（人，有長期密碼 / Access Key）、**Group**（一群 User）、**Role**（給服務或跨帳號用的臨時身分，用 STS 換取臨時憑證）。"],concepts:[{term:"Policy 種類",desc:"Identity-based（掛在 User / Role）、Resource-based（掛在資源，如 S3 bucket policy）、Permission Boundary（權限上限）、SCP（組織層級上限）、Session Policy。"},{term:"Policy 結構",desc:"`Effect`（Allow / Deny）、`Action`、`Resource`、`Condition`。多個政策聯集運算：**任何一個 Deny 都會否決全部**。"},{term:"Role / STS",desc:"角色沒有長期憑證，透過 `AssumeRole` 取得有期限的臨時憑證。EC2 Instance Profile、Lambda Execution Role 都是這個機制。"},{term:"Policy Evaluation",desc:"SCP → Permission Boundary → Identity Policy → Resource Policy → Session Policy，任何一層沒過就不行。"},{term:"MFA",desc:"多因子驗證；可搭配政策條件要求「MFA 才能刪除資源」。"},{term:"IAM Access Analyzer",desc:"找出「對外公開」或「未被使用」的權限，是稽核的好工具。"}],interactions:[{to:"ec2",dir:"in",how:"Instance Profile 讓 EC2 上的程式取得臨時憑證，取代把 Access Key 寫在機器上。"},{to:"lambda",dir:"in",how:"Execution Role 決定函式能呼叫哪些服務、能寫哪個 log group。"},{to:"s3",dir:"both",how:"IAM policy 與 bucket policy 共同決定存取；兩者都允許才成立（同帳號的情況）。"},{to:"organizations",dir:"in",how:"SCP 在組織層級限制所有帳號的最大權限。"},{to:"kms",dir:"both",how:"KMS key policy 是獨立的授權層，即使 IAM 允許也可能被 key policy 擋。"},{to:"cloudtrail",dir:"out",how:"所有 IAM 與 API 呼叫都會被記錄，是稽核與事故調查的基礎。"},{to:"iam-identity-center",dir:"both",how:"大量人力帳號建議改用 Identity Center 集中管理與 SSO。"}],settings:[{name:"Root account",required:!0,warn:!0,desc:"**不要**用 root 做日常操作；開啟 MFA、不建立 Access Key。"},{name:"Password policy",desc:"長度、複雜度、輪換週期、禁止重複使用。"},{name:"MFA enforcement",warn:!0,desc:"至少對高權限使用者強制；可用政策條件 `aws:MultiFactorAuthPresent`。"},{name:"Access key 輪換",warn:!0,desc:"長期金鑰是最大風險來源；能用 Role 就用 Role，必須用金鑰就定期輪換。"},{name:"Permission boundary",desc:"給「可以建立角色的人」設上限，防止權限提昇（privilege escalation）。"},{name:"Condition 條件",desc:"例如限制來源 IP、要求 TLS、要求特定 tag、限制只能用 MFA。"},{name:"IAM Access Analyzer",desc:"定期檢查對外開放的資源與未使用的權限。"},{name:"Last accessed 資訊",desc:"用 Access Advisor 找出沒在用權限並移除。"}],pricing:{model:"**IAM 完全免費**。你付出的是設定錯誤的代價。",free:"免費（IAM、STS、政策管理都不收費）。",rows:[{tier:"IAM User / Group / Role / Policy",price:"免費",note:"沒有限制數量。",level:0},{tier:"STS 臨時憑證",price:"免費",note:"但 API 呼叫次數有預設限流。",level:0},{tier:"IAM Access Analyzer",price:"免費（含在 IAM 內）",note:"建議開啟。",level:0},{tier:"設定錯誤的代價",price:"難以估計",note:"外洩的 Access Key 可能在幾小時內產生數萬美元帳單。",level:5}],traps:["把 Access Key 推到 GitHub → 通常幾分鐘內就會被掃到濫用（設定 Billing alarm + GuardDuty 才來得及止血）。","給 `*:*`（AdministratorAccess）給所有服務角色，等於放棄最小權限。","忘了刪除離職員工的 Access Key 與 API key。"]},cli:["aws iam create-user --user-name alice","aws iam create-group --group-name developers","aws iam add-user-to-group --user-name alice --group-name developers","aws iam attach-group-policy --group-name developers --policy-arn arn:aws:iam::aws:policy/PowerUserAccess","","# 建立可被 EC2 假設的角色並附上政策","aws iam create-role --role-name ec2-s3-read --assume-role-policy-document file://trust.json","aws iam attach-role-policy --role-name ec2-s3-read --policy-arn arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess"],exam:["「**EC2 / Lambda 要存取其他 AWS 服務**」→ **Role**，不是 Access Key。","「**跨帳號存取**」→ Role + AssumeRole（或 resource policy）。","「**S3 跨帳號 / 公開網站**」→ Bucket Policy。","「**限制整個組織的最大權限**」→ SCP（Organizations）。","「**給員工臨時權限、時間到自動失效**」→ STS AssumeRole + 期限。","「**單一 Deny 覆蓋所有 Allow**」是必考的核心規則。","「**MFA 才能執行敏感操作**」→ Condition 條件式。"],gotchas:["Identity policy 與 resource policy 是**聯集**（同帳號時其中一個允許即可，但顯式 Deny 優先）。","跨帳號時需要「雙方都允許」：來源的 IAM policy + 目標的 resource policy（或 AssumeRole）。","IAM 是**全球性**服務（無 Region），與 Region 相關的服務不同。","Policy 大小有限制（2048 字元 / 6144 字元），複雜授權要靠多個政策與群組。","Role 的臨時憑證會過期，長時間執行的程式要處理更新。"],related:["iam-identity-center","organizations","kms","cloudtrail","cognito"]},{id:"iam-identity-center",name:"AWS IAM Identity Center",zh:"單一登入（SSO）與多帳號存取",category:"security",emoji:"\uD83D\uDC65",tagline:"一個入口登入所有 AWS 帳號：員工用原本的帳號（或 AD）就能 SSO 切換。",aliases:["sso","single sign on","ssoe","saml","身分中心"],intro:["**IAM Identity Center**（原名 AWS SSO）是給「**人**」用的集中身分管理：員工從一個入口登入，就能依 Permission Set 存取多個 AWS 帳號與應用程式。","它解決的是傳統做法（每個帳號各建 IAM User）帶來的災難：離職要刪好幾個帳號、密碼政策不一致、沒有集中稽核。","身分來源可以是 Identity Center 內建目錄、**AWS Managed Microsoft AD**、地端 AD（透過 AD Connector）或外部 IdP（SAML / SCIM）。"],concepts:[{term:"Permission Set",desc:"一組權限（底層其實是自動建立的 IAM Role），指派到某個帳號 + 某個群組。"},{term:"Assignment",desc:"「誰（使用者 / 群組）」在「哪個帳號」有「哪個 Permission Set」。"},{term:"Identity Source",desc:"身分來源：內建目錄 / AD / 外部 IdP。"},{term:"SCIM 自動佈建",desc:"外部 IdP 的使用者變更自動同步，省掉手動維護。"},{term:"Trusted Identity Propagation",desc:"把使用者身分一路帶到後端服務（例如 Redshift / S3 Access Grants），讓稽核能追到「人」。"}],interactions:[{to:"organizations",dir:"in",how:"建在 Organizations 的管理帳號，統一管理所有成員帳號的存取。"},{to:"iam",dir:"out",how:"Permission Set 實際會在各帳號建立 IAM Role，使用時假設（Assume）該角色。"},{to:"directory-service",dir:"in",how:"接上 AWS Managed Microsoft AD 或 AD Connector 使用既有帳號。"},{to:"cloudtrail",dir:"out",how:"登入與存取事件記錄於 CloudTrail，可稽核「誰在什麼時候切到哪個帳號」。"},{to:"cognito",dir:"both",how:"應用程式的使用者登入用 Cognito；員工後台登入用 Identity Center（兩者定位不同）。"}],settings:[{name:"Identity source",required:!0,warn:!0,desc:"決定使用內建目錄或接 AD / 外部 IdP；**建置後只能改一次**（要換通常得重建）。"},{name:"MFA 設定",required:!0,desc:"可用內建 TOTP、或要求使用外部 IdP 的 MFA。"},{name:"Permission Set 設計",warn:!0,desc:"少數通用角色（Admin / ReadOnly / DevOps）優於為每個人建專屬角色。"},{name:"Session duration",desc:"預設 1 小時（可到 12 小時），影響使用者需要重新登入的頻率。"},{name:"Group 對應",desc:"權限指派給群組而非個人，才能規模化管理。"},{name:"SCIM provisioning",desc:"外部 IdP 的自動化佈建與停用（離職即時失效）。"}],pricing:{model:"**免費**（Identity Center 本身不收費，使用者在帳號內的 API 操作照原價計費）。",free:"完全免費。",rows:[{tier:"Identity Center",price:"免費",note:"無使用者數限制。",level:0},{tier:"AWS Managed Microsoft AD",price:"依 AD 規格計費",note:"如果需要真正的 AD 功能（$0.14/hr 起）。",level:3},{tier:"AD Connector",price:"$0.05 / 小時起",note:"代理到地端 AD。",level:2}],traps:["Identity source 想從「內建目錄」改成 AD 需要重建，事前規劃重要。","把 Permission Set 給成 AdministratorAccess 給所有人，就失去了最小權限的意義。","忘了啟用 MFA，SSO 反而變成單點風險。"]},exam:["「**多帳號、集中管理人員登入**」→ IAM Identity Center。","「**員工用公司 AD 帳號登入 AWS**」→ Identity Center + AD Connector / Managed AD。","「**應用程式的使用者（非員工）**」→ Cognito。","「**稽核每個人的操作**」→ Identity Center + CloudTrail。"],gotchas:["Identity Center 與 IAM User 是兩套並行的系統，容易混用造成管理混亂。","不支援在成員帳號內直接管理 Identity Center（必須從管理帳號）。"],related:["organizations","iam","directory-service","cognito"]},{id:"organizations",name:"AWS Organizations",zh:"組織與多帳號管理",category:"security",emoji:"\uD83C\uDFE2",tagline:"把多個 AWS 帳號當成一個組織管理：集中政策、集中帳單、一次開新帳號。",aliases:["scp","consolidated billing","ou","多帳號","control tower"],intro:["**Organizations** 讓你把多個 AWS 帳號組成組織，集中管理權限與帳單。這是 AWS 推薦的最佳實務：**用多帳號隔離環境**（prod / dev / sandbox），而不是在一個帳號裡用 tag 分隔。","三個核心功能：**Consolidated Billing**（合併帳單、共享用量折扣）、**SCP（Service Control Policy）** 限制每個帳號的最大權限、以及 **OU（Organizational Unit）** 做階層式分類。","搭配 **Control Tower** 可以自動化建立 landing zone：帳號自動套用基線政策、集中 log 到專用帳號、一鍵開新帳號。"],concepts:[{term:"Management Account",desc:"組織的管理帳號（不能退出）；**不要把業務資源放在這裡**。"},{term:"OU",desc:"階層式分類（例如 Production / Development / Sandbox），政策可繼承。"},{term:"SCP",desc:"限制「成員帳號內所有身分」的最大權限（連 root 也受限制），**不是授予權限**。"},{term:"Consolidated Billing",desc:"合併用量：S3 儲存與資料傳輸可跨帳號共享折扣，Savings Plans 也能跨帳號共用。"},{term:"Control Tower",desc:"自動建立 landing zone、帳號 vending machine、護欄（guardrails）。"},{term:"Resource Access Manager (RAM)",desc:"跨帳號共享資源（VPC 子網、Transit Gateway、Route 53 Resolver）。"}],interactions:[{to:"iam",dir:"out",how:"SCP 是 IAM 的上限：SCP 允許 + IAM 允許才能成功。"},{to:"iam-identity-center",dir:"out",how:"以 Identity Center 集中指派各帳號的存取權。"},{to:"cloudtrail",dir:"out",how:"組織層級的 CloudTrail 把所有帳號的日誌集中到專用帳號。"},{to:"aws-config",dir:"out",how:"集中記錄所有帳號的設定合規狀態。"},{to:"aws-backup",dir:"out",how:"用 Backup Policy 對組織內所有帳號強制備份設定。"},{to:"cost-explorer",dir:"out",how:"合併帳單下可依帳號、OU、tag 分析成本。"},{to:"transit-gateway",dir:"both",how:"用 RAM 跨帳號共享 TGW / VPC 子網，建立共享網路架構。"},{to:"guardduty",dir:"out",how:"GuardDuty / Security Hub 可設為組織層級，統一收集所有帳號的偵測結果。"}],settings:[{name:"All features vs Consolidated billing only",required:!0,warn:!0,desc:"要 SCP 就必須開啟 All features（之後無法退回）。"},{name:"SCP 設計",warn:!0,desc:"從「拒絕危險行為」開始（例如禁止關閉 CloudTrail、禁止使用 root、禁止特定 Region）。"},{name:"OU 結構",desc:"依環境或業務單位切分；政策繼承由上而下。"},{name:"帳號建立方式",desc:"用 Control Tower / Account Factory 標準化，避免手動設定不一致。"},{name:"Central logging account",desc:"CloudTrail / Config / GuardDuty 的集中目的地（通常放在 Log Archive 帳號）。"},{name:"Tag policies",desc:"強制資源 tag 命名規則，成本分析與自動化才可靠。"}],pricing:{model:"**免費**（Organizations 本身不收費）；Control Tower 也免費，你付的是它建立的服務（CloudTrail、Config、S3 等）。",free:"免費。",rows:[{tier:"Organizations / SCP / OU",price:"免費",note:"支援的帳號數沒有額外費用。",level:0},{tier:"Consolidated Billing",price:"免費（還可能更省）",note:"共享折扣是實質節省。",level:0},{tier:"Control Tower",price:"免費（建立資源要錢）",note:"CloudTrail 組織追蹤 + Config 記錄 = 每月數十美元起。",level:1}],traps:["CloudTrail / Config 集中記錄會產生 S3 儲存與 API 費用（但通常值得）。","把管理帳號當一般帳號用，一旦被入侵就是整個組織淪陷。","SCP 誤設會鎖死自己的操作（連 root 都無法改），要用 `aws:PrincipalArn` 條件保護管理員。"]},exam:["「**限制整個組織不能使用某服務 / 某 Region**」→ SCP。","「**合併帳單、共享用量折扣**」→ Consolidated Billing。","「**快速建立符合規範的新帳號**」→ Control Tower / Account Factory。","「**跨帳號共享 VPC 子網**」→ Resource Access Manager。","SCP **不授予**權限，只是上限——這是必考重點。"],gotchas:["SCP 對管理帳號無效。","開啟 All features 後無法降級。","帳號無法自行離開組織，需要管理帳號移除。","SCP 用 `Deny` + 條件比用 Allow 更安全（Allow list 模式很容易鎖死自己）。"],related:["iam","iam-identity-center","aws-config","cloudtrail","cost-explorer"]},{id:"kms",name:"AWS KMS",zh:"金鑰管理服務",category:"security",emoji:"\uD83D\uDDDD️",tagline:"加密金鑰的保險箱：產生、保管、輪換、稽核，全部交給它。",aliases:["encryption","key","envelope encryption","加密","金鑰"],intro:["**KMS（Key Management Service）** 管理對稱與非對稱金鑰，讓你能加密幾乎所有 AWS 服務的資料（S3、EBS、RDS、DynamoDB、Secrets Manager…）並在 CloudTrail 留下「誰用了哪把 key」的稽核記錄。","核心技術是 **Envelope Encryption（信封加密）**：KMS 的金鑰加密一把資料金鑰（Data Key），資料金鑰再加密你的資料。KMS 本身**不儲存你的資料**，只保管金鑰。","金鑰分三類：**AWS managed**（由 AWS 管理、免費、自動輪換）、**Customer managed**（你管理、可自訂政策與輪換、$1/月）、**Custom Key Store**（金鑰存在 CloudHSM，符合 FIPS 140-2 Level 3）。"],concepts:[{term:"CMK / KMS Key",desc:"金鑰的容器，內含材質與政策。對稱金鑰支援自動輪換（預設每年）。"},{term:"Data Key",desc:"由 KMS 產生的對稱金鑰，用來加密實際資料；kms:GenerateDataKey 每次都產生新的。"},{term:"Envelope Encryption",desc:"資料金鑰加密資料（快、在本機進行），KMS 金鑰加密資料金鑰（安全、集中管理）。"},{term:"Key Policy",desc:"KMS 自己的授權機制，與 IAM 並存；key policy 必須允許，IAM 授權才有意義。"},{term:"Multi-Region Key",desc:"同一把金鑰複製到多個 Region，讓跨區複寫的資料能被解密。"},{term:"Grants",desc:"臨時授權（不改變 key policy），AWS 服務常用它取得存取權。"}],interactions:[{to:"s3",dir:"in",how:"SSE-KMS 用 KMS 金鑰加密物件；每次讀取都會呼叫 KMS（會影響效能與成本）。"},{to:"ebs",dir:"in",how:"磁碟與快照加密。"},{to:"rds",dir:"in",how:"資料庫儲存與快照加密（建立時決定）。"},{to:"secrets-manager",dir:"both",how:"Secrets Manager 用 KMS 加密存放的秘密。"},{to:"ssm-parameter-store",dir:"in",how:"SecureString 參數用 KMS 加密。"},{to:"lambda",dir:"in",how:"函式讀取加密資料需要 `kms:Decrypt` 權限（常見的權限漏設）。"},{to:"cloudtrail",dir:"out",how:"每次金鑰使用都會記錄（誰、何時、用哪把 key）。"},{to:"cloudhsm",dir:"out",how:"需要 FIPS 140-2 Level 3 或專屬硬體時使用 Custom Key Store。"}],settings:[{name:"Key type（對稱 / 非對稱）",required:!0,warn:!0,desc:"對稱金鑰不能離開 KMS（效能好）；非對稱金鑰可以下載公鑰做外部驗章。"},{name:"Key policy",required:!0,warn:!0,desc:"最常見的錯誤：忘了允許「使用服務的角色」或把權限只給單一帳號導致跨帳號失敗。"},{name:"Automatic rotation",desc:"對稱的客戶管理金鑰可設定每年輪換（舊資料仍可解密）。"},{name:"Multi-Region key",desc:"跨 Region 複寫（例如 S3 CRR、Aurora Global）時必備。"},{name:"Deletion / 刪除保護",warn:!0,desc:"排程刪除有 7–30 天等待期；刪除後使用該金鑰加密的資料**永久無法解密**。"},{name:"Encryption context",desc:"額外的驗證條件（稽核用），加解密時必須一致。"},{name:"Key store",desc:"Default（KMS）/ CloudHSM（合規）。"}],pricing:{model:"**每把客戶管理金鑰 $1/月** + **每 10,000 次 API 呼叫 $0.03**。AWS 管理金鑰免費。",free:"AWS managed key 免費；每月 20,000 次免費請求額度。",rows:[{tier:"Customer managed key",price:"$1 / 月 / 金鑰",note:"每個 Region 各算一把。",level:1},{tier:"API 請求",price:"$0.03 / 10,000 次",note:"大量小物件加密（例如 S3 每物件一次）時會累積。",level:1},{tier:"AWS managed key",price:"免費",note:"無法自訂政策，稽核粒度較粗。",level:0},{tier:"非對稱 KMS key",price:"$1 / 月 + 請求費",note:"RSA / ECC，用於簽章與驗證。",level:1},{tier:"Custom Key Store（CloudHSM）",price:"CloudHSM 費用（$1.45/hr 起）",note:"合規導向，成本高。",level:5}],traps:["S3 + SSE-KMS 在大流量下 **KMS API 費用與限流**都可能出問題，可用 S3 Bucket Key 把請求數降低 99%。","把金鑰刪掉＝資料永久救不回（沒有備份金鑰這回事）。","跨帳號資料分享要同時處理 KMS key policy——這是最常見的「S3 可以讀但無法解密」。","每個 Region 的金鑰各自計費，多 Region 部署成本相乘。"]},cli:['aws kms create-key --description "app data key"',"aws kms create-alias --alias-name alias/app-data --target-key-id $KEY_ID","aws kms enable-key-rotation --key-id $KEY_ID","aws kms encrypt --key-id alias/app-data --plaintext fileb://secret.txt --output text --query CiphertextBlob | base64 -d > secret.enc","aws kms decrypt --ciphertext-blob fileb://secret.enc --output text --query Plaintext | base64 -d"],exam:["「**加密靜態資料、要稽核金鑰使用**」→ KMS。","「**合規要求 FIPS 140-2 Level 3 / 專屬硬體**」→ CloudHSM（或 KMS Custom Key Store）。","「**跨 Region 複寫的加密資料**」→ Multi-Region Key。","「**KMS 不儲存資料**」是必考觀念（它只保管金鑰）。","「**S3 加密方式選擇**」：SSE-S3（免費、AWS 管理）< SSE-KMS（可稽核、可跨帳號控制）< SSE-C（自己帶金鑰，AWS 不存）。","刪除 KMS key 有等待期，且**無法復原**。"],gotchas:["Key policy 與 IAM policy 都必須允許（跨帳號時尤其重要）。","金鑰不能匯出（對稱金鑰），要匯出只能用 CloudHSM 或非對稱公鑰。","大量小檔案 + SSE-KMS = 大量 KMS 請求費（用 Bucket Key 緩解）。","服務連結角色（service-linked role）需要被允許才能使用金鑰。"],related:["secrets-manager","cloudhsm","s3","ssm-parameter-store","acm"]},{id:"secrets-manager",name:"AWS Secrets Manager",zh:"機密管理",category:"security",emoji:"\uD83E\uDD2B",tagline:"密碼、API key、資料庫憑證集中保管，還能自動輪換。",aliases:["password","credential","rotate","密碼","輪換"],intro:["**Secrets Manager** 專門存放「機密」：資料庫帳密、第三方 API key、OAuth token。支援**自動輪換**（RDS / Redshift / DocumentDB 內建，其他可用 Lambda 自訂）、**跨帳號分享**與**版本控管**。","與 [[ssm-parameter-store|SSM Parameter Store]] 的差別是必考題：Secrets Manager 有 **自動輪換**、可跨帳號、要付費（$0.40/secret/月）；Parameter Store 便宜（甚至免費）但沒有內建輪換。","重點觀念：不要把機密寫在程式碼、環境變數或 AMI 裡；用 IAM 權限 + Secrets Manager API 動態取得。"],concepts:[{term:"Secret / Version",desc:"一個 secret 可有多個版本（AWSCURRENT / AWSPREVIOUS），輪換時自動切換。"},{term:"Rotation",desc:"用 Lambda 執行輪換，內建支援 RDS / Aurora / Redshift / DocumentDB / Redshift。"},{term:"Resource policy",desc:"跨帳號授權（例如讓另一個帳號的應用讀取）。"},{term:"Replication",desc:"把 secret 複製到其他 Region，多區應用讀本地副本。"},{term:"Encryption",desc:"用 KMS 加密（可選客戶管理金鑰）。"}],interactions:[{to:"rds",dir:"in",how:"RDS 可設定「由 Secrets Manager 管理 master 密碼」並自動輪換。"},{to:"lambda",dir:"both",how:"輪換邏輯由 Lambda 執行；應用層的 Lambda 讀取 secret 取得連線資訊。"},{to:"kms",dir:"in",how:"secret 內容以 KMS 加密。"},{to:"iam",dir:"in",how:"用 IAM policy 限制哪些角色能讀哪些 secret（`secretsmanager:GetSecretValue`）。"},{to:"ecs",dir:"in",how:"Task Definition 的 `secrets` 直接注入容器環境變數，不必落檔。"},{to:"eks",dir:"in",how:"用 Secrets Store CSI Driver 掛載給 Pod。"},{to:"cloudtrail",dir:"out",how:"記錄誰讀取了哪個 secret（可搭配告警）。"}],settings:[{name:"Secret type",required:!0,desc:"RDS 憑證 / 其他資料庫 / 其他（key-value JSON 或純文字）。"},{name:"Automatic rotation",required:!0,warn:!0,desc:"**這是 Secrets Manager 的主要價值**：設定輪換週期（例如 30 天）與輪換 Lambda。"},{name:"KMS key",desc:"預設用 `aws/secretsmanager`；需要更細的權限控制就用自訂金鑰。"},{name:"Resource policy",desc:"跨帳號或跨服務授權，注意要同時允許 KMS 金鑰。"},{name:"Replication",desc:"多 Region 應用要開啟，否則跨區讀取會有延遲與流量費。"},{name:"Recovery window",warn:!0,desc:"刪除有 7–30 天等待期，期間可復原。"},{name:"Rotation Lambda 的權限",warn:!0,desc:"輪換角色需要有改密碼（例如 `rds:ModifyDBInstance`）與寫 secret 的權限。"}],pricing:{model:"**每個 secret $0.40/月** + **每 10,000 次 API 呼叫 $0.05**；輪換用到的 Lambda 另計。",free:"免費試用 30 天。",rows:[{tier:"Secret 儲存",price:"$0.40 / secret / 月",note:"100 個 secret 就是 $40/月，管理上要收斂。",level:1},{tier:"API 呼叫",price:"$0.05 / 10,000 次",note:"應用應快取 secret，不要每次請求都呼叫。",level:1},{tier:"輪換 Lambda",price:"Lambda 費用",note:"每 30 天執行一次，幾乎可忽略。",level:0},{tier:"Parameter Store（對照組）",price:"Standard 免費 / Advanced $0.05",note:"沒有輪換需求就用它更省。",level:0}],traps:["應用**每次都呼叫 API** 取得 secret 會產生大量 API 費用並撞到限流；應快取並處理輪換。","測試環境大量 secret 累積，$0.40 × 數量仍然可觀。","輪換設定錯誤會導致應用還在用舊密碼而連不上（輪換期間要有雙版本支援）。"]},cli:["aws secretsmanager create-secret --name prod/db/password \\",`  --secret-string '{"username":"admin","password":"S3cr3t!"}'`,"aws secretsmanager get-secret-value --secret-id prod/db/password --query SecretString --output text","aws secretsmanager rotate-secret --secret-id prod/db/password --rotation-lambda-arn $FN"],exam:["「**資料庫密碼自動輪換**」→ Secrets Manager。","「**設定值（非機密）管理**」→ Parameter Store。","「**應用不該硬編碼機密**」→ Secrets Manager + IAM。","「**跨帳號分享機密**」→ resource policy（+ KMS 權限）。","「**多 Region 讀取**」→ secret replication。"],gotchas:["Secrets Manager **不能**取代 Parameter Store 的所有用途（例如階層式設定管理）。","輪換 Lambda 需要在 VPC 內才能連到私有 RDS。","IAM 權限給太寬（例如 `secretsmanager:*`）就失去意義。","KMS 權限沒有一併給會出現「找不到 secret」的誤導性錯誤。"],related:["ssm-parameter-store","kms","rds","lambda","iam"]},{id:"ssm-parameter-store",name:"SSM Parameter Store",zh:"設定與參數管理",category:"security",emoji:"\uD83D\uDCCB",tagline:"把設定值集中管理：階層式命名、版本紀錄，免費的參數倉庫。",aliases:["parameter","config","appconfig","設定管理"],intro:["**Parameter Store** 是 AWS Systems Manager 的一個功能（不是獨立收費服務），用來存放設定值與（加密的）機密。支援階層式命名（`/prod/app/db/host`）、版本紀錄與 IAM 權限控制。","兩種層級：**Standard**（免費，4 KB、總數 10,000 個）與 **Advanced**（付費，8 KB、支援參數政策如到期日與通知）。","**String**、**StringList**、**SecureString**（用 KMS 加密）。沒有內建自動輪換——需要輪換就用 Secrets Manager。"],concepts:[{term:"Hierarchy",desc:"用 `/` 分層，可用 `GetParametersByPath` 一次取整棵子樹。"},{term:"SecureString",desc:"KMS 加密的參數（加密後才落盤）。"},{term:"Parameter Policies（Advanced）",desc:"到期提醒、到期刪除、通知。"},{term:"Public Parameters",desc:"AWS 維護的公開參數（如最新 AMI ID：`/aws/service/ami-amazon-linux-latest/...`）。"},{term:"AppConfig",desc:"應用設定的版本與漸進式部署（feature flag、設定熱更新）。"}],interactions:[{to:"ec2",dir:"out",how:"開機時用腳本或 SSM Agent 讀取參數做組態設定。"},{to:"systems-manager",dir:"in",how:"Parameter Store 是 Systems Manager 的子功能，與 Run Command / Automation 搭配。"},{to:"kms",dir:"in",how:"SecureString 使用 KMS 金鑰加密。"},{to:"lambda",dir:"in",how:"函式啟動時讀取設定參數（並快取）。"},{to:"ecs",dir:"in",how:"Task Definition 可直接注入 Parameter Store 的值為環境變數。"},{to:"cloudformation",dir:"in",how:"用 `resolve:ssm:` 動態在部署時取用參數。"},{to:"iam",dir:"in",how:"以路徑前綴控制權限（例如只允許讀 `/dev/*`）。"}],settings:[{name:"Tier（Standard / Advanced）",required:!0,desc:"免費的 Standard 只支援 4 KB、無參數政策，且**無法降級**。"},{name:"Type（String / StringList / SecureString）",required:!0,warn:!0,desc:"機密一定要用 SecureString（並指定 KMS 金鑰）。"},{name:"KMS key",desc:"預設用 `alias/aws/ssm`。"},{name:"Naming / hierarchy",warn:!0,desc:"好的命名（環境/應用/元件）讓權限與維護都簡單。"},{name:"Parameter policies",desc:"Advanced 才有：到期通知、到期刪除。"},{name:"AppConfig 設定檔",desc:"需要「設定熱更新、分批部署」時使用。"}],pricing:{model:"**Standard 免費**；Advanced $0.05/參數/月；API 呼叫在標準額度內免費（超量依 API 計費）。",free:"Standard 參數免費（10,000 個上限）。",rows:[{tier:"Standard 參數",price:"免費",note:"含 4 KB 與基本版本紀錄。",level:0},{tier:"Advanced 參數",price:"$0.05 / 參數 / 月",note:"8 KB、支援政策。",level:0},{tier:"API 互動（高流量）",price:"$0.05 / 10,000 次",note:"超出免費額度（10,000 次/月）才計費。",level:0},{tier:"Secrets Manager（對照）",price:"$0.40 / secret / 月",note:"需要輪換才值得。",level:1}],traps:["把需要輪換的密碼放在 Parameter Store → 沒有自動輪換，得自己寫 Lambda。","應用每次請求都呼叫 `GetParameter` → API 費用與限流問題（應該快取）。","Advanced 升級後**無法降回 Standard**。"]},cli:["aws ssm put-parameter --name /prod/app/db-host --value db.internal --type String",'aws ssm put-parameter --name /prod/app/db-password --value "$PW" --type SecureString',"aws ssm get-parameters-by-path --path /prod/app --with-decryption","aws ssm get-parameter --name /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64"],exam:["「**免費的設定管理、階層式參數**」→ Parameter Store。","「**需要自動輪換**」→ Secrets Manager。","「**SecureString 的加密**」→ KMS。","「**動態取得最新 AMI ID**」→ 公開參數 `/aws/service/...`。","「**要在多台機器一致地套用設定**」→ Parameter Store + Systems Manager。"],gotchas:["Standard 的 4 KB 限制：憑證檔案可能放不下。","沒有內建輪換。","跨帳號分享不如 Secrets Manager 方便。","刪除參數沒有等待期（誤刪就沒了，但版本紀錄仍可查）。"],related:["secrets-manager","systems-manager","kms","ec2"]},{id:"cognito",name:"Amazon Cognito",zh:"應用程式的使用者身分",category:"security",emoji:"\uD83D\uDE4B",tagline:"給 App 用的登入與權限：註冊、登入、社群登入、臨時 AWS 憑證。",aliases:["user pool","identity pool","oauth","jwt","登入","社群登入"],intro:["**Cognito** 是給「應用程式使用者」（不是員工）的身分服務，兩個元件：**User Pools**（使用者目錄 + 登入，回傳 JWT）與 **Identity Pools**（把登入身分換成**臨時 AWS 憑證**）。","User Pool 支援帳密登入、**社群登入**（Google / Facebook / Apple / Amazon）、SAML / OIDC 企業 IdP、MFA、密碼政策、自訂登入流程（Lambda triggers）。","常見架構：前端用 User Pool 登入 → 拿到 ID token 呼叫 [[api-gateway|API Gateway]]（Cognito authorizer）→ 需要直接存取 S3 / DynamoDB 時再用 Identity Pool 換臨時憑證。"],concepts:[{term:"User Pool",desc:"使用者目錄與登入服務，發出 ID / Access / Refresh token。"},{term:"Identity Pool",desc:"把 User Pool（或社群 / 匿名）身分換成 STS 臨時憑證，並可依身分給不同 IAM 角色。"},{term:"App Client",desc:"一個前端應用對應一個 client（含 client id / secret 與 callback URL）。"},{term:"Triggers",desc:"Lambda 掛在註冊前 / 驗證後 / 發 token 前等時機，可自訂驗證與客製化 token。"},{term:"Hosted UI",desc:"Cognito 提供的登入頁面（可自訂網域與外觀），支援 OAuth 2.0 流程。"},{term:"Advanced Security",desc:"風險評估登入（不可能旅行偵測）、自適應驗證，額外計費。"}],interactions:[{to:"api-gateway",dir:"out",how:"API Gateway 的 Cognito authorizer 直接驗證 User Pool 發出的 JWT。"},{to:"elb",dir:"out",how:"ALB 支援 Cognito 作為 OIDC 驗證器，登入後才轉發到後端。"},{to:"lambda",dir:"both",how:"Lambda triggers 客製化登入流程；後端 Lambda 驗證 token 後處理業務邏輯。"},{to:"iam",dir:"both",how:"Identity Pool 對應的 IAM 角色決定已登入使用者能存取哪些 AWS 資源。"},{to:"s3",dir:"out",how:"使用者直接用臨時憑證上傳到自己的 S3 前綴（`cognito-identity.amazonaws.com:sub` 條件）。"},{to:"dynamodb",dir:"out",how:"細緻到項目層級的權限（`dynamodb:LeadingKeys` = 使用者 ID）。"},{to:"waf",dir:"in",how:"Hosted UI 或 API 前掛 WAF 阻擋暴力破解與機器人。"},{to:"iam-identity-center",dir:"both",how:"員工後台用 Identity Center，終端使用者用 Cognito（分工明確）。"}],settings:[{name:"User Pool 密碼政策",required:!0,desc:"長度、大小寫、符號要求；也可匯入既有使用者。"},{name:"MFA（TOTP / SMS）",warn:!0,desc:"SMS 額外計費且安全性較低，TOTP 免費建議優先。"},{name:"Sign-up 驗證方式",desc:"Email / 手機驗證，或由管理員建立使用者。"},{name:"App Client 設定",warn:!0,desc:"不要為公開的 SPA / 手機 App 產生 client secret（無法保密）；callback URL 必須精確設定。"},{name:"Token 有效期",desc:"ID / Access token 預設 1 小時、Refresh token 可到 365 天，影響安全與體驗。"},{name:"Identity Pool 的 IAM Role",warn:!0,desc:"「已驗證」與「未驗證（訪客）」兩種角色要分別設定。"},{name:"Advanced Security",desc:"開啟後可阻擋洩漏憑證與異常登入。"},{name:"Lambda Triggers",desc:"Pre sign-up（擋掉不合規 email）、Post confirmation（寫入使用者資料表）。"}],pricing:{model:"**每月活躍使用者（MAU）** 計費，前 50,000 MAU 免費；Identity Pool 的 AWS 憑證免費但後續資源照價。",free:"User Pools：每月 50,000 MAU 免費（超出後階梯計價）。",rows:[{tier:"User Pools（前 50k MAU）",price:"免費",note:"大部分小型應用完全免費。",level:0},{tier:"50k–100k MAU",price:"$0.0055 / MAU",note:"10 萬使用者約 $275/月。",level:1},{tier:"Advanced Security",price:"$0.05 / MAU（進階）",note:"僅在需要風險評估時開啟。",level:3},{tier:"SMS MFA",price:"依 SNS 簡訊費",note:"國際簡訊很貴，TOTP 免費。",level:2},{tier:"Identity Pools",price:"免費（後續 AWS 資源計費）",note:"取用 S3 / DynamoDB 依原價。",level:0}],traps:["開啟 Advanced Security 會讓 MAU 單價暴增（$0.05 vs $0.0055）。","SMS 驗證在國際簡訊費率下可能意外昂貴。","Identity Pool 的權限設太寬，使用者可存取別人的資料（要用 `sub` 條件限制）。"]},cli:["aws cognito-idp create-user-pool --pool-name app-users \\","  --auto-verified-attributes email --mfa-configuration OFF","aws cognito-idp create-user-pool-client --user-pool-id $POOL \\","  --client-name web --no-generate-secret","aws cognito-idp admin-create-user --user-pool-id $POOL --username alice@example.com"],exam:["「**App 使用者註冊登入（含社群登入）**」→ Cognito User Pools。","「**給已登入使用者臨時 AWS 憑證**」→ Cognito Identity Pools。","「**API Gateway 驗證 JWT**」→ Cognito authorizer。","「**使用者只能存取自己的 S3 目錄**」→ Identity Pool + IAM policy 條件 `sub`。","「**員工**（不是客戶）」→ IAM Identity Center，不是 Cognito。","「**不用寫登入頁面**」→ Hosted UI。"],gotchas:["同一個 email 在不同 User Pool 是不同使用者；跨 Region 無法共用。","遷移既有使用者需要 Lambda trigger 或匯入流程。","Token 驗證要在後端做（前端驗證不能信任）。","一個帳號只能有一個 Cognito 使用者集區的 Hosted UI 網域（prefix 需唯一）。"],related:["api-gateway","iam","lambda","waf"]},{id:"waf",name:"AWS WAF",zh:"網頁應用防火牆",category:"security",emoji:"\uD83E\uDDF1",tagline:"在 HTTP 層過濾惡意流量：SQL injection、XSS、爬蟲、可疑 IP。",aliases:["web application firewall","sql injection","rate limit","bot"],intro:["**WAF** 是第 7 層防火牆，掛在 **CloudFront、ALB、API Gateway、AppSync** 前面，依規則允許 / 封鎖 / 計數請求。","規則來源有三：**AWS Managed Rules**（官方維護的常見攻擊特徵）、**自訂規則**（IP、Geo、字串比對、Rate-based）、以及 **Marketplace 廠商規則**（如 F5、Fortinet）。","**Rate-based rule** 是最實用的一條：例如「同一個 IP 5 分鐘超過 2000 次請求就封鎖」，能直接擋掉暴力破解與爬蟲。"],concepts:[{term:"Web ACL",desc:"規則的容器，有容量上限（WCU）；關聯到 CloudFront / ALB / API Gateway。"},{term:"Rule / Statement",desc:"一組比對條件；支援 AND / OR / NOT 組合。"},{term:"IP Set / Regex Pattern Set",desc:"可維護的清單，被規則引用。"},{term:"Rate-based Rule",desc:"依來源 IP 計數並自動封鎖（時間窗可選）。"},{term:"Count vs Block vs Allow",desc:"先用 Count 觀察（不阻擋），確認無誤再切 Block。"},{term:"Bot Control / Account Takeover Prevention",desc:"付費的進階受管規則群組。"}],interactions:[{to:"cloudfront",dir:"in",how:"在 CDN Edge 阻擋攻擊，流量在離使用者最近的地方就被丟掉（最省後端成本）。"},{to:"elb",dir:"in",how:"ALB 掛 WAF 過濾 HTTP 攻擊（第 7 層；NLB 不支援）。"},{to:"api-gateway",dir:"in",how:"保護 API 免受惡意請求與濫用。"},{to:"shield",dir:"both",how:"WAF 擋應用層攻擊，Shield 檔網路層 DDoS，兩者相輔相成。"},{to:"cloudwatch",dir:"out",how:"AllowedRequests / BlockedRequests 指標，可視化攻擊趨勢。"},{to:"firewall-manager",dir:"in",how:"組織層級統一管理各帳號的 WAF 規則。"},{to:"guardduty",dir:"both",how:"GuardDuty 發現異常流量可回饋到 WAF 封鎖。"}],settings:[{name:"Web ACL 關聯目標",required:!0,desc:"可關聯多個 CloudFront / ALB，但 CloudFront 用的 ACL 必須建在 us-east-1。"},{name:"Default action",required:!0,warn:!0,desc:"Allow 或 Block。若使用封鎖清單模式，default 是 Allow；允許清單模式 default 是 Block。"},{name:"Managed rule groups",desc:"建議至少開啟 Core（常見攻擊）與 Known Bad Inputs。"},{name:"Rate-based rule 閾值",warn:!0,desc:"依服務請求量設定（例如 API 每 5 分鐘 2000 次）；設太低會誤擋正常使用者（NAT 出口共用 IP 的企業）。"},{name:"Logging",warn:!0,desc:"**預設不開**！沒有 log 就無法調查誤擋或攻擊；可送到 CloudWatch Logs / S3 / Firehose。"},{name:"IP / Geo 規則",desc:"封鎖特定國家或 IP 範圍（合規或已知攻擊來源）。"},{name:"Rule action 觀察期",desc:"新規則先用 Count 模式跑幾天再切 Block。"}],pricing:{model:"**Web ACL $5/月** + **每條規則 $1/月** + **每百萬次請求 $0.60**。Managed 規則群組另有訂閱費。",free:"沒有免費額度。",rows:[{tier:"Web ACL",price:"$5 / 月",note:"每個 ACL 分開計費。",level:1},{tier:"自訂規則",price:"$1 / 規則 / 月",note:"規則多成本線性成長。",level:1},{tier:"請求處理",price:"$0.60 / 百萬次",note:"流量大時才是主要成本。",level:2},{tier:"Managed Rules（Core / Bot Control）",price:"$1–$10 / 月 + 請求費",note:"Bot Control 較貴（每百萬 $1）。",level:3}],traps:["Rate-based rule 誤擋共用 IP（公司 NAT 出口）造成整間公司進不來。","沒開 logging，事故發生時完全查不到原因。","Managed 規則更新後偶爾會誤擋（建議設定規則動作覆寫與告警）。"]},exam:["「**SQL injection / XSS 防護**」→ WAF。","「**限制每 IP 請求速率**」→ Rate-based rule。","「**組織統一管理防火牆規則**」→ Firewall Manager。","「**Edge 阻擋、省後端成本**」→ CloudFront + WAF。","「**DDoS 網路層攻擊**」→ Shield（WAF 是第 7 層）。"],gotchas:["WAF 不支援 NLB（第 4 層）。","CloudFront 的 WAF 必須建在 **us-east-1**。","Web ACL 容量（WCU）有上限，規則太多會無法儲存。","ALB 前面若有 CloudFront，兩層都可以掛 WAF，但要避免重複計算。"],related:["shield","cloudfront","elb","firewall-manager","api-gateway"]},{id:"shield",name:"AWS Shield",zh:"DDoS 防護",category:"security",emoji:"\uD83D\uDEE1️",tagline:"自動吸收 DDoS 攻擊流量，進階版還提供帳單保護與 24/7 應變團隊。",aliases:["ddos","standard","advanced","防護"],intro:["**Shield Standard 免費且自動開啟**：保護所有 AWS 客戶免受常見的網路層 / 傳輸層 DDoS 攻擊（SYN flood、UDP reflection 等）。","**Shield Advanced 付費**（$3,000/月/組織）：提供**進階緩解**、**成本保護**（DDoS 造成的暴增流量費可退）、**24/7 DDoS Response Team（DRT）**、以及 WAF 與 Route 53 的費用包含在內。","完整防護策略是分層的：**CloudFront / Route 53 / Shield 吸收網路層**，**WAF 過濾應用層**，**Auto Scaling 撐住剩餘流量**。"],concepts:[{term:"Standard",desc:"免費、自動、保護 CloudFront / Route 53 / ELB 等，抵禦常見第 3/4 層攻擊。"},{term:"Advanced",desc:"付費訂閱，含成本保護、DRT 支援、進階健康檢查與攻擊診斷。"},{term:"Cost Protection",desc:"因 DDoS 造成的 Auto Scaling / CloudFront / ELB 費用可申請退款。"},{term:"DRT（DDoS Response Team）",desc:"攻擊期間可請 AWS 專家協助調整規則（Proactive engagement）。"},{term:"Attack Diagnostics",desc:"Advanced 提供攻擊的詳細分析與歷史紀錄。"}],interactions:[{to:"cloudfront",dir:"in",how:"CDN 的分散式 Edge 本身就是 DDoS 吸收層，Shield Advanced 可保護它。"},{to:"route53",dir:"in",how:"DNS 層攻擊防護（Route 53 本身有 Anycast 與 Shield）。"},{to:"elb",dir:"in",how:"ELB 在 Shield 保護範圍內，攻擊時仍能正常分發流量。"},{to:"waf",dir:"both",how:"第 7 層攻擊交給 WAF（Advanced 包含 WAF 費用）。"},{to:"global-accelerator",dir:"both",how:"Anycast 與骨幹網路有助於分散攻擊流量。"},{to:"auto-scaling",dir:"in",how:"撐住攻擊帶來的流量成長（但會產生費用，成本保護涵蓋）。"},{to:"guardduty",dir:"both",how:"偵測異常活動並與防護策略搭配。"}],settings:[{name:"Standard vs Advanced",required:!0,desc:"Advanced 每月 $3,000，企業與金融業常見。"},{name:"Protected resources",desc:"Advanced 需要明確指定要保護的資源（ELB / CloudFront / Global Accelerator / EIP）。"},{name:"Proactive engagement",desc:"授權 DRT 在攻擊時主動介入。"},{name:"Health-based detection",desc:"Advanced 用 Route 53 health check 判斷是否正在被攻擊。"},{name:"CloudWatch alarms 整合",desc:"攻擊事件可觸發告警與自動化。"}],pricing:{model:"**Standard 免費**；**Advanced $3,000/月 + 資料傳輸超量費**（訂閱以組織為單位，包含 DDoS 成本保護）。",free:"Shield Standard 對所有帳號免費且自動啟用。",rows:[{tier:"Shield Standard",price:"免費",note:"自動保護，不需設定。",level:0},{tier:"Shield Advanced",price:"$3,000 / 月（一年承諾）",note:"還包含 WAF 與 DRT 支援。",level:5},{tier:"資料傳輸超量",price:"依用量階梯",note:"每月有一定額度。",level:2},{tier:"DDoS 成本保護",price:"含在訂閱內",note:"可申請攻擊期間的暴增費用退款。",level:0}],traps:["$3,000/月是固定成本，中小企業通常用 CloudFront + WAF + 自動擴縮即可。","沒有設定保護資源清單，危急時才發現沒生效。"]},exam:["「**任何帳號都有的免費 DDoS 防護**」→ Shield Standard。","「**需要 DDoS 成本保護與專家支援**」→ Shield Advanced。","「**應用層攻擊（SQLi / XSS）**」→ WAF（不是 Shield）。","最佳實務組合：CloudFront + Route 53 + Shield + WAF + Auto Scaling。"],gotchas:["Shield 不會阻止一切：它靠吸收與分散，配合架構設計才有效。","Advanced 訂閱是以組織為單位，全部納入才划算。","CloudFront 與 Global Accelerator 的 Edge 吸收效果通常優於單一 Region 的 ALB。"],related:["waf","cloudfront","route53","global-accelerator"]},{id:"guardduty",name:"Amazon GuardDuty",zh:"威脅偵測",category:"security",emoji:"\uD83D\uDD75️",tagline:"用 ML 與威脅情報自動找出「這裡不對勁」：可疑 API、被挖礦、被入侵。",aliases:["threat detection","anomaly","bitcoin mining","threat intel"],intro:["**GuardDuty** 是智慧型威脅偵測：它持續分析 **CloudTrail 管理事件、VPC Flow Logs、DNS Logs**（以及 S3 / EKS / RDS / Lambda 的保護功能），用機器學習與威脅情報找出異常活動。","它**不需要安裝 agent**、不影響效能，只要開啟（30 天試用）就會開始產生 **Findings**，並可整合 EventBridge / Lambda 做自動回應（例如「偵測到 EC2 對外挖礦 → 自動隔離 Security Group」）。","典型 finding：`UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration`（憑證外洩）、`CryptoCurrency:EC2/BitcoinTool`（被挖礦）、`Recon:EC2/Portscan`。"],concepts:[{term:"Finding",desc:"一筆偵測結果，含嚴重性（Low / Medium / High）、類型與建議處理方式。"},{term:"Data Sources",desc:"CloudTrail 事件、VPC Flow Logs、DNS logs 為基礎（免費分析），S3 / EKS / Lambda / RDS 保護需另外開啟（額外計費）。"},{term:"Threat Intel Set / IP Set",desc:"自訂的威脅情報清單（自訂可疑 IP）。"},{term:"Suppression Rules",desc:"壓抑已知的良性告警（例如內部掃描器）。"},{term:"Malware Protection",desc:"對 EBS 磁碟做惡意軟體掃描（額外計費）。"}],interactions:[{to:"cloudtrail",dir:"in",how:"分析 CloudTrail 管理事件找出可疑 API 呼叫（不需另建 trail，但建 trail 有助調查）。"},{to:"vpc",dir:"in",how:"分析 VPC Flow Logs 找出異常連線與 port scan。"},{to:"eventbridge",dir:"out",how:"Findings 發到 EventBridge，可觸發自動化回應（隔離、通知、開 ticket）。"},{to:"lambda",dir:"out",how:"自動修復：例如把被入侵的執行個體停止、撤銷憑證。"},{to:"organizations",dir:"in",how:"可集中管理所有帳號（管理帳號查看全組織的 findings），這是實務上必要的設定。"},{to:"s3",dir:"both",how:"S3 Protection 分析資料存取異常；findings 也可匯出到 S3。"},{to:"inspector",dir:"both",how:"GuardDuty 找行為異常、Inspector 找軟體漏洞，互補。"}],settings:[{name:"保護功能開關",required:!0,desc:"S3 Protection、EKS Audit Logs、RDS Login Activity、Lambda Network Activity、Malware Protection 各自收費。"},{name:"Finding 頻率",desc:"可調整（例如每 15 分鐘或 1 小時彙整）以控制成本。"},{name:"Trusted IP list / Threat intel list",desc:"排除或加入自訂清單（3 組免費）。"},{name:"Suppression rules",desc:"壓抑已知良性告警，避免告警疲乏。"},{name:"組織委派管理員",desc:"用 Delegated Admin 集中管理多帳號。"},{name:"自動化回應",warn:!0,desc:"**建議必設**：只有告警沒有回應，等於沒防護。"}],pricing:{model:"依**分析的事件量**計費：CloudTrail 事件（每百萬）、VPC Flow Logs / DNS（每 GB）、S3 資料事件（每百萬）。",free:"30 天免費試用（不含 Malware Protection）。",rows:[{tier:"基礎偵測（CloudTrail + Flow Logs + DNS）",price:"約 $4 / 百萬事件（CloudTrail）",note:"小型帳號常低於 $10/月。",level:1},{tier:"VPC Flow Logs / DNS 分析",price:"$1 / GB",note:"流量大的帳號是主要成本。",level:2},{tier:"S3 Protection",price:"$0.80 / 百萬事件",note:"物件存取量極大時要留意。",level:2},{tier:"Malware Protection",price:"依掃描 GB 計費",note:"需要時再開。",level:2},{tier:"EKS / RDS / Lambda Protection",price:"另計",note:"依使用量。",level:2}],traps:["資料量極大的環境（大量 S3 存取、海量 Flow Logs）費用會明顯上升。","開了卻沒人看 findings 等於白花錢 → 一定要接 EventBridge / Security Hub 做自動通知。","把所有保護功能都開在測試帳號，成本增加卻沒有價值。"]},exam:["「**偵測異常 API 呼叫 / 被入侵 / 挖礦**」→ GuardDuty。","「**自動回應威脅**」→ GuardDuty + EventBridge + Lambda。","「**需要 agent 嗎**」→ 不需要（分析既有 log）。","「**合規稽核紀錄**」→ CloudTrail；「**偵測威脅**」→ GuardDuty。","「**軟體漏洞掃描**」→ Inspector；「**敏感資料發現**」→ Macie。"],gotchas:["GuardDuty 只在開啟後才開始蒐集，歷史資料不會回溯。","不是即時防火牆：要主動阻擋得靠自動化或 WAF。","每一 Region 要分別啟用（可用組織設定一次全開）。"],related:["cloudtrail","inspector","macie","eventbridge","organizations"]},{id:"inspector",name:"Amazon Inspector",zh:"弱點掃描",category:"security",emoji:"\uD83D\uDD2C",tagline:"自動找出 EC2 / 容器映像 / Lambda 的軟體漏洞與意外曝露。",aliases:["vulnerability","cve","scan","漏洞"],intro:["**Inspector** 是自動化的弱點管理服務：持續掃描 **EC2 執行個體**（透過 SSM Agent）、**ECR 容器映像**與 **Lambda 函式**，找出 CVE 漏洞、網路曝露（例如意外的開放 port）與軟體清單。","它不像傳統掃描需要排程：只要環境有變更（新映像、新套件、新的 CVE 發布）就會重新評估，並給出**風險分數**（依 CVSS + 是否可達 + 是否有 exploit）。","它與 GuardDuty 是互補的：GuardDuty 找「行為異常」，Inspector 找「已知弱點」。"],concepts:[{term:"Continuous scanning",desc:"不用排程，環境或漏洞資訊變更就自動重新掃描。"},{term:"Findings",desc:"含 CVE、受影響套件、修補建議與風險分數。"},{term:"Network Reachability",desc:"判斷漏洞是否真的「可從網路到達」，降低誤報優先度。"},{term:"SBOM 匯出",desc:"軟體物料清單（CycloneDX）匯出到 S3，符合供應鏈安全要求。"},{term:"Inspector Classic vs 現行版本",desc:"舊版需逐台安裝 agent 與排程，現行版本改為與 SSM / ECR 深度整合。"}],interactions:[{to:"ec2",dir:"in",how:"需要 SSM Agent 才能掃描執行個體；建議用 SSM 大規模啟用。"},{to:"ecr",dir:"in",how:"掃描容器映像（basic 或 enhanced scanning）。"},{to:"lambda",dir:"in",how:"掃描函式程式碼相依套件與執行環境。"},{to:"systems-manager",dir:"in",how:"SSM Agent 與 Fleet Manager 是部署與檢視的基礎。"},{to:"eventbridge",dir:"out",how:"新 findings 觸發通知或自動建立 ticket、甚至自動修復。"},{to:"organizations",dir:"in",how:"集中管理所有帳號的掃描。"},{to:"guardduty",dir:"both",how:"行為異常 + 已知漏洞 = 完整視野。"}],settings:[{name:"EC2 scanning 啟用方式",required:!0,warn:!0,desc:"必須安裝並執行 SSM Agent，否則不會被掃。"},{name:"ECR enhanced scanning",desc:"由 Inspector 提供持續掃描（basic 由 ECR 自己提供）。"},{name:"Resource tags / 排除規則",desc:"可用 tag 排除測試資源，避免雜訊與費用。"},{name:"Risk score 閾值",desc:"決定哪些 findings 需要優先處理。"},{name:"Organizations 整合",desc:"Delegated admin 集中檢視。"}],pricing:{model:"依**掃描的資源類型與數量**計費：EC2 執行個體（每月每台）、ECR 映像（依掃描次數）、Lambda 函式（依函式數與執行）。",free:"15 天免費試用。",rows:[{tier:"EC2 掃描",price:"約 $1.65 / 執行個體 / 月",note:"100 台約 $165/月。",level:2},{tier:"ECR 映像掃描",price:"約 $0.09 / 映像（初次）+ $0.01 重新掃描",note:"映像多且更新頻繁時要注意。",level:1},{tier:"Lambda 掃描",price:"依函式數計費",note:"通常金額小。",level:1},{tier:"SBOM 匯出",price:"含在內",note:"匯出到 S3 只有儲存費。",level:0}],traps:["測試環境大量執行個體也被掃描，費用上升但價值低（用 tag 排除）。","只掃不修：findings 累積而沒有修補流程，風險持續存在。"]},exam:["「**EC2 / 容器的 CVE 弱點掃描**」→ Inspector。","「**偵測」 vs 「掃描」**：GuardDuty 是行為偵測，Inspector 是弱點掃描。","「**ECR 映像掃描**」→ Inspector（或 ECR basic scanning）。","「**不需要安裝 agent」** 是錯的——EC2 掃描需要 SSM Agent。"],gotchas:["受限於 OS 支援與 agent 版本，部分執行個體不會被評估。","發現漏洞不代表會被利用（要看網路可達性與 exploit 可能性）。","與第三方掃描器（Tenable、Qualys）並存時要有單一真實來源。"],related:["guardduty","macie","ecr","systems-manager"]},{id:"macie",name:"Amazon Macie",zh:"敏感資料探索與保護",category:"security",emoji:"\uD83D\uDD0E",tagline:"用 ML 找出 S3 裡的敏感資料：信用卡號、身分證號、金鑰、個資。",aliases:["pii","sensitive data","s3 scan","個資"],intro:["**Macie** 自動探索 S3 bucket 中的**敏感資料**：用機器學習與模式比對找出 PII（個人資料）、信用卡號、AWS 金鑰、醫療資訊等，並評估 bucket 的**安全性與存取設定**（公開、未加密、跨帳號）。","它會持續分析 bucket metadata（免費的 bucket 層級評估），而**敏感資料探索（掃描物件內容）** 才需要費用。","典型用途：合規稽核（GDPR / 個資法）、找出「不該放在 S3 的資料」、以及找出公開的敏感 bucket。"],concepts:[{term:"Sensitive data discovery job",desc:"針對特定 bucket 執行一次性或排程的深入掃描。"},{term:"Managed data identifiers",desc:"內建的辨識規則（信用卡、護照、姓名等），可自訂 regex。"},{term:"Sensitive data findings",desc:"發現敏感資料的報告（含位置、發現數量與嚴重性）。"},{term:"Policy findings",desc:"bucket 設定問題（公開、未加密、關閉 logging）。不需要掃描就有。"},{term:"Allow lists / custom identifiers",desc:"排除誤報或加入公司特定格式。"}],interactions:[{to:"s3", ry Certificate.DomainValidationOptions","# CloudFront 用憑證一定要在 us-east-1","aws acm list-certificates --region us-east-1"],exam:["「**免費、自動續期、綁 ALB / CloudFront**」→ ACM 公開憑證。","「**CloudFront 的憑證要在哪個 Region**」→ us-east-1。","「**需要匯出私鑰給 EC2 用**」→ ACM 公開憑證不行（要 Private CA 或第三方）。","「**內部服務 mTLS**」→ ACM Private CA。","「**一個 ALB 掛多個網域憑證**」→ SNI。"],gotchas:["公開憑證無法匯出。","憑證驗證卡在 Pending validation 通常是 CNAME 沒設定或 DNS 尚未傳播。","Wildcard 憑證不包含根網域。","ap-northeast-1（東京）的 ALB 不能用 us-east-1 的憑證。"],related:["cloudfront","elb","route53","api-gateway"]},{id:"directory-service",name:"AWS Directory Service",zh:"託管 Active Directory",category:"security",emoji:"\uD83C\uDFEB",tagline:"在雲上跑 Microsoft AD，或把地端 AD 延伸到 AWS。",aliases:["active directory","ad","ldap","managed microsoft ad"],intro:["**Directory Service** 提供三種選項：**AWS Managed Microsoft AD**（真正的 AD，由 AWS 管理，可信任地端 AD 做雙向信任）、**AD Connector**（代理到地端 AD，不在雲端儲存資料）、**Simple AD**（Samba-based，便宜的輕量目錄，教師 / 測試用）。","如果只是要把 Linux 機器接上同樣的帳號體系，**Identity Center 或 AD 使用者授權** 可能更簡單；需要「Windows 工作負載真正加入網域」（例如 [[fsx|FSx for Windows]]、WorkSpaces、EC2 Windows）才需要 Directory Service。","選擇邏輯：**要在雲端有獨立的 AD** → Managed Microsoft AD；**使用者只在地端 AD** → AD Connector；**只要便宜簡單的 LDAP** → Simple AD。"],concepts:[{term:"Managed Microsoft AD",desc:"由 AWS 建立的真正 AD（含兩個網域控制站跨 AZ），你有 Admin 權限，可做信任關係。"},{term:"AD Connector",desc:"把驗證請求代理到地端 AD，不在雲端複製使用者（需要 VPN / DX 連線）。"},{term:"Simple AD",desc:"Samba 4 為基礎，支援基本 LDAP / Kerberos，不支援信任關係。"},{term:"Trust relationship",desc:"與地端 AD 建立雙向信任，讓雲端與地端使用者互相驗證。"},{term:"WorkSpaces / FSx 整合",desc:"虛擬桌面與 Windows 檔案系統都要加入 AD 才能運作。"}],interactions:[{to:"iam-identity-center",dir:"out",how:"Identity Center 用 Managed AD 或 AD Connector 作為身分來源做 SSO。"},{to:"fsx",dir:"out",how:"FSx for Windows File Server 必須加入 AD 才能提供 SMB 存取與 ACL。"},{to:"ec2",dir:"out",how:"Windows 執行個體加入網域後可用 AD 帳號登入與套用 GPO。"},{to:"direct-connect",dir:"in",how:"AD Connector 與地端 AD 需要穩定的網路（DX 或 VPN）。"},{to:"vpc",dir:"in",how:"目錄建在 VPC 的兩個子網（兩個 AZ）以提供高可用。"}],settings:[{name:"目錄類型",required:!0,
