)",desc:"兩種角色：CU 執行加密操作，CO 管理使用者與金鑰。"},{term:"Client SDK",desc:"應用透過 PKCS#11 / JCE / CNG 與 HSM 溝通（需要安裝 agent）。"},{term:"Custom Key Store",desc:"把 CloudHSM 叢集掛到 KMS，讓 KMS API 使用 HSM 中的金鑰。"}],interactions:[{to:"kms",dir:"both",how:"KMS Custom Key Store 讓 KMS 使用 CloudHSM 的金鑰（合規 + 便利的折衷）。"},{to:"ec2",dir:"in",how:"應用程式安裝 CloudHSM client 後直接呼叫 HSM 做加解密。"},{to:"vpc",dir:"in",how:"HSM 佈建在 VPC 的特定子網（每個 AZ 一台）。"},{to:"s3",dir:"out",how:"匯出加密備份（backup）到 S3 保存金鑰備份。"},{to:"iam",dir:"in",how:"管理權限與稽核走 IAM / CloudTrail。"}],settings:[{name:"HSM 數量與 AZ",required:!0,warn:!0,desc:"至少兩台跨兩個 AZ（HA）；單台是測試用。"},{name:"HSM 類型",desc:"依合規需求選（例如 FIPS 140-2 Level 3）。"},{name:"Cluster 初始化 / 備份",warn:!0,desc:"備份包含金鑰（以你的公鑰加密），一定要保存，否則災難時無法還原。"},{name:"使用者角色",desc:"CO / CU 密碼要妥善保管（通常是分成多人持有）。"},{name:"Client SDK 版本",desc:"應用端 SDK 與叢集版本要匹配。"}],pricing:{model:"**每台 HSM 每小時 $1.45**（約 $1,000/月），跨 AZ 兩台就是兩倍。",free:"沒有免費額度（有短期試用情形）。",rows:[{tier:"HSM 執行個體",price:"$1.45 / 小時（約 $1,058/月）",note:"每台、每 AZ。",level:5},{tier:"兩台 HA 叢集",price:"約 $2,100 / 月",note:"這是真實的合規成本。",level:5},{tier:"備份儲存",price:"依容量計費",note:"金額小但必做。",level:1},{tier:"KMS（對照組）",price:"$1 / 金鑰 / 月",note:"相差三個數量級。",level:0}],traps:["成本極高：只有法規（PCI-DSS、政府）或合約要求才需要。","忘了備份金鑰 → HSM 故障時無法還原加密資料。","單台 HSM 沒有高可用，故障會導致資料無法解密。"]},exam:["「**需要 FIPS 140-2 Level 3、金鑰不能給 AWS**」→ CloudHSM。","「**一般加密需求、要整合 AWS 服務**」→ KMS。","「**要 KMS 的便利 + CloudHSM 的合規**」→ KMS Custom Key Store。","「**雲端 HSM 是最便宜的選項**」是錯的——它是最貴的。"],gotchas:["CloudHSM 不做金鑰管理 UI：要自己用 SDK 管理使用者與金鑰。","無法與大部分 AWS 服務直接整合（除了透過 Custom Key Store）。","刪除叢集前務必完成金鑰遷移或備份。"],related:["kms","secrets-manager","iam"]},{id:"firewall-manager",name:"AWS Firewall Manager",zh:"集中式防火牆管理",category:"security",emoji:"\uD83D\uDEA7",tagline:"在 Organizations 層級一次套用 WAF、Shield、Security Group 政策到所有帳號。",aliases:["fms","centralized security","policy"],intro:["**Firewall Manager** 讓你用一組政策管理組織內所有帳號的 **WAF 規則、Shield Advanced 保護、Security Group 規則、Network Firewall 政策**（以及 Route 53 Resolver DNS Firewall）。","它解決的是「新帳號 / 新資源沒有被保護」的問題：政策可以自動套用到現有與**未來**建立的所有符合條件的資源。","使用前提：必須搭配 [[organizations|AWS Organizations]]（All features）並指定管理員帳號。"],concepts:[{term:"Policy",desc:"要套用的規則集合與適用範圍（依 tag 或資源類型）。"},{term:"Auto-remediation",desc:"自動修復不合規的資源（例如補上防護或標記）。"},{term:"Security group policy",desc:"強制所有帳號的 SG 不准開放特定 port（例如 22 對全世界）。"},{term:"Shield Advanced 政策",desc:"自動保護新建立的 ELB / CloudFront。"},{term:"Scope by tags",desc:"只套用到符合 tag 的資源（例如 `env=prod`）。"}],interactions:[{to:"organizations",dir:"in",how:"必要的基礎：管理員帳號才能跨帳號套用政策。"},{to:"waf",dir:"out",how:"建立與部署 Web ACL 到所有帳號。"},{to:"shield",dir:"out",how:"統一啟用 Shield Advanced 保護。"},{to:"vpc",dir:"out",how:"Security Group 政策與 Network Firewall 的集中管理。"},{to:"guardduty",dir:"both",how:"搭配威脅偵測結果調整政策。"},{to:"cloudwatch",dir:"out",how:"不合規資源與政策狀態的指標。"}],settings:[{name:"Policy type",required:!0,desc:"WAF / Shield / Security Group / Network Firewall / DNS Firewall。"},{name:"Rule 內容與優先順序",required:!0,desc:"規則衝突時的優先順序要規劃。"},{name:"Auto remediation",warn:!0,desc:"開啟前先確認不會誤刪業務需要的規則。"},{name:"Scope（tag / resource type / OU）",desc:"精準套用，避免影響開發帳號。"},{name:"管理員帳號",desc:"指定誰能管理政策（通常是安全團隊帳號）。"}],pricing:{model:"**每條政策 $100/月**（依政策類型與資源數另有計費）+ 底層服務（WAF / Shield）費用。",free:"沒有免費額度。",rows:[{tier:"每條政策",price:"$100 / 月",note:"10 條政策就是 $1,000/月。",level:4},{tier:"底層 WAF / Shield 費用",price:"依用量",note:"Firewall Manager 只是管理層。",level:2},{tier:"Shield Advanced",price:"$3,000 / 月",note:"企業級保護。",level:5}],traps:["政策費用固定且不低，先評估帳號數量與合規需求。","自動修復設定過激可能造成服務中斷。"]},exam:["「**新帳號自動套用防火牆政策**」→ Firewall Manager。","「**多帳號的 SG 規則一致性**」→ Firewall Manager security group policy。","「**需要 Organizations**」是前提條件。"],gotchas:["必須是組織的成員帳號（且 All features）才能使用。","政策衝突時以最嚴格的為主，要事先測試。"],related:["waf","shield","organizations","vpc"]}];var p$=[{id:"sqs",name:"Amazon SQS",zh:"訊息佇列（Queue）",category:"integration",emoji:"\uD83D\uDCEC",tagline:"把生產者與消費者解耦：訊息先排隊，誰有空誰處理，系統不會一起掛掉。",aliases:["queue","fifo","decouple","佇列","解耦"],intro:["**SQS（Simple Queue Service）** 是完全託管的訊息佇列：生產者放訊息，消費者**主動拉取（pull）**。它的價值是**解耦**與**緩衝**：前端不用等後端處理完，突發流量不會直接打爆資料庫。","兩種佇列：**Standard**（近乎無限吞吐、至少一次傳遞、可能亂序）與 **FIFO**（嚴格順序、精確一次處理、吞吐上限較低）。","重要機制：**Visibility Timeout**（訊息被取走後的隱藏時間，處理失敗會重新出現）、**DLQ**（死信佇列，處理太多次仍失敗就丟這裡）、**Long Polling**（等待最多 20 秒以减少空回應與費用）。"],concepts:[{term:"Visibility Timeout",desc:"預設 30 秒；處理時間比它長就會被別人重複處理（重複消費的常見原因）。"},{term:"Dead Letter Queue",desc:"超過 `maxReceiveCount` 仍失敗的訊息移到 DLQ，方便排查而不阻塞主佇列。"},{term:"Long Polling",desc:"`WaitTimeSeconds` 設 20 秒，減少空輪詢請求數量（省錢又降低延遲）。"},{term:"Message Group ID（FIFO）",desc:"同一 group 內的訊息嚴格有序，不同 group 平行處理。"},{term:"Message size",desc:"上限 256 KB（含屬性），更大要用 S3 或 Extended Client Library。"},{term:"At-least-once",desc:"Standard 佇列保證至少送一次，所以消費者必須 **idempotent**。"}],interactions:[{to:"lambda",dir:"out",how:"最常見的組合：Lambda 用 Event Source Mapping 批次拉訊息，失敗依 `maxReceiveCount` 進 DLQ。"},{to:"sns",dir:"in",how:"SNS + SQS = Fan-out：一個事件同時送到多個佇列，各服務獨立處理。"},{to:"ec2",dir:"out",how:"Worker 機器輪詢佇列（傳統 pull 模型），可搭配 Auto Scaling 依佇列深度擴縮。"},{to:"auto-scaling",dir:"in",how:"用 `ApproximateNumberOfMessages` 指標做 scaling policy（佇列長就加機器）。"},{to:"cloudwatch",dir:"out",how:"佇列深度、訊息年齡、可見訊息數等指標，是監控瓶頸的核心。"},{to:"step-functions",dir:"both",how:"Step Functions 可以發送與等待 SQS 訊息（callback pattern）。"},{to:"eventbridge",dir:"both",how:"EventBridge 可以把事件路由到 SQS（或相反方向的通知）。"},{to:"kms",dir:"in",how:"SSE-KMS 加密佇列中的訊息內容。"}],settings:[{name:"Queue type（Standard / FIFO）",required:!0,warn:!0,desc:"FIFO 才有順序保證，但吞吐較低（每 group 每秒最多 300–3000 訊息）。"},{name:"Visibility timeout",required:!0,warn:!0,desc:"要比應用實際處理時間長（建議 6 倍平均處理時間）；太短會重複處理。"},{name:"Message retention period",desc:"預設 4 天，最長 14 天。"},{name:"Receive message wait time",warn:!0,desc:"設 20 秒啟用 long polling；設 0 就是 short polling（空請求多、成本高）。"},{name:"Dead-letter queue",warn:!0,desc:"**一定要設**，否則壞訊息會無限重試卡住整個佇列。"},{name:"Max message size / 批次",desc:"256 KB；批次最多 10 則（Lambda 可到 10,000 筆但需設 batching window）。"},{name:"Encryption（SSE-SQS / SSE-KMS）",desc:"預設 SSE-SQS；需要稽核或跨帳號控制就用 KMS。"},{name:"Access policy",desc:"跨帳號或跨服務授權（例如允許 SNS 發送到此佇列）。"}],pricing:{model:"**每百萬次請求 $0.40**（每 64 KB 為一單位），加上資料傳輸費。",free:"免費方案：每月 100 萬次請求（永久免費額度）。",rows:[{tier:"Standard 請求",price:"$0.40 / 百萬次",note:"長輪詢可大幅減少請求數。",level:1},{tier:"FIFO 請求",price:"$0.50 / 百萬次",note:"比 Standard 貴 25%。",level:1},{tier:"資料傳輸",price:"$0.09 / GB（出網際網路）",note:"同 Region 內免費。",level:2},{tier:"KMS 加密請求",price:"另計",note:"大量訊息 + SSE-KMS 會累積 KMS 費用。",level:1}],traps:["沒有長輪詢 → 大量空請求，帳單比預期高十倍。","沒有 DLQ → 一則壞訊息讓佇列永遠無法清空。","想用 Standard 佇列做嚴格排序 → 資料順序錯亂（用 FIFO）。","每則訊息都呼叫 KMS 加解密 → 成本高。"]},cli:["aws sqs create-queue --queue-name jobs --attributes \\",`  '{"VisibilityTimeout":"60","ReceiveMessageWaitTimeSeconds":"20","MessageRetentionPeriod":"1209600"}'`,`aws sqs send-message --queue-url $QURL --message-body '{"job":123}'`,"aws sqs receive-message --queue-url $QURL --wait-time-seconds 20 --max-number-of-messages 10"],exam:["「**解耦、緩衝、非同步處理**」→ SQS。","「**嚴格順序 + 不重複**」→ FIFO。","「**一則訊息多個消費者各自處理**」→ SNS + 多個 SQS（Fan-out）。","「**訊息被重複處理**」→ Visibility Timeout 太短。","「**處理失敗的訊息去哪裡**」→ DLQ。","「**依待處理訊息數自動擴縮**」→ SQS 指標 + Auto Scaling。","SQS 是 **pull** 模型（SNS 是 push）。"],gotchas:["Standard 佇列保證「至少一次」，順序不保證 → 消費者要 idempotent。","訊息不會自動刪除：消費者必須明確刪除，否則時間到會重新出現。","FIFO 佇列名稱必須以 `.fifo` 結尾。","訊息大小上限 256 KB（可透過 S3 + Extended Client 處理更大內容）。"],related:["sns","lambda","eventbridge","kinesis-data-streams","auto-scaling"]},{id:"sns",name:"Amazon SNS",zh:"發布 / 訂閱通知（Pub/Sub）",category:"integration",emoji:"\uD83D\uDCE2",tagline:"一個事件推給所有訂閱者：Email、SMS、Lambda、SQS、HTTP 端點一次搞定。",aliases:["pubsub","notification","topic","fan-out","簡訊"],intro:["**SNS（Simple Notification Service）** 是 Pub/Sub：你發佈一則訊息到 **Topic**，所有訂閱者都會收到（**push** 模型）。訂閱者可以是 Email、SMS、HTTP/S endpoint、Lambda、SQS、Kinesis Firehose、行動推播。","最經典的架構是 **SNS Fan-out**：事件發到 SNS topic，同時送到多個 SQS 佇列，讓不同服務各自用自己的步調處理——這也是「一份事件、多個消費者」的標準解法。","SNS 也支援 **Message Filtering**（訂閱者只收符合條件的訊息）與 **FIFO Topic**（嚴格順序，只能訂閱 SQS FIFO）。"],concepts:[{term:"Topic / Subscription",desc:"Topic 是頻道，Subscription 是「誰用什麼方式接收」。"},{term:"Fan-out",desc:"一個 topic 多個 SQS 訂閱，各自處理不同任務。"},{term:"Message Filter Policy",desc:"訂閱者用 JSON 條件過濾（例如只收 `eventType=order_created`）。"},{term:"FIFO Topic",desc:"支援 Message Group ID 與去重 ID，訂閱者只能是 SQS FIFO 佇列。"},{term:"Delivery retry / DLQ",desc:"推送失敗會重試（HTTP 端點有 policy），失敗可設定 DLQ。"},{term:"SNS 不保存訊息",desc:"沒有訂閱者或推送失敗就會遺失（要保存就用 SQS 或 Kinesis）。"}],interactions:[{to:"sqs",dir:"out",how:"Fan-out 標準組合：SNS topic → 多個 SQS 佇列（各服務獨立消費）。"},{to:"lambda",dir:"out",how:"事件直接觸發多個函式（平行處理）。"},{to:"cloudwatch",dir:"both",how:"Alarm 動作可發到 SNS；SNS 也有自己的送達指標。"},{to:"auto-scaling",dir:"in",how:"擴縮事件可發通知（也可以由 SNS 觸發 Lambda 做自訂擴縮）。"},{to:"ses",dir:"both",how:"需要複雜的 Email 內容與附件時，SNS 通知搭配 SES 發信。"},{to:"kinesis-data-streams",dir:"out",how:"SNS 也能送到 Kinesis（透過 Firehose）做歸檔。"},{to:"eventbridge",dir:"both",how:"EventBridge 可作為 SNS 的目標或來源。"},{to:"iam",dir:"in",how:"topic policy 決定誰能發佈與訂閱（跨帳號常用）。"}],settings:[{name:"Topic type（Standard / FIFO）",required:!0,warn:!0,desc:"FIFO topic 只能訂閱 SQS FIFO，且名稱要以 `.fifo` 結尾。"},{name:"Subscription protocol",required:!0,desc:"Email / SMS / HTTP(S) / Lambda / SQS / Firehose / 行動推播。"},{name:"Message filter policy",desc:"減少不必要的呼叫與成本（例如只把特定事件送到特定佇列）。"},{name:"Delivery retry policy",warn:!0,desc:"HTTP 端點的預設重試策略（4 次、共約 20 秒）通常太樂觀，要按需求調整。"},{name:"DLQ for failed delivery",warn:!0,desc:"沒有 DLQ，推送失敗的訊息就永遠消失。"},{name:"Encryption（SSE / KMS）",desc:"加密訊息內容。"},{name:"Access policy",desc:"限制誰能 publish / subscribe（跨帳號必要）。"},{name:"SMS 寄送設定",warn:!0,desc:"SMS 有沙箱模式與費用問題，國際簡訊很貴。"}],pricing:{model:"按**發佈次數**（每百萬 $0.50）與**送達次數**（依協定，SQS/Lambda 每百萬 $0.50、HTTP $0.60、Email $2、SMS 依地區）計費。",free:"免費方案：每月 100 萬次發佈（永久）。",rows:[{tier:"API 請求（發佈）",price:"$0.50 / 百萬次",note:"前 100 萬次免費。",level:0},{tier:"SQS / Lambda 送達",price:"$0.50 / 百萬次",note:"最常見的 fan-out 目標。",level:1},{tier:"HTTP/S 送達",price:"$0.60 / 百萬次",note:"加上端點的流量成本。",level:1},{tier:"Email 送達",price:"$2.00 / 10 萬次",note:"大量通知要估算。",level:2},{tier:"SMS",price:"依國家，$0.00645/則 起",note:"國際簡訊每則可能到 $0.05 以上。",level:3},{tier:"FIFO 訊息",price:"約 $0.50 / 百萬次（另有儲存）",note:"較 Standard 貴。",level:1}],traps:["用 SMS 做大量通知 → 費用可能是 Email 的十倍以上。","沒有 filter policy，所有訂閱者收到所有訊息 → 下游處理費用暴增。","把 SNS 當訊息保存機制 → 沒訂閱者或推送失敗訊息就消失。"]},cli:["aws sns create-topic --name alerts","aws sns subscribe --topic-arn $TOPIC --protocol email --notification-endpoint me@example.com","aws sns subscribe --topic-arn $TOPIC --protocol sqs --notification-endpoint $QUEUE_ARN \\",`  --attributes '{"FilterPolicy":"{\\"type\\":[\\"order_created\\"]}"}'`,'aws sns publish --topic-arn $TOPIC --message "deploy finished"'],exam:["「**一份事件、多個消費者**」→ SNS Fan-out（SNS → 多個 SQS）。","「**要 push 通知 / Email / SMS**」→ SNS。","「**訂閱者只收特定事件**」→ Message Filter Policy。","「**需要順序**」→ SNS FIFO + SQS FIFO。","「**訊息不能遺失**」→ 用 SQS / Kinesis（SNS 本身不保存）。","CloudWatch Alarm → SNS 是最常見的告警鏈。"],gotchas:["SNS 沒有拉取模式，全都是 push。","Email 訂閱需要收件人點確認連結才會生效。","SMS 在沙箱階段只能寄給已驗證號碼。","HTTP 端點必須是公開可存取的（或使用 PrivateLink）。"],related:["sqs","lambda","cloudwatch","ses","eventbridge"]},{id:"eventbridge",name:"Amazon EventBridge",zh:"事件匯流排",category:"integration",emoji:"\uD83D\uDE8C",tagline:"事件驅動架構的中樞：用規則把事件路由到對的服務，還能排程。",aliases:["event bus","cron","schedule","event driven","事件"],intro:["**EventBridge** 是事件匯流排（Event Bus）：AWS 服務、你的應用或 SaaS 夥伴把**事件**丟進來，你用**規則（Rule）** 比對事件內容後路由到目標（Lambda、SQS、Step Functions、Kinesis、另一個 bus…）。","三種 bus：**Default**（AWS 服務事件自動進來）、**Custom**（自訂應用事件）、**Partner**（SaaS 夥伴事件，如 Datadog、Zendesk）。","它也取代了舊的 CloudWatch Events，並且是**排程（cron）的首選**：`rate(5 minutes)` 或 cron 表達式觸發 Lambda／ECS Task。"],concepts:[{term:"Event Bus / Rule / Target",desc:"bus 收事件，rule 比對（Event Pattern）後送到 target（最多 5 個）。"},{term:"Event Pattern",desc:'JSON 比對（例如 `"source": ["aws.ec2"], "detail-type": ["EC2 State Change"]`）。'},{term:"Schedule Expression",desc:"`rate(1 hour)` 或 `cron(0 9 * * ? *)`（UTC 時間，注意時區換算）。"},{term:"Archive & Replay",desc:"歸檔事件並在之後重播（修復 bug 後重跑事件）。"},{term:"Schema Registry",desc:"自動探索事件結構並產生程式碼綁定。"},{term:"EventBridge Pipes",desc:"把來源（SQS / Kinesis / DynamoDB Streams）直接連到目標，含過濾與轉換。"}],interactions:[{to:"lambda",dir:"out",how:"最常見的目標：事件或排程觸發函式。"},{to:"sqs",dir:"out",how:"事件送入佇列做緩衝與重試。"},{to:"step-functions",dir:"out",how:"事件啟動工作流（例如訂單建立 → 多步驟流程）。"},{to:"ecs",dir:"out",how:"排程觸發 Fargate Task（取代 cron job）。"},{to:"s3",dir:"both",how:"S3 事件可經 EventBridge 做更複雜的路由（比原生事件通知更強）。"},{to:"cloudtrail",dir:"in",how:"所有 AWS API 呼叫事件都可以被 EventBridge 規則捕捉（例如偵測 root 登入）。"},{to:"sns",dir:"out",how:"事件轉成通知。"},{to:"kinesis-data-streams",dir:"out",how:"事件進入串流做後續分析或歸檔。"},{to:"guardduty",dir:"in",how:"GuardDuty findings 經 EventBridge 觸發自動修復。"}],settings:[{name:"Event bus（Default / Custom / Partner）",required:!0,desc:"自訂應用事件建議建立 custom bus，避免與 AWS 事件混在一起。"},{name:"Event pattern / 排程表達式",required:!0,warn:!0,desc:"排程是 **UTC**；cron 表達式 6 個欄位（含年份），格式錯誤會建立失敗。"},{name:"Target + Input transformer",desc:"可轉換事件格式後再送出（不是所有目標都能吃原始事件）。"},{name:"Retry policy / DLQ",warn:!0,desc:"目標失敗時的重試（預設 24 小時、185 次）與死信佇列——務必設定 DLQ。"},{name:"Rule 層級的資源政策（bus policy）",desc:"跨帳號事件傳送需要 bus policy。"},{name:"Archive & Replay",desc:"需要事後重播事件時開啟（會產生儲存費）。"},{name:"Cross-account / Cross-region",desc:"跨帳號或跨區的事件路由（global endpoint 會增加延遲）。"}],pricing:{model:"**每百萬個發佈的事件 $1.00**（自己發佈到 bus 的事件）+ 排程規則與跨區傳輸費。從 AWS 服務來的事件免費。",free:"免費方案：每月 1,400 萬次自訂事件（部分情境），AWS 服務事件本身免費。",rows:[{tier:"自訂事件發佈",price:"$1.00 / 百萬事件",note:"AWS 服務產生的事件不收費。",level:1},{tier:"API 目標（Lambda / SQS 等）",price:"包含在內",note:"目標服務自身的費用另計。",level:0},{tier:"跨 Region 傳輸",price:"$0.01 / 百萬事件 + 流量",note:"跨區事件架構要留意。",level:1},{tier:"Archive / Replay",price:"依儲存與重播事件數",note:"歸檔保留成本需評估。",level:1},{tier:"Schema Registry",price:"免費",note:"自動探索與程式碼綁定不收費。",level:0}],traps:["沒有設 DLQ 與重試策略 → 目標失敗時事件默默消失。","排程用 UTC 但以為是本地時間，任務在錯誤時間執行。","把大量高頻事件全部路由（例如每個 S3 物件事件）→ 費用線性成長。"]},cli:['aws events put-rule --name nightly-job --schedule-expression "cron(0 15 * * ? *)"',"aws events put-targets --rule nightly-job \\",'  --targets "Id"="1","Arn"="$LAMBDA_ARN"',`aws events put-events --entries '[{"Source":"my.app","DetailType":"order_created","Detail":"{\\"id\\":1}","EventBusName":"default"}]'`],exam:["「**事件驅動、路由、過濾**」→ EventBridge。","「**定期執行（cron）**」→ EventBridge Scheduler / 排程規則。","「**SaaS 夥伴事件**」→ Partner Event Bus。","「**事後重播事件**」→ Archive & Replay。","「**跨帳號事件**」→ bus policy + 規則。","EventBridge vs SNS：EventBridge 擅長**內容過濾 + 多種目標 + 排程**；SNS 擅長**大量推送與多協定通知**。"],gotchas:["EventBridge 的排程是 UTC。","S3 事件要經 EventBridge 需要開啟「EventBridge 整合」設定（每個 bucket 要開）。","每個規則最多 5 個 target。","事件大小上限 256 KB。"],related:["lambda","step-functions","sqs","sns","cloudtrail"]},{id:"kinesis-data-streams",name:"Amazon Kinesis Data Streams",zh:"即時串流資料（Streaming）",category:"integration",emoji:"\uD83C\uDF0A",tagline:"每秒百萬筆的即時資料管道：擷取、保存、多個消費者同時讀。",aliases:["stream","streaming","shard","realtime","串流"],intro:["**Kinesis Data Streams** 用來擷取大量即時資料（點擊流、IoT、log、金融交易），資料以 **Shard** 為單位水平擴展，保留期預設 24 小時（最長 365 天）。","與 SQS 的關鍵差別：**多個消費者可以同時讀同一份資料**（不會被搶走），且支援**重播**（重新從某個位置讀取）——SQS 是「一則訊息給一個消費者」。","消費者可以是 Lambda（Event Source Mapping）、Kinesis Client Library 應用、Firehose、Managed Flink 或 KDA。"],concepts:[{term:"Shard",desc:"容量單位：寫入 1 MB/s 或 1000 筆/s，讀取 2 MB/s。要擴展就增加 shard（或 resharding）。"},{term:"Partition Key",desc:"決定資料進哪個 shard；相同 key 保證同一 shard（保持順序）。"},{term:"Sequence Number",desc:"每筆記錄在 shard 內的唯一位置，消費者的讀取游標。"},{term:"保留期 / 長期保留",desc:"預設 24 小時，可延長到 7 天（免費上限）或 365 天（額外計費）。"},{term:"On-Demand 模式",desc:"自動調整容量（不用算 shard 數），單價較高但省事。"},{term:"Enhanced Fan-Out",desc:"每個消費者有獨立 2 MB/s 頻寬（付費），適合多消費者、低延遲。"}],interactions:[{to:"lambda",dir:"out",how:"Lambda 以 Event Source Mapping 批次讀取，處理完才推進游標（失敗可重試）。"},{to:"data-firehose",dir:"both",how:"Firehose 從 Kinesis 讀取並送到 S3 / Redshift / OpenSearch（歸檔與分析）。"},{to:"managed-flink",dir:"out",how:"用 Flink 做串流 ETL、視窗聚合與即時告警。"},{to:"s3",dir:"out",how:"經 Firehose 或自行消費後寫入 S3 做資料湖。"},{to:"dynamodb",dir:"out",how:"串流處理結果寫入 DynamoDB 做即時查詢。"},{to:"cloudwatch",dir:"out",how:"IncomingRecords、IteratorAge（消費落後程度）等關鍵指標。"},{to:"sns",dir:"both",how:"SNS 可以經 Firehose 進 Kinesis；Kinesis 消費者可發 SNS 告警。"},{to:"msk",dir:"both",how:"Kafka 相容需求選 MSK，Kinesis 勝在無維運與 AWS 整合。"}],settings:[{name:"Capacity mode（On-Demand / Provisioned）",required:!0,desc:"不確定流量用 On-Demand；可預測且量大用 Provisioned 較便宜。"},{name:"Shard 數量",required:!0,warn:!0,desc:"依寫入量計算：1 shard = 1 MB/s 或 1000 筆/s。太少會被限流。"},{name:"Partition key 設計",warn:!0,desc:"設計不良會造成 **hot shard**（單一 shard 打滿、其他閒置）。"},{name:"資料保留期",desc:"24 小時免費；需要重播或重處理就延長（成本增加）。"},{name:"Encryption（KMS）",desc:"伺服器端加密，KMS 請求費用另計。"},{name:"Enhanced fan-out",warn:!0,desc:"多消費者且要低延遲時開啟（按 GB 計費）。"},{name:"Consumer 的 batching / retry",desc:"影響延遲與重複處理的機率（Kinesis 是 at-least-once）。"}],pricing:{model:"**Provisioned**：每個 shard 每小時（$0.015）+ PUT payload 單位（每百萬 $0.014）。**On-Demand**：按 GB 與寫入量。",free:"沒有免費額度（但有試用）。",rows:[{tier:"Shard 小時費",price:"$0.015 / shard-小時",note:"1 shard 一個月約 $11；10 shards 就是 $110。",level:2},{tier:"PUT 記錄",price:"$0.014 / 百萬筆（每 25 KB 一單位）",note:"大量小筆記錄成本會累積。",level:1},{tier:"延長保留（> 7 天）",price:"$0.023 / GB-月",note:"需要重播才開。",level:2},{tier:"Enhanced fan-out",price:"$0.015 / GB（消費者）",note:"每個消費者分別計費。",level:2},{tier:"On-Demand",price:"$0.04 / GB 寫入 + 讀取",note:"省去容量規劃。",level:2}],traps:["Shard 開太多 → 固定小時費浪費；太少 → 資料遺失風險與限流。","IteratorAge 持續上升代表消費者追不上，資料會在保留期後消失。","Enhanced fan-out 讓每個消費者都產生費用。"]},cli:["aws kinesis create-stream --stream-name clicks --shard-count 3",`aws kinesis put-record --stream-name clicks --partition-key user-1 --data "$(echo -n '{"page":"home"}' | base64)"`,"aws kinesis describe-stream-summary --stream-name clicks"],exam:["「**多個消費者同時讀同一份資料、可重播**」→ Kinesis。","「**一則訊息只給一個消費者**」→ SQS。","「**即時聚合 / 視窗分析**」→ Kinesis + Managed Flink。","「**串流資料自動存到 S3 / Redshift**」→ Firehose。","「**需要 Kafka 生態**」→ MSK。","「**要處理 1 MB/s 以上的寫入**」→ 增加 shard 或改用 On-Demand。"],gotchas:["Partition key 設計不良 → hot shard。","Kinesis 是 at-least-once：可能有重複記錄。","Lambda 消費 Kinesis 時，一個 shard 的並發處理有順序限制（失敗會阻塞該 shard）。","Shard 只能增加或合併（resharding），過程中要管理成本。"],related:["data-firehose","managed-flink","msk","lambda","sqs"]},{id:"data-firehose",name:"Amazon Data Firehose",zh:"串流資料自動載入（Kinesis Firehose）",category:"integration",emoji:"\uD83D\uDE9A",tagline:"把串流資料自動送進 S3 / Redshift / OpenSearch，還能順手轉檔與壓縮。",aliases:["firehose","delivery stream","etl","載入"],intro:["**Data Firehose** 是最省事的串流「載入」服務：來源資料進來後，它會**批次緩衝**（依大小或時間）、**可選轉換**（Lambda 處理、格式轉換 JSON→Parquet、壓縮、加密）、然後送到 **S3 / Redshift / OpenSearch / Splunk / HTTP endpoint**。","它幾乎是**即時**（緩衝區間最小 60 秒），不是「微批次」而是持續的交付管線，而且**完全免維運**。","跟 Kinesis Data Streams 的差別：Firehose 是「**交付到目的地**」（近即時、有緩衝、不保存），Streams 是「**資料管道**」（可多消費者讀取、可重播、保留數天）。"],concepts:[{term:"Delivery Stream",desc:"一條管線：來源（直接 PUT / Kinesis Stream / MSK）→ 目的地。"},{term:"Buffering hints",desc:"依大小（1–128 MB）與時間（60–900 秒）決定何時交付。"},{term:"Format conversion",desc:"JSON → Parquet / ORC（使用 Glue Data Catalog schema），大幅提升 Athena 查詢效率。"},{term:"Dynamic partitioning",desc:"依內容自動分區（例如 `year=/month=/day=`），S3 上的分區就會自動整理。"},{term:"Backup / Error handling",desc:"交付失敗會重試，全部失敗的資料可備份到 S3 做後續處理。"},{term:"Transform Lambda",desc:"每批資料最多 3 MB 的 Lambda 轉換（可做欄位過濾、去識別化）。"}],interactions:[{to:"kinesis-data-streams",dir:"in",how:"常見架構：Streams 承接高吞吐寫入，Firehose 負責歸檔與交付。"},{to:"s3",dir:"out",how:"最主要的目的地，可搭配分區與格式轉換成資料湖。"},{to:"redshift",dir:"out",how:"直接把串流資料灌進資料倉儲（經 S3 中轉並執行 COPY）。"},{to:"opensearch",dir:"out",how:"近即時搜尋與 log 分析（CloudWatch Logs → Firehose → OpenSearch）。"},{to:"lambda",dir:"both",how:"資料轉換或產生告警。"},{to:"glue",dir:"in",how:"Format conversion 需要 Glue Data Catalog 的 schema。"},{to:"cloudwatch",dir:"in",how:"CloudWatch Logs 訂閱過濾器可直接送到 Firehose（最常見的 log 管線）。"},{to:"kms",dir:"in",how:"加密輸出資料。"}],settings:[{name:"Source",required:!0,desc:"Direct PUT / Kinesis Stream / MSK，來源不同支援的功能略有差異。"},{name:"Destination",required:!0,warn:!0,desc:"S3 / Redshift / OpenSearch / Splunk / HTTP；建立後無法更改（要新建）。"},{name:"Buffering size / interval",warn:!0,desc:"越小越即時但檔案越碎（S3 上小檔案會拖慢 Athena）。"},{name:"Format conversion + schema",desc:"啟用 Parquet 轉換需要 Glue 表；能大幅降低查詢成本。"},{name:"Dynamic partitioning",desc:"依欄位自動分區，避免產生大量小檔案與全表掃描。"},{name:"S3 prefix / error output",warn:!0,desc:"設定錯誤時輸出到哪，沒有設就只留在 CloudWatch log 裡。"},{name:"Encryption / KMS",desc:"加密輸出（S3 SSE-KMS）。"},{name:"Retry / 資料保留",desc:"失敗重試 0–7200 秒（依版本），超過就視為失敗。"}],pricing:{model:"按**傳入的資料量（GB）** 計費（$0.029/GB 起），加上目的地服務的儲存與請求費、選用的轉換費。",free:"沒有免費額度。",rows:[{tier:"資料擷取（前 500 TB）",price:"$0.029 / GB",note:"1 TB/月約 $30。",level:1},{tier:"格式轉換（Parquet）",price:"$0.018 / GB",note:"換來更便宜的查詢（通常划算）。",level:1},{tier:"Lambda 轉換",price:"依 Lambda 用量",note:"每 3 MB 呼叫一次。",level:1},{tier:"VPC 交付 / 其他目的地",price:"另有費用",note:"Redshift / Splunk 依目的地計費。",level:1},{tier:"S3 儲存（目的地）",price:"依 S3 價格",note:"通常是最終成本主體。",level:2}],traps:["緩衝時間設太短 → S3 上大量小檔案，Athena 查詢變慢又變貴。","Format conversion 沒設定 → 資料是 JSON，之後查詢成本高很多。","沒有 dynamic partitioning → 分區規劃亂，資料湖很快就難以維護。"]},cli:["aws firehose create-delivery-stream --delivery-stream-name logs-to-s3 \\","  --s3-destination-configuration RoleARN=$ROLE,BucketARN=$BUCKET,Prefix=logs/,BufferingHints={SizeInMBs=64,IntervalInSeconds=300}","aws firehose put-record --delivery-stream-name logs-to-s3 \\",`  --record Data=$(echo -n '{"msg":"hi"}' | base64)`],exam:["「**CloudWatch Logs 要進 OpenSearch / S3 做分析**」→ Firehose（訂閱過濾器 + Firehose）。","「**串流資料要近即時自動進 S3、並轉 Parquet**」→ Firehose。","「**要多個消費者、可重播**」→ Kinesis Data Streams（不是 Firehose）。","「**不想管容量、免維運**」→ Firehose（vs Kinesis Streams 要管 shard）。"],gotchas:["近即時（最小 60 秒緩衝），不是毫秒級即時。","目的地無法更改（要刪除重建）。","Lambda 轉換失敗的資料會被送到 S3 錯誤前綴，需要另外處理。","交付到 Redshift 需要 S3 中繼與適當的 IAM 角色。"],related:["kinesis-data-streams","s3","opensearch","redshift","cloudwatch"]},{id:"step-functions",name:"AWS Step Functions",zh:"工作流程編排（State Machine）",category:"integration",emoji:"\uD83E\uDDE9",tagline:"把多個 Lambda 與服務串成可視化流程：重試、分支、等待、人工審核都幫你處理。",aliases:["state machine","workflow","orchestration","工作流"],intro:["**Step Functions** 用 **State Machine**（狀態機）描述流程：每個步驟是 state（Task / Choice / Wait / Parallel / Map / Pass），用 JSON（Amazon States Language）定義轉換與錯誤處理。","它解決的事情：**重試與例外處理**（每步可設 retry / catch）、**長時間流程**（最長 1 年，Lambda 只有 15 分鐘）、**平行處理**（Parallel / Map）、**人工審核**（Task Token 等待外部 callback）。","與 EventBridge 的差別：EventBridge 是「事件路由」，Step Functions 是「有狀態的流程編排」。"],concepts:[{term:"State 類型",desc:"Task（做事）、Choice（分支）、Wait（等待）、Parallel（同時）、Map（對陣列逐項處理）、Pass、Succeed / Fail。"},{term:"Standard vs Express",desc:"Standard：最長 1 年、精確一次、適合長時間商務流程；Express：最長 5 分鐘、至少一次、高吞吐低成本。"},{term:"Retry / Catch",desc:"每個 Task 可設定重試策略（間隔、次數、指數退避）與錯誤捕捉分支。"},{term:"Task Token / Callback",desc:"等待外部系統回呼（人工審核、第三方處理）。"},{term:"Map（分散式）",desc:"對大量項目平行處理（Distributed Map 可處理 10,000 筆以上）。"},{term:"Execution history",desc:"每一步的輸入輸出都有完整記錄（可視化追蹤最方便）。"}],interactions:[{to:"lambda",dir:"both",how:"最常見：每個步驟呼叫一個 Lambda；Lambda 也能啟動工作流。"},{to:"ecs",dir:"out",how:"Task 可以啟動 Fargate Task（跑長工作或容器化批次）。"},{to:"sns",dir:"both",how:"等待人工審核（Task Token）或發送流程通知。"},{to:"sqs",dir:"both",how:"發送訊息、或用 callback pattern 等待佇列回應。"},{to:"eventbridge",dir:"both",how:"EventBridge 可啟動流程；流程也能發事件。"},{to:"dynamodb",dir:"out",how:"直接呼叫 DynamoDB API 讀寫狀態（省一層 Lambda）。"},{to:"batch",dir:"out",how:"啟動 AWS Batch 任務做大量運算。"},{to:"cloudwatch",dir:"out",how:"每個執行的 log 與指標（成功率、延遲、失敗次數）。"}],settings:[{name:"Type（Standard / Express）",required:!0,warn:!0,desc:"長時間 / 需要精確一次 → Standard；高頻短流程 → Express（便宜 10 倍以上）。"},{name:"Timeout / Heartbeat",desc:"Task 的 TimeoutSeconds 與 HeartbeatSeconds，避免卡死。"},{name:"Retry / Catch 策略",warn:!0,desc:"**必設**：網路與限流錯誤要用指數退避重試，業務錯誤要分流處理。"},{name:"IAM Role",required:!0,desc:"每個 state 呼叫的服務都需要對應權限（常見的 403 來源）。"},{name:"Logging level",desc:"ALL / ERROR / FATAL / OFF；與 X-Ray tracing 一起開比較好調查。"},{name:"Input / Output processing",desc:"ResultPath / OutputPath 控制資料在步驟間怎麼傳遞（JSONPath 很容易寫錯）。"},{name:"Map concurrency",desc:"平行度上限（Standard 40；Distributed Map 更高）。"}],pricing:{model:"**Standard**：每 1,000 次狀態轉換 $0.025。**Express**：依請求數與執行時間（GB-秒）。",free:"免費方案：每月 4,000 次狀態轉換（Standard）。",rows:[{tier:"Standard 狀態轉換",price:"$0.025 / 1,000 次",note:"100 萬次轉換約 $25。",level:2},{tier:"Express 請求",price:"$1.00 / 百萬次",note:"高頻流程便宜 10 倍以上。",level:1},{tier:"Express 執行時間",price:"$0.00001667 / GB-秒",note:"類似 Lambda 計費。",level:1},{tier:"Distributed Map",price:"依子工作流計費",note:"大量平行處理要估算。",level:2}],traps:["在迴圈中產生大量狀態轉換（例如輪詢等待）→ 帳單暴增（改用 Wait / callback）。","用 Standard 跑高頻短流程 → 改用 Express。","沒有設 retry → 一次網路抖動就讓整個流程失敗。"]},cli:["aws stepfunctions create-state-machine --name order-flow \\","  --definition file://definition.json --role-arn $ROLE",`aws stepfunctions start-execution --state-machine-arn $ARN --input '{"orderId":"1"}'`,"aws stepfunctions describe-execution --execution-arn $EXEC_ARN"],exam:["「**多步驟流程、需要重試與錯誤處理**」→ Step Functions。","「**Lambda 15 分鐘限制但流程更長**」→ Step Functions。","「**人工審核步驟**」→ Task Token callback pattern。","「**大量項目平行處理**」→ Map state（Distributed Map）。","「**高頻、短時間流程**」→ Express Workflow。","「**事件路由而非流程**」→ EventBridge。"],gotchas:["Standard 與 Express 功能集不同（Express 不支援 Task Token、不支援 .sync 整合）。","狀態轉換費用會隨流程複雜度線性增加。","JSONPath 的 path 寫錯會讓資料靜默消失（用 OutputPath 檢查）。","Express 的執行紀錄不會保留在 Step Functions 內（要自己送 log）。"],related:["lambda","eventbridge","sqs","ecs","batch"]},{id:"amazon-mq",name:"Amazon MQ",zh:"託管訊息中介（ActiveMQ / RabbitMQ）",category:"integration",emoji:"\uD83D\uDC07",tagline:"要搬上雲但不想改程式？託管的 ActiveMQ / RabbitMQ 讓你保留既有協定。",aliases:["activemq","rabbitmq","jms","amqp","mqtt"],intro:["**Amazon MQ** 是託管的傳統訊息中介軟體：**ActiveMQ**（JMS、AMQP、STOMP、MQTT、OpenWire）與 **RabbitMQ**（AMQP 0-9-1）。","它存在的理由很明確：**既有應用使用 JMS / AMQP 協定，不想改寫成 SQS / SNS**。SQS / SNS 是專有 API，遷移需要改程式；Amazon MQ 讓你直接搬家。","代價是它不像 SQS 那樣無限擴展：需要選 instance 規格、有 broker 節點、要處理作業系統修補窗（雖然是託管但仍要維護版本）。"],concepts:[{term:"Broker",desc:"訊息中介的執行個體；可單機或主動/備援（Active/Standby）跨 AZ 高可用。"},{term:"Queue vs Topic",desc:"Queue（點對點，競爭消費者）與 Topic（發布訂閱，fan-out）。"},{term:"RabbitMQ Cluster",desc:"多節點叢集部署（三個節點起），提供更高的可用性與吞吐。"},{term:"Storage type",desc:"EBS（持久，建議）或 EFS（跨 AZ 共享）。"},{term:"Engine version",desc:"Managed 但仍需選擇引擎版本，維護窗會自動套用修補。"}],interactions:[{to:"ec2",dir:"in",how:"既有應用（Java / Spring JMS 等）直接連線 broker，不需改程式。"},{to:"lambda",dir:"in",how:"Lambda 可以作為 MQ 的消費者（Event Source Mapping，需在 VPC 內）。"},{to:"vpc",dir:"in",how:"broker 部署在 VPC 內（多個子網），Security Group 控制存取。"},{to:"secrets-manager",dir:"in",how:"broker 的帳密由 Secrets Manager 管理（AWS 自動建立）。"},{ ，接收（inbound）需要額外設定與規則。"],related:["sns","lambda","route53","pinpoint"]}];var n$=[{id:"cloudwatch",name:"Amazon CloudWatch",zh:"監控與可觀測性",category:"monitoring",emoji:"\uD83D\uDCC8",tagline:"AWS 的眼睛：指標、日誌、告警、儀表板，全部集中在同一個地方。",aliases:["metrics","logs","alarm","dashboard","監控","告警"],intro:["**CloudWatch** 是 AWS 的監控服務，三大支柱：**Metrics**（數值型指標：CPU、延遲）、**Logs**（應用與服務的日誌）、**Alarms**（依條件觸發動作）。","幾乎每個 AWS 服務都自動送指標進來（免費的基本指標）；要更細的（記憶體、磁碟、自訂業務指標）需要安裝 **CloudWatch Agent** 或用 SDK 上報。","它是「**普查工具**」，不是 APM：追蹤請求在微服務間的路徑要靠 X-Ray；看 SQL 效能要看 Performance Insights；看雲端資源設定是否合規要用 [[aws-config|AWS Config]]。"],concepts:[{term:"Metric / Namespace",desc:"指標以 命名空間 + 維度 組織（例如 `AWS/EC2` + `InstanceId`）。"},{term:"Standard vs Detailed",desc:"標準指標每 5 分鐘（免費）、詳細監控每 1 分鐘（EC2 額外收費）。"},{term:"Alarm 狀態",desc:"OK / ALARM / INSUFFICIENT_DATA；可觸發 SNS、Lambda、Auto Scaling 動作。"},{term:"Composite Alarm",desc:"把多個 alarm 組合成一個（減少告警風暴）。"},{term:"Logs Insights",desc:"用查詢語法（類似 SQL）分析 log，例如統計錯誤率與最慢的請求。"},{term:"Metric Filter",desc:"從 log 中萃取指標（例如「出現 ERROR 就 +1」）並可觸發 alarm。"},{term:"Subscription Filter",desc:"把 log 即時串到 Lambda / Kinesis / Firehose / OpenSearch。"},{term:"Synthetics（Canary）",desc:"定時用無頭瀏覽器模擬使用者操作，監控端到端可用性。"}],interactions:[{to:"ec2",dir:"in",how:"基本指標自動上報（CPU、網路、磁碟 I/O）；記憶體與磁碟使用率需要 CloudWatch Agent。"},{to:"cloudwatch",dir:"in",how:"Invocations、Errors、Duration、Throttles、ConcurrentExecutions 自動送出。"},{to:"sns",dir:"out",how:"Alarm 觸發 SNS 通知（Email / SMS / Lambda）。"},{to:"auto-scaling",dir:"out",how:"Alarm 驅動 scaling policy（例如 CPU > 70% 擴一台）。"},{to:"eventbridge",dir:"both",how:"Alarm 狀態變更事件可觸發自動化（不只發通知）。"},{to:"data-firehose",dir:"out",how:"log 經訂閱過濾器 → Firehose → S3 / OpenSearch 做長期分析。"},{to:"opensearch",dir:"out",how:"log 分析與全文檢索最常用的目的地（也可用 X-Ray ServiceLens 做整合檢視）。"},{to:"trusted-advisor",dir:"both",how:"Trusted Advisor 的檢查結果可透過 CloudWatch 檢視。"}],settings:[{name:"Retention period（Logs）",required:!0,warn:!0,desc:"**預設永不刪除**！這是帳單暴增第一名，一定要設定保留期（例如 30 天）。"},{name:"Alarm threshold / period / datapoints",warn:!0,desc:"`EvaluationPeriods` 與 `DatapointsToAlarm` 決定靈敏度，設錯就是告警風暴或漏報。"},{name:"Missing data treatment",desc:"`missing` / `notBreaching` / `breaching` / `ignore`，影響資源停止時的告警行為。"},{name:"Log group / stream 結構",desc:"用一致的命名（`/app/env/service`）讓查詢與權限好管理。"},{name:"Metric filters / retention by class",desc:"不同 log 用不同儲存類別（Standard / Infrequent Access）省成本。"},{name:"Dashboard / 跨帳號監控",desc:"跨帳號指標用 CloudWatch cross-account observability。"},{name:"High resolution metrics",desc:"1 秒解析度（額外收費），只在需要快速反應時使用。"},{name:"Anomaly detection",desc:"用 ML 建立指標基準線，避免手動設定門檻。"}],pricing:{model:"**指標**（每指標每月 $0.30，前 10 個自訂指標免費）、**Logs 擷取**（$0.50/GB）、**Logs 儲存**（$0.03/GB-月）、**Alarm**（每個 $0.10/月）。",free:"免費額度：10 個自訂指標、5 GB log 擷取、5 GB 儲存、10 個 alarm。",rows:[{tier:"自訂指標",price:"$0.30 / 指標 / 月",note:"細緻的業務指標很容易累積成幾百美元。",level:2},{tier:"Logs 擷取",price:"$0.50 / GB",note:"前 5 GB 免費；debug log 全開會很貴。",level:2},{tier:"Logs 儲存（Standard）",price:"$0.03 / GB-月",note:"**沒有設保留期就一直收**。",level:1},{tier:"Logs 儲存（IA）",price:"$0.0055 / GB-月",note:"很少查的 log 用這層省 80%。",level:0},{tier:"Alarm（標準）",price:"$0.10 / 月",note:"複合 alarm 較貴（$0.50）。",level:0},{tier:"Dashboard",price:"$3 / 儀表板 / 月（超過 3 個後）",note:"前 3 個免費。",level:1},{tier:"對外匯出資料（GetMetricStatistics）",price:"$0.01 / 1,000 指標",note:"大量自建監控面板要注意。",level:1}],traps:["**Log group 沒有設保留期**是 AWS 帳單前幾名的隱形支出。","DEBUG 等級 log 全開 → 擷取費暴增（$0.50/GB）。","為每個 instance 送大量自訂指標（例如每台 20 個）→ 指標費線性成長。","Alarm 設太敏感 → 告警疲乏（真正的問題被忽略）。","跨 Region 的 log 傳輸與儲存各自計費。"]},cli:["aws cloudwatch put-metric-alarm --alarm-name high-cpu \\","  --metric-name CPUUtilization --namespace AWS/EC2 --statistic Average \\","  --period 300 --evaluation-periods 2 --threshold 80 \\","  --comparison-operator GreaterThanThreshold \\","  --dimensions Name=InstanceId,Value=i-123 \\","  --alarm-actions $SNS_TOPIC_ARN","","aws logs put-retention-policy --log-group-name /aws/lambda/my-fn --retention-in-days 30","aws logs tail /aws/lambda/my-fn --follow","aws logs start-query --log-group-name /aws/lambda/my-fn --start-time $(( $(date +%s) - 3600 )) --end-time $(date +%s) \\","  --query-string 'fields @timestamp, @message | filter @message like /ERROR/ | limit 20'"],exam:["「**資源監控、告警、Dashboard**」→ CloudWatch。","「**EC2 記憶體使用率**」→ 需要 **CloudWatch Agent**（預設沒有）。","「**log 要即時串到其他地方**」→ Subscription filter → Firehose / Lambda。","「**log 中出現關鍵字就告警**」→ Metric filter + Alarm。","「**雲端資源設定變更的合規記錄**」→ AWS Config（不是 CloudWatch）。","「**API 呼叫的稽核記錄**」→ CloudTrail。"],gotchas:["CloudWatch 的指標是**事後聚合**（最細 1 分鐘），不是即時串流。","Alarm 的 `INSUFFICIENT_DATA` 狀態常被忽略而漏報。","Log group 名稱衝突（同名不同 Region 是不同資源）。","CloudWatch Agent 的設定檔錯誤會導致指標完全沒上報。","CloudWatch Logs 的查詢（Insights）有掃描上限與費用。"],related:["cloudtrail","aws-config","systems-manager","sns","data-firehose"]},{id:"cloudtrail",name:"AWS CloudTrail",zh:"API 稽核記錄",category:"monitoring",emoji:"\uD83E\uDDFE",tagline:"誰在什麼時候對哪個資源做了什麼：所有 API 呼叫的完整紀錄。",aliases:["audit","api log","governance","稽核","軌跡"],intro:["**CloudTrail** 記錄 AWS 帳號中的 **API 活動**：誰（身分）、何時、從哪個 IP、對什麼資源做了什麼操作、結果成功或失敗。每筆記錄預設保留 **90 天**（Event history，免費查詢）。","要長期保存必須建立 **Trail**（存到 S3，可選加密與 log file validation）並可同時送到 CloudWatch Logs 做即時告警。","三種事件類型：**Management events**（控制平面：建立 / 修改資源，預設記錄）、**Data events**（資料平面：S3 物件讀寫、Lambda 呼叫，**預設關閉且量大要額外付費**）、**Insight events**（異常 API 活動偵測）。"],concepts:[{term:"Trail",desc:"記錄設定：要記錄哪些事件、存到哪個 S3 bucket（可跨帳號集中）。"},{term:"Management vs Data events",desc:"管理事件（建立 EC2）預設記錄；資料事件（讀 S3 物件）預設不記錄，量大且要錢。"},{term:"Event history",desc:"每個 Region 最近 90 天的管理事件，免費查閱（不需 Trail）。"},{term:"Organization Trail",desc:"組織層級 trail，自動涵蓋所有帳號（新帳號也自動納入）。"},{term:"Log file validation",desc:"產生 digest 檔案驗證 log 未被竄改（合規必要）。"},{term:"Multi-region trail",desc:"涵蓋所有 Region；建議一定要開啟，否則其他 Region 的活動看不到。"}],interactions:[{to:"s3",dir:"out",how:"Trail 的 log 存放位置（通常集中到專用的 log archive 帳號）。"},{to:"cloudwatch",dir:"out",how:"同時送到 CloudWatch Logs 才能設定即時告警（例如 root 登入）。"},{to:"eventbridge",dir:"out",how:"所有 API 事件都會上 EventBridge，可依 pattern 觸發自動化。"},{to:"guardduty",dir:"out",how:"GuardDuty 分析 CloudTrail 事件找出可疑活動。"},{to:"organizations",dir:"in",how:"Organization trail 一次涵蓋所有帳號。"},{to:"kms",dir:"in",how:"使用 SSE-KMS 加密 log 檔案。"},{to:"athena",dir:"in",how:"用 SQL 查詢 S3 上的 CloudTrail log（大量稽核分析）。"},{to:"aws-config",dir:"both",how:"兩者互補：Config 記錄資源狀態，CloudTrail 記錄操作歷程。"}],settings:[{name:"Multi-region trail",required:!0,warn:!0,desc:"只建單一 Region 的 trail 會漏掉其他 Region 的操作（常見的稽核盲區）。"},{name:"Management / Data events",required:!0,desc:"Data events 預設關閉；要稽核 S3 物件讀取就要開（費用高）。"},{name:"S3 bucket + 加密 + validation",warn:!0,desc:"使用專用 bucket、開啟 log file validation，並限制刪除權限。"},{name:"CloudWatch Logs 整合",desc:"要即時告警（例如未授權的 API 呼叫）就必須整合。"},{name:"Insights events",desc:"偵測異常的 API 呼叫率（額外計費）。"},{name:"Retention（S3 Lifecycle）",desc:"S3 上的 log 只會一直累積，要用 lifecycle 轉 Glacier 或刪除。"},{name:"KMS key policy",warn:!0,desc:"加密後若 key policy 設錯，連自己都讀不到 log。"}],pricing:{model:"**建立 trail 後，管理事件的記錄免費**（第一個 trail）；**Data events 與額外的 trail 依事件數收費**；S3 儲存費用另計。",free:"每個 Region 的第一個 trail 的管理事件免費；90 天 Event history 免費。",rows:[{tier:"管理事件（第一個 trail）",price:"免費",note:"每個 Region 一次。",level:0},{tier:"額外 trail 的管理事件",price:"$2.00 / 10 萬事件",note:"多個 trail 會重複計費。",level:2},{tier:"Data events（S3 物件）",price:"$0.10 / 10 萬事件",note:"S3 存取量大的帳號成本可觀。",level:3},{tier:"Data events（Lambda）",price:"$0.20 / 10 萬事件",note:"高頻函式要留意。",level:3},{tier:"S3 儲存 log",price:"依 S3 價格 + lifecycle",note:"log 只進不出，靠 lifecycle 控成本。",level:2}],traps:["開啟 S3 Data events 稽核「誰讀了物件」，但在高流量網站上費用可能上千美元/月。","S3 log bucket 沒設 lifecycle → 儲存費無上限成長。","以為 CloudTrail 會記錄 S3 物件的 GET 請求（其實要開 data events）。","多個 trail 重複記錄同一事件 → 費用加倍。"]},cli:["aws cloudtrail create-trail --name org-trail --s3-bucket-name my-audit-logs \\","  --is-multi-region-trail --enable-log-file-validation --is-organization-trail","aws cloudtrail start-logging --name org-trail","aws cloudtrail lookup-events --lookup-attributes AttributeKey=EventName,AttributeValue=DeleteBucket --max-results 10"],exam:["「**誰刪了這個資源 / 誰改了設定**」→ CloudTrail。","「**API 呼叫的歷史紀錄**」→ CloudTrail；「**資源設定的合規狀態**」→ Config。","「**組織內所有帳號都要記錄**」→ Organization Trail。","「**需要即時告警（root 登入）**」→ CloudTrail + CloudWatch Logs metric filter + Alarm。","「**data events 預設關閉**」是重要考點。","「**log 檔案被修改過要能偵測**」→ log file validation。"],gotchas:["Event history 只有 90 天。","只有管理事件預設免費與預設記錄。","CloudTrail 記錄「API 呼叫」，不會記錄資料庫內部的 SQL 操作。","S3 log bucket 的權限若開放，稽核紀錄反而成為風險。"],related:["cloudwatch","aws-config","guardduty","organizations","athena"]},{id:"aws-config",name:"AWS Config",zh:"資源設定合規記錄",category:"monitoring",emoji:"\uD83D\uDCD0",tagline:"記錄每個資源的設定隨時間變化，並自動檢查是否符合規則。",aliases:["compliance","rules","configuration history","合規"],intro:["**AWS Config** 持續記錄支援資源的**設定變化**（configuration items）與**關聯關係**，讓你能回答「這個 S3 bucket 三個月前的加密設定是什麼？」以及「哪些資源違反了公司規範？」。","**Config Rules**（受管或自訂 Lambda 規則）持續評估資源是否合規，例如「EBS 必須加密」、「Security Group 不能開 0.0.0.0/0 的 22 port」。支援**自動修復（Remediation）**。","CloudTrail 記錄「誰做了什麼」；Config 記錄「資源現在與過去的狀態」。兩者互補，合規稽核通常兩個都要。"],concepts:[{term:"Configuration Item (CI)",desc:"某一時刻的資源設定快照。"},{term:"Configuration Recorder",desc:"要記錄哪些資源類型（需指定 IAM role 與 S3 bucket 存放歷史）。"},{term:"Config Rule",desc:"合規規則（Managed / Custom Lambda / 用 Guard 寫的政策）。"},{term:"Remediation",desc:"不合規時自動執行修正（SSM Automation document）。"},{term:"Conformance Pack",desc:"一組規則的集合（可套用 PCI-DSS、CIS 等標準）。"},{term:"Aggregator",desc:"跨帳號 / 跨 Region 彙整合規狀態。"}],interactions:[{to:"s3",dir:"out",how:"設定歷史與快照存到 S3；也能監控 S3 bucket 的合規狀態。"},{to:"cloudtrail",dir:"both",how:"Config 記錄變化，CloudTrail 記錄「是由哪個 API 造成的」。"},{to:"sns",dir:"out",how:"不合規事件通知。"},{to:"systems-manager",dir:"out",how:"Remediation 用 SSM Automation 執行修正。"},{to:"organizations",dir:"in",how:"組織層級規則與 Aggregator 統一管理。"},{to:"guardduty",dir:"both",how:"組態風險 + 行為異常一起看。"},{to:"eventbridge",dir:"out",how:"組態變更事件可觸發自動化流程。"}],settings:[{name:"記錄哪些資源類型",required:!0,warn:!0,desc:"**全部記錄會產生大量費用**，建議只記錄關鍵資源。"},{name:"Delivery channel / S3 bucket",required:!0,desc:"歷史資料的存放位置（需設 lifecycle 控成本）。"},{name:"Config Rules 選擇",desc:"從受管規則開始，再寫自訂規則。"},{name:"Remediation 自動修復",warn:!0,desc:"自動修復很強但可能誤刪資源，先在測試帳號驗證。"},{name:"Aggregator（跨帳號）",desc:"多帳號組織的合規總覽。"},{name:"Conformance packs",desc:"一次套用整套標準（CIS、PCI-DSS）。"},{name:"S3 bucket 的 lifecycle",warn:!0,desc:"Config 的歷史資料會一直成長。"}],pricing:{model:"**每個組態項目（configuration item）$0.003** + 每個規則的評估費用 + S3 / SNS 費用。",free:"免費方案：每個 Region 每帳號 100 個資源的組態記錄（試用期 12 個月）。",rows:[{tier:"組態項目",price:"$0.003 / 項目 / Region",note:"資源多或變更頻繁時成本上升。",level:2},{tier:"Config Rule 評估",price:"$0.001 / 評估（依類型）",note:"規則數與資源數相乘。",level:2},{tier:"Conformance pack",price:"依內含規則",note:"整套標準可能上千個評估。",level:3},{tier:"S3 儲存",price:"依 S3 價格",note:"歷史資料成長需靠 lifecycle。",level:1}],traps:["記錄「所有資源」在大型帳號可能每月數千美元。","規則評估頻率高（例如每分鐘）會讓費用上升。","歷史資料沒有 lifecycle，S3 費用逐年累積。"]},exam:["「**資源設定變更歷史 / 合規檢查**」→ AWS Config。","「**自動修復不合規資源**」→ Config Remediation（SSM Automation）。","「**跨帳號合規總覽**」→ Config Aggregator。","「**誰改的**」→ CloudTrail；「**改成什麼**」→ Config。"],gotchas:["Config 不阻止變更（只是記錄與告警），要阻止得用 SCP 或自動修復。","不支援所有資源類型。","Config 的初次啟用會回溯掃描現有資源，產生一次性大量組態項目費用。"],related:["cloudtrail","cloudwatch","organizations","systems-manager"]},{id:"systems-manager",name:"AWS Systems Manager (SSM)",zh:"營運管理工具箱",category:"monitoring",emoji:"\uD83E\uDDF0",tagline:"不用 SSH 也能管理機器：命令、修補、參數、Session、庫存全部統一。",aliases:["ssm","patch manager","session manager","run command","維運"],intro:["**Systems Manager** 是一整組維運工具，核心是 **SSM Agent**（預裝在 Amazon Linux 等 AMI）：註冊後你就能在不開 SSH port 的情況下管理機器。","最常用的功能：**Session Manager**（瀏覽器 / CLI 開 Shell，有完整稽核）、**Run Command**（對幾百台執行腳本）、**Patch Manager**（自動修補 OS）、**Parameter Store**（設定管理）、**Inventory**（軟體清單）、**Automation**（自動化維運劇本）、**State Manager**（維持機器組態）。","它是「**不需要跳板機與 SSH key**」的關鍵：把機器的 22 port 關掉，改用 Session Manager 才是現代實務。"],concepts:[{term:"Managed Instance",desc:"已註冊 SSM Agent 的機器（EC2 或地端），需要 IAM Instance Profile。"},{term:"Session Manager",desc:"開互動式 shell（Port forwarding 也支援），所有操作可記錄到 S3 / CloudWatch。"},{term:"Run Command",desc:"批次執行文件（Document）中的命令，含輸出與狀態追蹤。"},{term:"Patch Manager",desc:"依 patch baseline 自動修補 OS 與套件，可設定維護窗與合規報告。"},{term:"Automation",desc:"以 Document 定義自動化流程（例如「每月建立加密 AMI」）。"},{term:"State Manager",desc:"持續維持機器的期望狀態（例如常駐某個 agent）。"},{term:"Inventory / Fleet Manager",desc:"收集軟體、網路、Windows registry 等資訊並視覺化。"}],interactions:[{to:"ec2",dir:"both",how:"主要管理對象；需要 Instance Profile（AmazonSSMManagedInstanceCore）才能註冊。"},{to:"ssm-parameter-store",dir:"in",how:"SSM 的參數功能用於設定管理（尤其是 SecureString）。"},{to:"iam",dir:"in",how:"執行個體角色與操作者權限控制。"},{to:"s3",dir:"out",how:"Session 記錄與命令輸出可存到 S3（稽核）。"},{to:"cloudwatch",dir:"out",how:"Session log 與命令執行的 log 可送到 CloudWatch Logs。"},{to:"aws-config",dir:"both",how:"不合規資源可用 SSM Automation 自動修復。"},{to:"kms",dir:"in",how:"Session 加密（KMS）與參數加密。"},{to:"vpc",dir:"in",how:"私有子網的機器要連 SSM 端點：用 NAT 或 Interface Endpoint（`ssm`、`ssmmessages`、`ec2messages`）。"},{to:"eventbridge",dir:"out",how:"維護窗與自動化的狀態事件。"}],settings:[{name:"Instance Profile",required:!0,warn:!0,desc:"沒有 `AmazonSSMManagedInstanceCore` 就不會出現在 Fleet Manager 裡（最常見的設定失敗）。"},{name:"VPC Endpoint / NAT",required:!0,warn:!0,desc:"私有子網沒有對外連線時需要三個 Interface Endpoint，否則機器顯示為 Not connected。"},{name:"Session logging",warn:!0,desc:"建議開啟（S3 + CloudWatch），稽核與調查都靠它。"},{name:"Session timeout / idle",desc:"連線閒置多久中斷（安全與資源考量）。"},{name:"Patch baseline / 維護窗",desc:"決定修補哪些套件、哪些機器、何時執行。"},{name:"State Manager association",desc:"持續套用期望狀態（例如安裝 CloudWatch Agent）。"},{name:"Default Host Management / 自動註冊",desc:"讓所有帳號內的執行個體自動被管理。"}],pricing:{model:"**SSM 本身免費**（含 Session Manager、Run Command、Parameter Store Standard）；但進階功能（Advanced parameters、Automation 步驟、Session 錄影）會依用量計費。",free:"基本功能免費（對大量 EC2 來說這是最划算的維運工具）。",rows:[{tier:"Session Manager / Run Command",price:"免費",note:"取代跳板機與 SSH key。",level:0},{tier:"Patch Manager",price:"免費",note:"雲端修補機制本身不收費。",level:0},{tier:"Parameter Store Standard",price:"免費",note:"Advanced 為 $0.05/參數/月。",level:0},{tier:"Automation 步驟",price:"$0.002 / 步驟（部分類型）",note:"複雜劇本要估算。",level:0},{tier:"Session 錄影儲存",price:"依 S3 / CloudWatch 價格",note:"log 量與保留期決定成本。",level:1}],traps:["Session 錄影長期保存到 S3 卻沒有 lifecycle → 儲存費累積。","Command 輸出量太大時 CloudWatch Logs 費用上升。"]},exam:["「**不開 SSH port 就要能登入機器**」→ Session Manager。","「**對大量機器批次執行修補與腳本**」→ Patch Manager / Run Command。","「**機器沒有出現在 SSM 清單**」→ 檢查 Instance Profile 與對外連線。","「**大規模修補（含 Windows / Linux）**」→ Systems Manager Patch Manager + 維護窗。","「**設定值集中管理（加密）**」→ Parameter Store（SSM 功能）。"],gotchas:["SSM Agent 需要能連到端點（NAT 或 Interface Endpoint）。","Windows 的 Patch Manager 與 Linux 行為不同（需要 WSUS-like baseline 概念）。","Session log 若存 CloudWatch 會產生費用。","地端機器（hybrid）需要 activation code 與額外設定。"],related:["ec2","ssm-parameter-store","cloudwatch","vpc-endpoints","aws-config"]},{id:"trusted-advisor",name:"AWS Trusted Advisor",zh:"最佳實務檢查",category:"monitoring",emoji:"\uD83C\uDF93",tagline:"AWS 幫你體檢帳號：成本、安全、效能、可靠性、配額一鍵檢查。",aliases:["best practice","checks","advisor","檢查"],intro:["**Trusted Advisor** 會檢查你的帳號是否符合 AWS 最佳實務，分五大類：**Cost Optimization**（例如沒有掛載的 EBS、未使用的 Elastic IP）、**Security**（開放 0.0.0.0/0 的 port、root 沒開 MFA）、**Fault Tolerance**、**Performance**、**Service Quotas**。","**所有帳號免費**可看 6–7 個基本的 Security / Service Limits 檢查；**Business / Enterprise Support** 才解鎖全部檢查（約 100+ 項）與 API 存取。","它是「**定期體檢**」而非即時監控：適合每月檢查一次，把清單當成待辦事項。"],concepts:[{term:"Check categories",desc:"Cost / Security / Fault Tolerance / Performance / Service Quotas 五大類。"},{term:"Support tiers",desc:"Basic / Developer 只有基本檢查；Business 以上才有完整檢查與 API。"},{term:"Trusted Advisor Priority",desc:"Enterprise Support 專屬：AWS 主動通知最關鍵的建議。"},{term:"Organizations 整合",desc:"可集中查看所有帳號的檢查結果。"}],interactions:[{to:"cost-explorer",dir:"both",how:"Trusted Advisor 找出「浪費」，Cost Explorer 分析「花在哪」。"},{to:"iam",dir:"in",how:"檢查 root MFA、IAM 使用狀況等安全性項目。"},{to:"s3",dir:"in",how:"檢查 bucket 的公開存取與版本設定。"},{to:"ec2",dir:"in",how:"檢查未掛載的 EBS、未使用的 Elastic IP、安全群組開放 port。"},{to:"cloudwatch",dir:"out",how:"可用 CloudWatch 檢視 Trusted Advisor 指標（Business 以上）。"},{to:"organizations",dir:"in",how:"集中檢視所有帳號的檢查結果。"}],settings:[{name:"Support plan",required:!0,desc:"Business / Enterprise 才有完整檢查（$100/月起）。"},{name:"Check 的排除項目",desc:"可排除特定資源（例如刻意公開的 S3 bucket）。"},{name:"每週狀態報告 Email",desc:"Business 以上可訂閱。"},{name:"Service Quotas 檢視",desc:"檢查接近上限的配額，避免擴展時卡住。"},{name:"Organizations view",desc:"管理帳號可看全部成員帳號的檢查。"}],pricing:{model:"**Trusted Advisor 本身免費**；但完整檢查需要 **Business Support（$100/月起，依用量計價）**。",free:"Basic / Developer 有 7 項核心檢查（含 Service Limits 與部分 Security 檢查）。",rows:[{tier:"Basic 檢查（7 項）",price:"免費",note:"所有帳號都有。",level:0},{tier:"Business Support",price:"$100 / 月起（或 10% 用量）",note:"解鎖完整檢查 + 24×7 技術支援。",level:3},{tier:"Enterprise Support",price:"$15,000 / 月起",note:"TAM + Trusted Advisor Priority。",level:5}],traps:["為了 Trusted Advisor 完整檢查買 Business Support，但沒有真的每週看報告。","忽略 Service Quotas 檢查，擴展時才發現配額不足。"]},exam:["「**免費的安全與成本檢查清單**」→ Trusted Advisor。","「**接近服務配額上限的警告**」→ Trusted Advisor Service Quotas（或 Service Quotas 服務）。","「**完整檢查需要 Business 以上支援**」是常考細節。","「**成本分析（精細）**」→ Cost Explorer（Trusted Advisor 只找浪費）。"],gotchas:["檢查結果不是即時（每天更新）。","Business Support 費用依 AWS 用量計算（可能遠高於 $100）。","建議要人工判斷：有些「浪費」其實是刻意設計。"],related:["cost-explorer","iam","s3","organizations"]}];var s$=[{id:"athena",name:"Amazon Athena",zh:"S3 上的互動式 SQL 查詢",category:"analytics",emoji:"\uD83D\uDD0E",tagline:"不用架資料庫，直接對 S3 上的檔案下 SQL——查一次付一次。",aliases:["sql","serverless query","presto","資料湖查詢"],intro:["**Athena** 是無伺服器的查詢引擎（基於 Presto / Trino）：你定義表格（schema on read），用標準 SQL 查 S3 上的 CSV / JSON / Parquet / ORC 檔案，**只為掃描的資料量付費**。","搭配 **Glue Data Catalog** 當 metastore，就能查詢資料湖；搭配 S3 的分區（partition）與欄式格式（Parquet + 壓縮），成本可降低 90% 以上。","它適合「偶爾查一下」「log 分析」「BI 報表的後端」；需要極高效能與複雜 JOIN 的固定報表還是 [[redshift|Redshift]] 更合適。"],concepts:[{term:"Schema on read",desc:"資料匯入時不處理，查詢時才套用 schema（因此 schema 錯就查不到）。"},{term:"Glue Data Catalog",desc:"存放表格定義（database / table / partition），是 Athena 預設的 metastore。"},{term:"Partitioning",desc:"目錄結構如 `year=2026/month=09/`，查詢時自動只掃描必要分區（最重要的成本控制）。"},{term:"Parquet / ORC + Snappy",desc:"欄式格式 + 壓縮，掃描量可減少 80–95%。"},{term:"CTAS / INSERT INTO",desc:"用 `CREATE TABLE AS SELECT` 把查詢結果轉成 Parquet 落地，加速後續查詢。"},{term:"Workgroup",desc:"隔離查詢群組並設定資料掃描上限（防止某人把預算查爆）。"}],interactions:[{to:"s3",dir:"in",how:"資料來源（也是結果輸出位置）；查詢結果通常寫回專用 bucket。"},{to:"glue",dir:"both",how:"Glue Crawler 建立 Data Catalog 表格與分區；Athena 使用它查詢。"},{to:"lake-formation",dir:"in",how:"欄位層級與資料列的權限治理（fine-grained access control）。"},{to:"quicksight",dir:"out",how:"BI 報表以 Athena 為資料來源。"},{to:"cloudtrail",dir:"in",how:"查詢 CloudTrail log（安全事件調查的標準做法）。"},{to:"data-firehose",dir:"in",how:"Firehose 交付到 S3 的串流資料可直接被查詢。"},{to:"redshift",dir:"both",how:"Redshift Spectrum 與 Athena 在資料湖上角色重疊，依使用習慣選擇。"},{to:"kms",dir:"in",how:"加密的資料需要 KMS 權限才能查詢。"}],settings:[{name:"Query result location（S3）",required:!0,warn:!0,desc:"**必填**：每次查詢結果都會寫到這個 bucket（會累積，要設 lifecycle）。"},{name:"Data format & compression",required:!0,warn:!0,desc:"CSV 直接查的成本是 Parquet 的 10–100 倍，格式是最大的成本槓桿。"},{name:"Partition 設計",warn:!0,desc:"依常用查詢條件分區（日期、region）；分區太細會有很多小檔案反而變慢。"},{name:"Workgroup 與 bytes-scanned cutoff",desc:"設定每次查詢掃描上限，避免誤查整個資料湖。"},{name:"Encryption / KMS",desc:"查詢結果也可加密。"},{name:"Athena for Apache Spark",desc:"需要更複雜的 ETL / 程式化處理時使用（另計費）。"},{name:"Federated Query",desc:"透過 connector 查詢 RDS / DynamoDB / Redshift 等外部來源。"}],pricing:{model:"**每次查詢掃描的資料量 $5/TB**（最低 10 MB/查詢）+ S3 儲存費。取消的查詢不用付。",free:"沒有免費額度（但小量查詢很便宜）。",rows:[{tier:"資料掃描",price:"$5 / TB",note:"1 GB 查詢約 $0.005，看起來便宜但重複查詢會累積。",level:1},{tier:"S3 儲存（資料 + 查詢結果）",price:"依 S3 價格",note:"查詢結果是隱形成本。",level:1},{tier:"Athena for Spark",price:"依 DPU 小時",note:"$0.44 / DPU-小時。",level:3},{tier:"Glue Data Catalog",price:"前 100 萬物件免費",note:"超過後 $1/10 萬物件。",level:0}],traps:["用 CSV 而不是 Parquet → 帳單可能是別人的 20 倍（最常見的錯誤）。","沒有分區，`WHERE date = ...` 還是掃全表。","BI 工具每次都重新掃描（應該用 CTAS 落地或搭配 QuickSight 的 SPICE 快取）。","查詢結果 bucket 沒設 lifecycle → 儲存費慢慢成長。","`SELECT *` 在欄式格式下依然只掃描存在的欄位，但在 CSV 上是全掃（所以格式決定一切）。"]},cli:["aws athena start-query-execution --query-string \\",'  "SELECT status, count(*) FROM alb_logs WHERE year=2026 AND month=09 GROUP BY status" \\',"  --result-configuration OutputLocation=s3://my-athena-results/","aws athena get-query-execution --query-execution-id $ID","aws athena get-query-results --query-execution-id $ID"],exam:["「**直接查 S3、不用架資料庫、按查詢付費**」→ Athena。","「**降低 Athena 成本**」→ Parquet + 壓縮 + 分區（三個關鍵字必寫）。","「**查 CloudTrail / ALB / VPC Flow Logs**」→ Athena（經典考題）。","「**欄位層級權限**」→ Lake Formation。","「**需要固定高效能與併發 BI**」→ Redshift。"],gotchas:["Athena 是 schema-on-read：schema 錯會回傳錯誤結果而不是報錯（CSV 特別危險）。","不支援 transaction / update（只能覆寫整個分區）。","小檔案很多會拖慢查詢（查詢啟動開銷）。","CTAS 是產生 Parquet 的最佳方式，但會產生資料副本（要管理儲存）。"],related:["s3","glue","quicksight","lake-formation","redshift"]},{id:"glue",name:"AWS Glue",zh:"無伺服器 ETL 與資料目錄",category:"analytics",emoji:"\uD83E\uDDF4",tagline:"抽出、轉換、載入：把雜亂資料整理成可分析的表，還幫你維護資料目錄。",aliases:["etl","crawler","data catalog","spark","資料目錄"],intro:["**AWS Glue** 是無伺服器的 ETL 服務：**Crawler** 自動掃描資料來源推斷 schema 並寫入 **Data Catalog**；**Jobs**（Apache Spark 或 Python Shell）負責轉換資料；**Workflows / Triggers** 做排程與依賴管理。","**Glue Data Catalog** 是 AWS 分析生態的中央 metastore：[[athena|Athena]]、[[redshift|Redshift]] Spectrum、[[emr|EMR]] 都共用它。","另外有 **Glue Studio**（視覺化編輯）、**Glue DataBrew**（無程式碼資料清理）、**Glue Data Quality**（資料品質規則），以及 **Glue Streaming ETL**（處理 Kinesis / Kafka）。"],concepts:[{term:"Crawler",desc:"掃描資料來源（S3 / JDBC / DynamoDB）自動建立或更新表格定義與分區。"},{term:"Data Catalog",desc:"中繼資料儲存（database / table / schema / partition）。"},{term:"Job（Spark / Python Shell / Ray）",desc:"實際執行轉換的工作；Spark 適合大規模，Python Shell 適合輕量。"},{term:"DPU",desc:"Data Processing Unit，Glue 的計費與容量單位（1 DPU = 4 vCPU + 16 GB）。"},{term:"Bookmark",desc:"記錄已處理的資料位置，避免重複處理（增量 ETL 的關鍵）。"},{term:"DynamicFrame",desc:"Glue 的資料結構（類似 DataFrame 但可容忍 schema 不一致）。"}],interactions:[{to:"s3",dir:"both",how:"最常見的來源與目的地；Crawler 掃描 S3、Job 讀寫 S3。"},{to:"athena",dir:"out",how:"Athena 使用 Glue Data Catalog 的表格定義。"},{to:"redshift",dir:"both",how:"ETL 結果寫入 Redshift；也可從 Redshift 讀取。"},{to:"rds",dir:"in",how:"透過 JDBC 連線讀取關聯式資料庫（或用 DMS 做持續複寫）。"},{to:"emr",dir:"both",how:"需要更複雜 / 更省成本的大規模 Spark 時用 EMR（Glue 較省事）。"},{to:"kinesis-data-streams",dir:"in",how:"Glue Streaming ETL 消費串流資料。"},{to:"lake-formation",dir:"in",how:"權限與治理（表格與欄位的存取控制）。"},{to:"quicksight",dir:"out",how:"整理後的資料供 BI 使用。"},{to:"eventbridge",dir:"in",how:"排程或事件觸發 Glue 工作。"}],settings:[{name:"Worker type / DPU 數量",required:!0,warn:!0,desc:"G.1X / G.2X 等規格；設太多浪費，設太少跑很久（時間就是錢）。"},{name:"Job bookmark",warn:!0,desc:"增量處理的關鍵：不開就會每次重跑全部資料。"},{name:"Crawler 排程 / 排除模式",desc:"避免掃到暫存檔（例如 `_SUCCESS`、`.tmp`）。"},{name:"Partition 與 table 更新策略",desc:"分區結構要與查詢模式一致。"},{name:"Connection / VPC 設定",warn:!0,desc:"讀寫 VPC 內資源（RDS、Redshift）需要設定 connection 與子網。"},{name:"Encryption / KMS",desc:"Job 的資料與 Catalog 加密。"},{name:"Retry / Timeout",desc:"失敗重試次數，避免資料管線默默中斷。"},{name:"Glue Data Quality 規則",desc:"對資料做完整性與一致性檢查（例如空值率）。"}],pricing:{model:"**ETL Job 依 DPU-小時**（$0.44 / DPU-小時，最低計費 1 分鐘）、**Crawler 依 DPU-小時**、**Data Catalog 依物件數**。",free:"沒有免費額度（Data Catalog 前 100 萬物件有一定免費額度）。",rows:[{tier:"ETL Job",price:"$0.44 / DPU-小時",note:"10 DPU 跑 1 小時 = $4.4。",level:2},{tier:"Crawler",price:"$0.44 / DPU-小時（最低 10 分鐘）",note:"頻繁 crawl 會累積。",level:1},{tier:"Data Catalog",price:"$1 / 10 萬物件（超出免費額度）",note:"通常金額小。",level:0},{tier:"DataBrew / Ray",price:"另計（節點小時）",note:"依使用情形。",level:2}],traps:["Job 的 **DPU 設太多** 或程式效率差（沒有 partition pruning）→ 時間與錢一起燒。","Crawler 每小時跑一次卻沒資料變動 → 白花錢。","Glue 不像自建 EMR 可以一直開著，但每次啟動有 1–2 分鐘的暖機成本（短工作不划算）。"]},exam:["「**無伺服器 ETL、Spark、要和 Athena 共用目錄**」→ Glue。","「**自動發現 schema**」→ Glue Crawler。","「**資料目錄（metastore）**」→ Glue Data Catalog。","「**需要持續複寫資料庫（CDC）**」→ DMS；「**批次轉換**」→ Glue。","「**欄位層級權限**」→ Lake Formation。"],gotchas:["Crawler 推斷 schema 可能不準（例如把數字識別成字串），要人工檢視。","Glue Job 的 Spark 調校需要經驗，簡單轉換用 Python Shell 更便宜。","Bookmark 一旦開啟後想重跑歷史資料要手動清除。","每個 Glue 工作的暖機時間約 1 分鐘，短工作成本效率低。"],related:["athena","s3","emr","lake-formation","dms"]},{id:"emr",name:"Amazon EMR",zh:"大數據叢集（Hadoop / Spark）",category:"analytics",emoji:"\uD83D\uDC18",tagline:"需要大量運算的資料處理：Hadoop、Spark、Hive、Presto 一次開好一個叢集。",aliases:["hadoop","spark","hive","big data","叢集"],intro:["**EMR（Elastic MapReduce）** 提供託管的大數據叢集：**Hadoop / Spark / Hive / Presto / HBase / Flink** 等框架，由 EMR 負責開機、佈署與叢集管理。","三種節點：**Master**（管理）、**Core**（運算 + 儲存 HDFS）、**Task**（只有運算，可隨時加減）。搭配 **Spot 實例當 Task 節點**可省 70% 以上，是 EMR 最大的成本優勢。","**EMR Serverless** 讓你不用管叢集大小，直接提交 Spark / Hive 工作——與 Glue 類似但更適合既有 Spark 程式碼搬遷。"],concepts:[{term:"Node types",desc:"Master（可多台做 HA）、Core（有 HDFS 儲存）、Task（無儲存、可中斷）。"},{term:"EMRFS",desc:"讓 EMR 直接使用 S3 當儲存層（取代 HDFS），關掉叢集資料仍在。"},{term:"Transient vs Long-running",desc:"用完即關（省錢）或長期運行（適合互動式查詢）。"},{term:"Instance Fleets",desc:"混合 On-Demand 與 Spot、多種實例類型，提高取得率並降成本。"},{term:"EMR Serverless",desc:"無伺服器版本，以 vCPU-小時 + 記憶體計費。"},{term:"Step / Bootstrap actions",desc:"提交工作（Step）與啟動時的初始化腳本（Bootstrap）。"}],interactions:[{to:"s3",dir:"both",how:"主要儲存層（EMRFS）：輸入、輸出、log、HDFS 替代品。"},{to:"ec2",dir:"in",how:"叢集底層就是 EC2；可用 Spot 大幅降低成本。"},{to:"glue",dir:"both",how:"共用 Glue Data Catalog 作為 metastore。"},{to:"redshift",dir:"both",how:"處理後的資料載入 Redshift 做報表。"},{to:"kinesis-data-streams",dir:"in",how:"Spark Streaming / Flink 消費串流。"},{to:"msk",dir:"in",how:"Kafka 資料源常見於 EMR 處理。"},{to:"athena",dir:"both",how:"兩者都可查 S3；EMR 適合大量轉換，Athena 適合臨時查詢。"},{to:"auto-scaling",dir:"in",how:"EMR Managed Scaling 依工作負載自動調整 Task 節點。"}],settings:[{name:"Instance type / Fleet 設定",required:!0,warn:!0,desc:"記憶體密集型工作（Spark shuffle）需要記憶體較大的規格。"},{name:"Spot 比例與策略",warn:!0,desc:"Task 節點用 Spot 可省 70%；Core 節點若用 Spot 要容忍中斷。"},{name:"EMRFS consistent view",desc:"舊功能；現在 S3 已強一致性，多數情況不需要。"},{name:"叢集規模與 auto scaling",desc:"Managed Scaling 依 YARN 指標自動增減 Task 節點。"},{name:"Logging / Debugging",desc:"log 存 S3；沒有 log 很難排查工作失敗。"},{name:"Security configuration（Kerberos / 加密）",desc:"EMRFS 加密（SSE-S3 / SSE-KMS / CSE）與傳輸加密。"},{name:"Bootstrap actions",desc:"安裝額外套件或自訂設定（每次啟動執行）。"}],pricing:{model:"**EMR 服務費 = 每小時每節點（依實例類型階梯，約 EC2 價格的 10–30%）+ EC2 / EBS 費用**；EMR Serverless 依 vCPU-小時。",free:"沒有免費額度（新帳號有試用點數）。",rows:[{tier:"EMR 服務費（m5.xlarge）",price:"約 $0.048 / 小時 / 節點",note:"再加 EC2 的 $0.192。",level:3},{tier:"EMR 服務費（r5.4xlarge）",price:"約 $0.27 / 小時 / 節點",note:"大規格成本高但效率也高。",level:4},{tier:"Task 節點用 Spot",price:"省 60–70%",note:"加總 EC2 成本最有效的作法。",level:1},{tier:"EMR Serverless",price:"$0.0526 / vCPU-小時 + $0.0059 / GB-小時",note:"免管理但單價較高。",level:3}],traps:["**忘記關閉叢集**是 EMR 最常見的燒錢方式（長時間 idle 也照收）。","用 On-Demand 跑 Task 節點 → 比 Spot 貴三倍。","HDFS 當主要儲存，關掉叢集資料就消失（應該用 S3 / EMRFS）。","Master 開太大規格（管理節點不需要那麼多資源）。"]},exam:["「**大規模 Spark / Hadoop 處理、可容忍中斷**」→ EMR + Spot Task 節點。","「**資料處理完就要關掉省成本**」→ Transient cluster（用完即關）。","「**不想管叢集但要跑 Spark**」→ EMR Serverless（或 Glue）。","「**HDFS 取代方案**」→ EMRFS + S3。","「**EMR 的 metastore**」→ Glue Data Catalog。"],gotchas:["Core 節點若被 Spot 中斷，HDFS 資料可能遺失（要用 S3 當儲存）。","EMR 版本與框架版本互相綁定，混用要注意相容性。","啟動時間 5–10 分鐘，短工作用 Serverless 或 Glue 更適合。","EMR 的服務費與 EC2 費分開列在帳單上，容易低估。"],related:["glue","s3","ec2","redshift","msk"]},{id:"msk",name:"Amazon MSK",zh:"託管 Apache Kafka",category:"analytics",emoji:"\uD83E\uDEB6",tagline:"Kafka 生態的託管版：開源相容、可自控 Broker 設定，但不用自己維運。",aliases:["kafka","streaming","broker","kafka connect"],intro:["**MSK（Managed Streaming for Apache Kafka）** 提供相容的 Kafka 叢集：資料生產者與消費者使用標準 Kafka API，你可以把既有 Kafka 應用直接搬過來。","它與 [[kinesis-data-streams|Kinesis]] 的差別：MSK 適合**已經使用 Kafka 生態**（Kafka Connect、KSQL、MirrorMaker、Schema Registry）或需要 Kafka 特定功能的團隊；Kinesis 勝在零維運、與 AWS 服務整合更緊密。","**MSK Serverless** 免管理容量（依用量計費）；一般 MSK 則讓你選 broker 規格與數量、控制 partition 與 replication factor。"],concepts:[{term:"Broker / Cluster",desc:"broker 是 Kafka 節點，一個叢集多個 broker（跨 AZ）。"},{term:"Topic / Partition / Replication",desc:"Kafka 的基本概念；replication factor 決定容錯。"},{term:"MSK Serverless",desc:"自動調整容量，依資料量與 partition 數計費。"},{term:"MSK Connect",desc:"託管的 Kafka Connect，用來把資料搬到 S3 / OpenSearch / RDS 等。"},{term:"MSK Configurations",desc:"自訂 Kafka 設定（例如 retention、log segment）。"},{term:"IAM / SASL / TLS",desc:"三種存取控制方式，IAM 是與 AWS 整合最順的做法。"}],interactions:[{to:"s3",dir:"both",how:"MSK Connect 或 Firehose 把 Kafka 資料落地到 S3。"},{to:"lambda",dir:"out",how:"Lambda 可作為 Kafka 消費者（Event Source Mapping）。"},{to:"emr",dir:"out",how:"EMR 上的 Spark Streaming 消費 Kafka 資料做處理。"},{to:"opensearch",dir:"out",how:"MSK Connect 把資料寫進 OpenSearch 做搜尋與分析。"},{to:"vpc",dir:"in",how:"叢集建在 VPC 內，用 Security Group 與子網控制存取。"},{to:"kinesis-data-streams",dir:"both",how:"取代或共存（依團隊技術棧選擇）。"},{to:"cloudwatch",dir:"out",how:"Broker 指標（CPU、磁碟、UnderReplicatedPartitions）。"},{to:"kms",dir:"in",how:"靜態加密與 TLS 傳輸加密。"}],settings:[{name:"Cluster type（Provisioned / Serverless）",required:!0,desc:"Serverless 省事但功能有部分限制與單價考量。"},{name:"Broker instance type / 數量",required:!0,warn:!0,desc:"每個 AZ 至少一個 broker；3 broker 是常見的高可用起點。"},{name:"Storage (EBS) per broker",warn:!0,desc:"決定訊息保留時間；保留越久需要的儲存越大。"},{name:"Replication factor / min.insync.replicas",warn:!0,desc:"資料可靠性與寫入延遲的取捨（通常 3 與 2）。"},{name:"Authentication（IAM / SASL / TLS）",warn:!0,desc:"**預設沒有加密與驗證**，建立時就要選對，之後無法更改。"},{name:"Auto scaling / tiered storage",desc:"新增 broker 或使用分層儲存降低長期成本。"},{name:"Monitoring level",desc:"BASIC / PER_BROKER / PER_TOPIC_PER_PARTITION（指標費用不同）。"}],pricing:{model:"**Provisioned**：broker 執行個體小時 + EBS 儲存。**Serverless**：依 partition 小時 + 資料傳輸。",free:"沒有免費額度。",rows:[{tier:"kafka.m5.large broker",price:"約 $0.21 / 小時（3 台約 $460/月）",note:"高可用的最低配置成本。",level:4},{tier:"EBS 儲存",price:"$0.10 / GB-月 × broker 數",note:"3 broker 就是三倍。",level:2},{tier:"MSK Serverless",price:"約 $0.75 / partition-小時（有最低消費）",note:"partition 多成本高。",level:4},{tier:"資料傳輸",price:"$0.09 / GB 起（跨 AZ / 跨區）",note:"Kafka 的 replication 會產生跨 AZ 流量。",level:2}],traps:["Broker 與 EBS 是**固定成本**（24×7 計費），小流量用 Kinesis 更便宜。","Kafka replication 產生跨 AZ 流量費（很容易被忽略）。","Partition 設計過多會讓成本與管理複雜度上升。"]},exam:["「**需要 Kafka 相容、Kafka 生態**」→ MSK。","「**不需要自己管 broker、AWS 整合優先**」→ Kinesis。","「**Kafka → S3 / OpenSearch**」→ MSK Connect。","「**MSK 預設無加密**」——建立時要選對驗證與加密設定。"],gotchas:["無法像自建 Kafka 那樣完全自由調整所有 broker 參數（有部分限制）。","升級 Kafka 版本不支援降級。","跨 AZ 流量與 replication 成本要估算。","Serverless 模式不支援所有 Kafka 功能（例如某些 topic 設定）。"],related:["kinesis-data-streams","data-firehose","emr","managed-flink"]},{id:"managed-flink",name:"Amazon Managed Service for Apache Flink",zh:"即時串流處理（原 Kinesis Data Analytics）",category:"analytics",emoji:"\uD83C\uDF2A️",tagline:"用 SQL 或 Flink 程式在串流上做視窗聚合、即時告警與 ETL。",aliases:["kinesis analytics","flink","stream processing","即時分析"],intro:["**Managed Service for Apache Flink** 讓你對串流資料做**持續運算**：視窗聚合（每 5 分鐘統計）、模式偵測、串流 JOIN、即時 ETL，並把結果寫到 S3 / Redshift / Lambda / OpenSearch。","支援 **SQL**（適合簡單聚合）與 **Apache Flink 應用程式**（Java / Scala / Python，適合複雜邏輯與 stateful 處理）。","它常見的替代與搭配：輕量交付用 [[data-firehose|Firehose]]，批次用 [[glue|Glue]] / [[emr|EMR]]，串流運算本身用本服務或 EMR 上的 Spark Streaming。"],concepts:[{term:"Application",desc:"一個 Flink 應用（含 KDA SQL 應用或 Flink JAR），有 input 與 output。"},{term:"KPU",desc:"Kinesis Processing Unit：1 vCPU + 4 GB 記憶體的計費單位（1 KPU 起）。"},{term:"Window",desc:"Tumbling（不重疊）、Sliding（滑動）、Session（依活動分組）視窗。"},{term:"Checkpoint / State",desc:"Flink 的狀態快照，支援容錯與恢復（存 S3）。"},{term:"Studio Notebook",desc:"互動式開發環境（Zeppelin），可即時預覽串流結果。"}],interactions:[{to:"kinesis-data-streams",dir:"in",how:"最主要的輸入來源。"},{to:"msk",dir:"in",how:"也支援 Kafka 作為來源 / 目的地。"},{to:"s3",dir:"out",how:"結果輸出與 checkpoint 存放位置。"},{to:"lambda",dir:"out",how:"輸出到 Lambda 做後續動作（或直接產生告警）。"},{to:"redshift",dir:"out",how:"即時聚合結果灌進倉儲。"},{to:"cloudwatch",dir:"out",how:"應用指標（input/output records、延遲、checkpoint 失敗）。"},{to:"data-firehose",dir:"both",how:"簡單交付用 Firehose；需要運算才用 Flink。"},{to:"dynamodb",dir:"out",how:"即時查詢結果或狀態存放。"}],settings:[{name:"Runtime（SQL / Flink / Zeppelin）",required:!0,desc:"SQL 快速上手；複雜邏輯用 Flink JAR。"},{name:"Parallelism / KPU",warn:!0,desc:"平行度決定吞吐，設太小會 `ReadProvisionedThroughputExceeded`。"},{name:"Source / Sink 設定",desc:"Kinesis 的起始位置（LATEST / TRIM_HORIZON）與 checkpoint 設定。"},{name:"Checkpoint / Snapshot",warn:!0,desc:"開啟後才能從失敗中恢復（並支援應用更新）。"},{name:"Auto scaling",desc:"依 CPU 使用率自動調整 KPU（避免閒置成本）。"},{name:"Logging level",desc:"INFO / WARN / ERROR / DEBUG，debug log 會增加 CloudWatch 成本。"},{name:"VPC 設定",desc:"需要存取 VPC 內資源（RDS、ElastiCache）時設定。"}],pricing:{model:"**每個 KPU 每小時 $0.11**（通常至少 2 KPU 執行，另有備份 / 儲存費用）。",free:"沒有免費額度。",rows:[{tier:"KPU 執行",price:"$0.11 / KPU-小時",note:"2 KPU 一個月約 $160。",level:3},{tier:"Durability / 備份",price:"依 KPU 與儲存",note:"checkpoint 存放 S3 的費用。",level:1},{tier:"Studio Notebook",price:"依 KPU",note:"互動式環境按使用時間計費。",level:2},{tier:"輸出服務費用",price:"依目的地",note:"Kinesis / Lambda / S3 各自計費。",level:1}],traps:["應用開著但沒有資料流（閒置）也照收 KPU 費用。","Parallelism 設太高 → 浪費；設太低 → 資料積壓。","Checkpoint 頻繁會增加 S3 請求與成本。"]},exam:["「**即時串流的視窗聚合 / 持續查詢**」→ Managed Flink（Kinesis Data Analytics）。","「**只要把資料搬去 S3**」→ Firehose（不需運算）。","「**串流 SQL 分析**」→ KDA SQL。","「**需要 Flink 的 stateful 處理**」→ Flink 應用模式。"],gotchas:["SQL 模式功能有限（複雜邏輯要用 Flink）。","應用更新需要 stop with snapshot 再 start，會有一次中斷。","平行度與 shard 數要匹配（每個 shard 由一個 subtask 讀取）。"],related:["kinesis-data-streams","data-firehose","msk","emr","s3"]},{id:"quicksight",name:"Amazon QuickSight",zh:"商業智慧（BI）儀表板",category:"analytics",emoji:"\uD83D\uDCCA",tagline:"拖拖拉拉就做出互動式 BI 儀表板，還能用自然語言問問題。",aliases:["bi","dashboard","visualization","報表"],intro:["**QuickSight** 是無伺服器的 BI 服務：連上資料來源（Athena、RDS、Redshift、S3、SaaS），用拖拉方式建立視覺化與儀表板，並支援 **SPICE**（記憶體內快取引擎，加速查詢並降低對來源的壓力）。","具備 **ML 洞察**（異常偵測、預測、自動生成敘述）與 **Q**（自然語言提問），並可嵌入到自己的應用（Embedded Analytics）。","計費分兩種：**Standard**（個人 / 團隊）與 **Enterprise**（含列層級安全 RLS、VPC 連線、Embedded）。"],concepts:[{term:"Dataset / Analysis / Dashboard",desc:"資料集 → 分析（編輯用）→ 儀表板（分享用，可設唯讀）。"},{term:"SPICE",desc:"Super-fast, Parallel, In-memory Calculation Engine；把資料快取進記憶體（依 GB 計費）。"},{term:"Row-level security (RLS)",desc:"依使用者身分過濾資料列（Enterprise；多租戶儀表板必備）。"},{term:"Embedded Analytics",desc:"把儀表板嵌入自家應用的 iframe，使用者不需要 QuickSight 帳號（依 session 計費）。"},{term:"Refresh schedule",desc:"SPICE 資料的更新排程（頻繁刷新 = 來源系統壓力）。"}],interactions:[{to:"athena",dir:"in",how:"最常見的資料來源（資料湖查詢後即時視覺化）。"},{to:"redshift",dir:"in",how:"資料倉儲的 BI 前端。"},{to:"s3",dir:"in",how:"直接匯入 S3 檔案（或經 Athena）。"},{to:"rds",dir:"in",how:"直接連線關聯式資料庫（或經 SPICE 快取）。"},{to:"glue",dir:"in",how:"使用 Glue Data Catalog 的表格。"},{to:"iam",dir:"in",how:"QuickSight 服務角色與資料來源權限。"},{to:"cognito",dir:"in",how:"嵌入式分析的使用者驗證。"},{to:"sns",dir:"out",how:"異常告警與排程報告通知。"}],settings:[{name:"Edition（Standard / Enterprise）",required:!0,warn:!0,desc:"需要 RLS、VPC 連線、Embedded 就一定要 Enterprise。"},{name:"SPICE vs Direct Query",warn:!0,desc:"SPICE 快但資料有延遲（依刷新排程）；Direct Query 即時但每次都打來源資料庫。"},{name:"Refresh schedule",desc:"與來源系統的負載協調（例如每秒刷新會拖垮 RDS）。"},{name:"Row-level security",desc:"用 dataset 的權限規則對應使用者 / 群組。"},{name:"VPC connection",desc:"Enterprise 才能連 VPC 內的私有資料來源。"},{name:"共享與權限（Viewer / Author / Admin）",desc:"使用者角色決定成本與能力（Author 較貴）。"},{name:"Embedding / 匿名使用者",desc:"嵌入式需要產生 embed URL 與 session 容量評估。"}],pricing:{model:"**每月每使用者授權**（Author / Reader）+ SPICE 容量 + Embedded session 費用。",free:"沒有免費額度（有 30 天試用）。",rows:[{tier:"Enterprise Author",price:"$24 / 使用者 / 月",note:"建置者。",level:2},{tier:"Enterprise Reader",price:"$5 / 使用者 / 月（或按用量）",note:"只看儀表板。",level:1},{tier:"SPICE 容量",price:"$0.38 / GB / 月（Enterprise 要額外買）",note:"大量資料集要估算。",level:2},{tier:"Embedded Analytics",price:"$0.50 / 1,000 sessions（或容量制）",note:"嵌入到自家產品時。",level:2},{tier:"額外 SPICE 用量",price:"依購買容量",note:"自動購買開啟可能超支。",level:2}],traps:["Reader 授權按使用者計費，對外開放儀表板時成本成長很快（考慮 Reader 按用量方案）。","SPICE 容量超用會自動加購（記得設定上限或監控）。","Direct Query 在尖峰時段把來源資料庫打爆。"]},exam:["「**無伺服器 BI、快速上線**」→ QuickSight。","「**儀表板嵌到自家產品**」→ Embedded Analytics（Enterprise）。","「**不同客戶看不同資料**」→ Row-level security。","「**加速查詢並減少來源負載**」→ SPICE。"],gotchas:["Standard 版功能限制多（無 RLS、無 VPC 連線）。","SPICE 有容量上限，資料量大要升級或採 Direct Query。","QuickSight 使用者與 IAM 是兩套身分系統（可整合但需設定）。"],related:["athena","redshift","s3","glue"]},{id:"lake-formation",name:"AWS Lake Formation",zh:"資料湖權限治理",category:"analytics",emoji:"\uD83C\uDFDE️",tagline:"把資料湖的權限管好：表、欄位、資料列層級的精細授權。",aliases:["data lake","governance","fine grained access","資料湖"],intro:["**Lake Formation** 讓你在 S3 資料湖上做**集中式權限管理**：以表格（table）與欄位（column）為單位授權，並支援**資料列層級過濾（row-level）** 與**欄位遮蔽（cell-level）**。","它建立 **Data Lake**（註冊 S3 位置 + 權限模型），並作為 Glue Data Catalog 的權限層：Athena、Redshift Spectrum、EMR 都透過它取得授權。","它也可以用 **Blueprint / Workflow** 自動化建立資料湖（crawler + ETL 一鍵產生）。"],concepts:[{term:"Data Lake Location",desc:"註冊 S3 路徑並接管它的權限（註冊後 IAM 直接存取的權限會被限制）。"},{term:"Permissions",desc:"對 table / column 授權給 IAM 使用者、角色或其他帳號。"},{term:"Data Filters",desc:"資料列層級條件（例如只允許看到 `region=tw` 的資料）與欄位排除。"},{term:"LF-Tags",desc:"用標籤做可擴展的授權（而不是逐一授權每張表）。"},{term:"Blueprints",desc:"自動化建立資料湖的樣板（crawler、ETL、目錄）。"},{term:"Cross-account sharing",desc:"資料湖表格的跨帳號共享（不必複製資料）。"}],interactions:[{to:"s3",dir:"in",how:"資料湖的儲存層，註冊位置後由 Lake Formation 控管存取。"},{to:"glue",dir:"both",how:"Glue Data Catalog 是表格來源；Lake Formation 在其上做授權。"},{to:"athena",dir:"out",how:"查詢時透過 Lake Formation 驗證權限（支援欄位與資料列過濾）。"},{to:"redshift",dir:"out",how:"Spectrum 查詢外部表格時也受相同權限控管。"},{to:"emr",dir:"out",how:"EMR 上的 Spark 讀取資料湖資料需通過授權。"},{to:"iam",dir:"in",how:"以 IAM 身分為授權主體（或 IAM Identity Center 的聯合身分）。"},{to:"cloudtrail",dir:"out",how:"授權與存取變更的稽核。"},{to:"organizations",dir:"both",how:"跨帳號共享資料湖（不需要複製）。"}],settings:[{name:"Data lake location 註冊",required:!0,warn:!0,desc:"註冊後，原本靠 IAM policy 的 S3 存取會被限制（要改用 Lake Formation 授權）——這是常見的「上線後權限突然失效」。"},{name:"Permission model（LF-Tags / Named resources）",desc:"規模大時用 LF-Tags 才能管理。"},{name:"Data filters",desc:"資料列與欄位層級的限制條件。"},{name:"Table / Catalog 的角色",desc:"誰是資料湖管理員（Data Lake Admin）。"},{name:"Cross-account version",desc:"啟用 v3/v4 才能跨帳號共享特定表格。"},{name:"Blueprints",desc:"自動化資料湖建立的取樣與排程。"}],pricing:{model:"**Lake Formation 本身免費**；你付的是底層 S3、Glue Crawler / ETL、Athena 查詢等費用。",free:"免費（僅基礎服務無額外費用）。",rows:[{tier:"Lake Formation",price:"免費",note:"權限治理不收費。",level:0},{tier:"Blueprints（自動 ETL）",price:"依 Glue 費用",note:"產生的 crawler 與 job 要錢。",level:2},{tier:"底層查詢 / 儲存",price:"依服務計價",note:"Athena / S3 費用照舊。",level:2}],traps:["以為免費就大量用 Blueprint 建立資料湖 → Glue crawler 與 Spark job 費用累積。","註冊 S3 位置後忘記調整 IAM policy，導致服務中斷。"]},exam:["「**資料湖的欄位與資料列層級權限**」→ Lake Formation。","「**跨帳號共享資料湖而不複製資料**」→ Lake Formation cross-account。","「**資料湖的中央 metastore**」→ Glue Data Catalog。","「**大規模授權管理**」→ LF-Tags。"],gotchas:["註冊 S3 位置後，IAM 的 S3 直存取可能被覆寫（要理解權限模型）。","只支援 Glue Data Catalog 相容的表格。","跨帳號共享需要設定 resource links 與兩邊權限。"],related:["glue","athena","s3","redshift","organizations"]}];var co=[{id:"sagemaker",name:"Amazon SageMaker",zh:"機器學習平台",category:"ml",emoji:"\uD83E\uDDE0",tagline:"從資料標註、訓練到部署推論，ML 的每一段都有對應的託管工具。",aliases:["ml","training","notebook","endpoint","模型"],intro:["**SageMaker** 是端到端的 ML 平台：**Studio**（Notebook 開發環境）、**Training Jobs**（分散式訓練）、**Endpoints**（即時推論）、**Batch Transform**（批次推論）、**Pipelines**（MLOps 自動化）、**Feature Store**、**Model Monitor**、**Clarify**（偏誤與可解釋性）。","核心價值是「**不用管基礎設施**」：訓練可以按需啟動 GPU 機器、跑完就關；推論則以 endpoint 形式持續服務或做無伺服器化（Serverless Inference）。","它不是單一服務而是一整套：考試常見的關鍵字是 **Ground Truth**（標註）、**Model Registry**（版本管理）、**Autopilot**（自動建模）、**JumpStart**（預訓練模型庫）。"],concepts:[{term:"Training Job",desc:"以容器執行訓練程式，指定 instance type、資料來源（S3）、超參數。"},{term:"Endpoint（Real-time / Serverless / Async）",desc:"即時（常駐）、Serverless（閒置時縮到 0，有冷啟動）、Async（大量非同步推論）。"},{term:"Batch Transform",desc:"對整批資料一次推論，跑完就結束（比常駐 endpoint 便宜）。"},{term:"Pipelines / MLOps",desc:"把資料處理、訓練、評估、部署串成自動化流程（可與 CodePipeline 整合）。"},{term:"Feature Store",desc:"線上 / 線下一致的特徵儲存，避免訓練與推論的特徵不一致。"},{term:"Ground Truth",desc:"資料標註（人力或自動），支援私人工作力或 Mechanical Turk。"},{term:"Model Monitor / Clarify",desc:"監控資料漂移與模型品質；偏誤偵測與可解釋性。"}],interactions:[{to:"s3",dir:"both",how:"訓練資料與模型產出的存放位置（最主要整合）。"},{to:"ecr",dir:"in",how:"自訂訓練 / 推論容器映像放 ECR（SageMaker 拉取）。"},{to:"lambda",dir:"both",how:"Lambda 呼叫 endpoint 或觸發訓練流程；SageMaker 事件也能觸發 Lambda。"},{to:"api-gateway",dir:"out",how:"API Gateway + Lambda 把模型包成 API。"},{to:"cloudwatch",dir:"out",how:"Endpoint 的延遲、錯誤率與資源使用率。"},{to:"step-functions",dir:"both",how:"編排訓練與部署流程（呼叫 SageMaker 工作）。"},{to:"glue",dir:"in",how:"ETL 後的乾淨資料作為訓練輸入。"},{to:"athena",dir:"in",how:"在 S3 上查詢與整理特徵資料。"},{to:"kms",dir:"in",how:"訓練資料與模型的加密（含筆記本加密）。"}],settings:[{name:"Instance type（訓練 / 推論）",required:!0,warn:!0,desc:"GPU 實例很貴（$3+/小時），訓練完要確保會自動停止（`MaxRuntimeInSeconds`）。"},{name:"Endpoint 類型",required:!0,warn:!0,desc:"常駐 endpoint 24×7 計費；間歇流量用 Serverless Inference，批次用 Batch Transform。"},{name:"Auto scaling / 多模型 endpoint",desc:"依流量自動擴縮，或一個 end 保存政策。"],related:["polly","transcribe","lambda","comprehend"]}];var So=[{id:"dms",name:"AWS Database Migration Service (DMS)",zh:"資料庫遷移與持續複寫",category:"migration",emoji:"\uD83D\uDE9A",tagline:"把資料庫搬到 AWS：同質、異質都能搬，還能邊搬邊同步不停機。",aliases:["migration","cdc","replication","資料庫搬遷"],intro:["**DMS** 把資料從來源資料庫搬到目標資料庫：來源可以是地端 Oracle / SQL Server / MySQL / PostgreSQL、其他雲、甚至 S3；目標可以是 [[rds|RDS]]、[[aurora|Aurora]]、[[redshift|Redshift]]、[[dynamodb|DynamoDB]]、[[opensearch|OpenSearch]]、S3 等。","兩種模式：**Full Load**（一次性搬全部）與 **CDC（Change Data Capture）**（持續捕捉變更並即時複寫）。常見做法是「先 Full Load，再 CDC 追平，最後切換應用」——**停機時間可縮到幾分鐘**。","異質資料庫（例如 Oracle → PostgreSQL）的 schema 轉換要靠 **[[sct|Schema Conversion Tool (SCT)]]**，DMS 只負責搬資料，不會幫你把預存程序改寫。"],concepts:[{term:"Replication Instance",desc:"執行複寫工作的 EC2 執行個體（由你選規格；多個任務可共用）。"},{term:"Source / Target Endpoint",desc:"連線設定與憑證；來源需要足夠的讀取權限與 log 存取（例如 Oracle 的 redo log）。"},{term:"Task",desc:"一組「來源 → 目標」的搬移工作，可選 Full load / CDC / 兩者。"},{term:"CDC",desc:"讀取來源的交易記錄（binlog / redo / WAL）持續複寫變更。"},{term:"Homogeneous vs Heterogeneous",desc:"同質（Oracle→Oracle）簡單；異質（Oracle→Aurora）需要 SCT 轉換 schema。"},{term:"DMS Serverless",desc:"免管理容量，自動調整複寫資源（新版本功能）。"}],interactions:[{to:"rds",dir:"both",how:"最常見的目標（同質遷移）；也可作為來源搬到其他平台。"},{to:"aurora",dir:"out",how:"MySQL / PostgreSQL → Aurora 的升級式遷移。"},{to:"redshift",dir:"out",how:"把 OLTP 資料持續複寫到資料倉儲做分析。"},{to:"dynamodb",dir:"out",how:"關聯式 → NoSQL 的遷移（需要重新設計資料模型）。"},{to:"s3",dir:"both",how:"S3 可作為來源或目標（資料湖整合）。"},{to:"ec2",dir:"in",how:"來源若是自建資料庫，DMS 從 EC2 讀取。"},{to:"secrets-manager",dir:"in",how:"endpoint 的密碼管理。"},{to:"cloudwatch",dir:"out",how:"複寫延遲（CDCLatencySource/Target）與任務狀態。"}],settings:[{name:"Migration type",required:!0,warn:!0,desc:"Migrate existing data（Full load）、Replicate ongoing changes（CDC）、或兩者（最常見）。"},{name:"Replication instance class",required:!0,desc:"搬大量資料時需要記憶體較大的規格（CDC 尤其吃資源）。"},{name:"Multi-AZ / 高可用",desc:"正式遷移建議開啟，避免複寫執行個體故障導致中斷。"},{name:"LOB 設定（Full LOB mode）",desc:"大物件（BLOB / CLOB）處理方式，設錯會導致資料截斷。"},{name:"Task 的 table mappings / transformation",desc:"選擇要搬的 schema / table 與欄位轉換規則。"},{name:"Validation",warn:!0,desc:"**建議開啟**：驗證來源與目標資料一致，否則搬完不知道對不對。"},{name:"Target 的準備",warn:!0,desc:"目標的 schema、索引與約束要先處理（搬資料時關掉外鍵可加速）。"},{name:"來源的 log 設定",warn:!0,desc:"CDC 需要開 binlog / supplemental logging，這是最常見的卡點。"}],pricing:{model:"**依複寫執行個體小時費 + 儲存（log 空間）**；DMS Serverless 依 DCU 小時。第一年有免費額度（t2.micro / t3.micro 750 小時）。",free:"免費方案：dms.t2.micro / t3.micro 單一執行個體 750 小時（12 個月）。",rows:[{tier:"dms.t3.micro",price:"約 $0.02 / 小時",note:"小型測試遷移。",level:1},{tier:"dms.c5.2xlarge",price:"約 $0.41 / 小時",note:"大型資料庫遷移（約 $300/月）。",level:3},{tier:"儲存（複寫 log）",price:"$0.10 / GB-月",note:"CDC 過程會產生 log 空間需求。",level:1},{tier:"DMS Serverless",price:"依 DCU 小時",note:"免管理容量。",level:2}],traps:["CDC 追不上來源變更速度 → 延遲持續增加（要看 CDCLatency 指標並升級規格）。","多個任務共用同一個複寫執行個體，資源互相排擠。","遷移完成後忘了刪除複寫執行個體 → 每月持續收費。"]},exam:["「**最小停機時間的資料庫遷移，且要持續同步**」→ DMS + CDC。","「**異質資料庫（Oracle → PostgreSQL）**」→ SCT（schema）+ DMS（資料）。","「**同質資料庫遷移（MySQL → RDS MySQL）**」→ 可用原生工具或 DMS。","「**持續複寫到 Redshift / S3**」→ DMS。","「**DMS 可以幫你改寫預存程序**」是錯的（要 SCT 且常需人工處理）。"],gotchas:["CDC 需要來源資料庫開啟額外記錄功能（Oracle supplemental logging、MySQL binlog）。","DMS 不搬次要物件（stored procedure、trigger、user-defined function）——要 SCT 或手動處理。","大表遷移可能需要拆分以加速（parallel load）。","遷移完成後要記得驗證資料（開啟 Data validation）。"],related:["sct","rds","aurora","redshift","datasync"]},{id:"sct",name:"AWS Schema Conversion Tool (SCT)",zh:"資料庫 Schema 轉換工具",category:"migration",emoji:"\uD83D\uDD27",tagline:"把 Oracle / SQL Server 的 schema 與程式邏輯轉成 PostgreSQL / MySQL 可以跑的樣子。",aliases:["schema conversion","oracle to postgres","異質遷移"],intro:["**SCT** 是桌面工具（也有 DMS Schema Conversion 的雲端版本）：分析來源資料庫，把 schema、索引、檢視表、預存程序、函式與觸發器轉換成目標引擎的語法。","它會產生**評估報告**：哪些物件可以自動轉換、哪些必須人工處理（通常預存程序與商業邏輯是主要工作量）。","典型流程：**SCT 轉 schema → 人工修正 → DMS 搬資料與 CDC → 驗證 → 切換**。"],concepts:[{term:"Assessment report",desc:"自動轉換比例與需要人工處理的項目清單（預估工作量）。"},{term:"Conversion rules",desc:"自訂型別與命名對應（例如 `NUMBER` → `NUMERIC`）。"},{term:"DMS Schema Conversion",desc:"雲端版功能（在 DMS 主控台內執行）。"},{term:"無法自動轉換的物件",desc:"Oracle 的 PL/SQL 套件、SQL Server 的 T-SQL 邏輯通常需人工重寫。"}],interactions:[{to:"dms",dir:"out",how:"SCT 轉 schema，DMS 搬資料——這是異質遷移的標準組合。"},{to:"aurora",dir:"out",how:"最常見的目標（Oracle / SQL Server → Aurora PostgreSQL）。"},{to:"rds",dir:"out",how:"目標可以是 RDS 的任何引擎。"},{to:"redshift",dir:"out",how:"資料倉儲遷移（Teradata / Oracle → Redshift）。"},{to:"s3",dir:"both",how:"評估報告與轉換後的 SQL 腳本可存放於 S3。"},{to:"aurora",dir:"out",how:"Aurora PostgreSQL 的 Babelfish 可直接執行 T-SQL，是減少改寫工作量的重要選項。"}],settings:[{name:"來源 / 目標引擎",required:!0,desc:"支援的組合有限，先確認相容性。"},{name:"Conversion rules / 型別對應",desc:"自訂對應可減少人工修改。"},{name:"專案範圍設定",desc:"選擇 schema / 物件類型（只轉換部分可先試點）。"},{name:"評估報告輸出",desc:"CSV / PDF 報告，用於估算人力與時程。"},{name:"與 DMS 整合的模式",desc:"SCT 可直接建立 DMS 任務（行動計畫）。"}],pricing:{model:"**SCT 桌面版免費**；**DMS Schema Conversion** 依執行個體與用量計費（與 DMS 相同）。",free:"桌面版工具免費下載使用。",rows:[{tier:"SCT（桌面）",price:"免費",note:"只要付執行環境的費用。",level:0},{tier:"DMS Schema Conversion（雲端）",price:"含在 DMS 計費中",note:"依伺服器與用量。",level:2}],traps:["低估人工改寫 PL/SQL 的工作量（自動轉換率常低於 70%）。","沒先做評估就直接開專案，時程嚴重低估。"]},exam:["「**異質資料庫遷移的 schema 轉換**」→ SCT。","「**自動轉換預存程序**」——SCT 可以嘗試，但通常需要人工修改。","「**同質遷移**」不需要 SCT。","「**減少 T-SQL 改寫**」→ Babelfish for Aurora PostgreSQL。"],gotchas:["不同引擎的功能差異大（例如 Oracle 的 `ROWNUM`、序列），轉換後行為可能不同。","效能特性會改變（索引策略要重新評估）。","評估報告是估計值，實際工作量常更高。"],related:["dms","aurora","rds","redshift"]},{id:"application-migration-service",name:"AWS Application Migration Service (MGN)",zh:"伺服器搬遷（原 CloudEndure）",category:"migration",emoji:"\uD83D\uDDA5️",tagline:"把實體機或 VM 整台搬上 AWS：持續複寫資料，切換只要幾分鐘。",aliases:["mgn","cloudendure","lift and shift","rehost"],intro:["**MGN（Application Migration Service）** 做「**Lift and Shift**」搬遷：在來源伺服器安裝 agent，把整台機器（OS、應用、資料）持續複寫到 AWS 的 staging area（低成本 EC2 + EBS）。","需要切換時，從 staging area 啟動測試或正式執行個體，**停機時間通常是幾分鐘**。這是最快、最不需要改程式碼的搬遷方式。","與 [[elastic-disaster-recovery|AWS Elastic Disaster Recovery (DRS)]] 的關係：**MGN 用於一次性搬遷**，**DRS 用於持續的災難復原**；底層技術相同，因此 DRS 的來源伺服器不能同時給 MGN 用。"],concepts:[{term:"Replication Agent",desc:"安裝在來源機器的 agent（Windows / Linux），把區塊層變更傳到 AWS。"},{term:"Staging Area",desc:"AWS 上接收複寫資料的區域（輕量 EC2 + EBS）。"},{term:"Test / Cutover Instance",desc:"從 staging 啟動的執行個體；Test 用於驗證，Cutover 為正式切換。"},{term:"Launch Template",desc:"決定切換後的 instance type、Security Group、子網等。"},{term:"Right-sizing",desc:"依實際使用率建議較小的執行個體降低雲端成本。"}],interactions:[{to:"ec2",dir:"out",how:"切換後產生 EC2 執行個體（含 OS 與應用）。"},{to:"ebs",dir:"out",how:"複寫的磁碟（staging 與切換後的根磁碟 / 資料磁碟）。"},{to:"vpc",dir:"in",how:"staging 與目標執行個體要放在你的 VPC 子網。"},{to:"iam",dir:"in",how:"MGN 的服務角色與 replication agent 權限。"},{to:"direct-connect",dir:"in",how:"大量複寫建議走專線，避免公網壅塞。"},{to:"elastic-disaster-recovery",dir:"both",how:"需求從「搬遷」變成「持續 DR」時改用 DRS（來源伺服器需重新設定）。"},{to:"application-discovery-service",dir:"in",how:"搬遷前的相依性盤點（先知道哪些機器要一起搬）。"}],settings:[{name:"Replication settings（頻寬 / 磁碟）",required:!0,desc:"複寫頻寬上限（避免吃光企業網路）與要複寫的磁碟。"},{name:"Launch template",warn:!0,desc:"instance type、Security Group、子網；決定切換後的規格。"},{name:"Staging area subnet",desc:"staging 資源的放置位置（通常用便宜的執行個體）。"},{name:"Test / Cutover 的時機",warn:!0,desc:"**一定要先測試啟動**再切換，否則正式切換時才發現驅動問題。"},{name:"Post-launch actions",desc:"切換後自動執行驗證（例如 SSM 檢查服務是否啟動）。"},{name:"Right-sizing 建議",desc:"依複寫期間的實際使用率調整規格，避免搬上去後成本暴增。"}],pricing:{model:"**MGN 服務本身免費 90 天**（每個來源伺服器），你要付的是 staging area 的 EC2 / EBS 與切換後的資源費用。",free:"前 90 天免費（每台伺服器）。",rows:[{tier:"MGN 服務費",price:"前 90 天免費，之後 $0.042 / 小時",note:"每台伺服器計。",level:1},{tier:"Staging EC2 / EBS",price:"依實際規格（通常很小）",note:"每台約 $20–50/月。",level:2},{tier:"切換後的 EC2",price:"依目標規格",note:"搬上去之後才是主要成本（要 right-sizing）。",level:3},{tier:"資料傳輸",price:"$0.09 / GB 起（進 AWS 免費）",note:"進 AWS 的複寫流量免費。",level:0}],traps:["搬上去後執行個體規格照搬地端（通常過大）→ 雲端成本居高不下，要做 right-sizing。","Staging area 的資源忘了清理。","沒有先測試切換 → 正式切換時才發現開機失敗。"]},exam:["「**實體機 / VM 整台搬上 AWS，不想改程式**」→ MGN。","「**搬遷停機時間要最短**」→ MGN（持續複寫 + 快速切換）。","「**搬遷前的伺服器相依性盤點**」→ Application Discovery Service。","「**持續的災難復原（不是搬遷）**」→ Elastic Disaster Recovery。"],gotchas:["不支援所有 OS 版本與架構（先查支援清單）。","授權問題（Oracle / Windows 的 BYOL）要另外處理。","DRS 與 MGN 不能共用同一個來源伺服器的複寫（要切換必須重新設定）。"],related:["elastic-disaster-recovery","ec2","ebs","dms"]},{id:"elastic-disaster-recovery",name:"AWS Elastic Disaster Recovery (DRS)",zh:"災難復原（持續複寫）",category:"migration",emoji:"\uD83D\uDE91",tagline:"地端或雲端伺服器持續複寫到 AWS，災難發生時幾分鐘內接手。",aliases:["drs","disaster recovery","dr","rto","rpo","災難復原"],intro:["**DRS（原 CloudEndure Disaster Recovery）** 持續把伺服器（地端實體機 / VM 或雲端 VM）複寫到 AWS 的 staging area，發生災難時用**幾分鐘**啟動復原執行個體。","它的 RPO（資料遺失量）通常是**秒級**、RTO（復原時間）約 **5–20 分鐘**——這是 **Pilot Light / Warm Standby** 等級的策略，但成本遠低於全時雙活。","和備份的差別：備份是「事後還原」（小時到天），DRS 是「**隨時待命的可開機副本**」。"],concepts:[{term:"Source Server",desc:"被保護的伺服器（安裝 replication agent）。"},{term:"Staging Area",desc:"AWS 上的輕量複寫目標（低成本 EC2 + EBS）。"},{term:"Recovery Instance",desc:"災難時啟動的執行個體（可設定 template 決定規格與網路）。"},{term:"Point-in-time recovery",desc:"可選擇復原到過去某個時間點（避免把勒索軟體加密後的資料一起復原）。"},{term:"Drill / Recovery plan",desc:"定期演練（drill）確保真的能復原。"},{term:"Failback",desc:"災難結束後把資料推回來源（支援反向複寫）。"}],interactions:[{to:"ec2",dir:"out",how:"復原時產生 EC2 執行個體。"},{to:"ebs",dir:"out",how:"複寫磁碟與快照。"},{to:"vpc",dir:"in",how:"復原執行個體的子網與 Security Group 需要事先設定。"},{to:"route53",dir:"both",how:"切換時更新 DNS（或用 Global Accelerator / health check 自動切）。"},{to:"aws-backup",dir:"both",how:"備份（還原）與 DRS（接手）是不同的 DR 策略層次，常並用。"},{to:"cloudwatch",dir:"out",how:"複寫延遲與 lag 指標（決定真實 RPO）。"},{to:"application-migration-service",dir:"both",how:"一次性搬遷用 MGN；持續保護用 DRS。"}],settings:[{name:"Replication settings（頻寬、磁碟）",required:!0,desc:"限制複寫頻寬避免影響生產。"},{name:"Staging area subnet / replication server type",desc:"決定複寫成本（用小規格即可）。"},{name:"Launch template / 復原設定",warn:!0,desc:"instance type、Security Group、子網；沒設好復原時會失敗。"},{name:"Point-in-time recovery window",warn:!0,desc:"保留多久的歷史時間點（勒索軟體防護的關鍵）。"},{name:"定期 drill",warn:!0,desc:"**沒有演練過的 DR 等於沒有 DR**——定期啟動測試執行個體。"},{name:"Failback 設定",desc:"災難結束後的資料回推方向。"}],pricing:{model:"**每台來源伺服器每小時 $0.028**（約 $20/月）+ staging area 的 EC2 / EBS 費用。",free:"前 90 天免費試用（每台伺服器）。",rows:[{tier:"DRS 服務費",price:"$0.028 / 小時 / 伺服器（約 $20/月）",note:"100 台約 $2,000/月。",level:3},{tier:"Staging EC2 / EBS",price:"約 $20–40 / 伺服器 / 月",note:"依磁碟大小。",level:2},{tier:"復原執行個體（災難時）",price:"依 EC2 規格",note:"只在災難時才啟動（成本不會常駐）。",level:3},{tier:"資料傳輸（複寫）",price:"進 AWS 免費",note:"出 AWS 才收費。",level:0}],traps:["每台伺服器的固定費用會隨數量線性成長。","複寫頻寬設定過大影響生產網路、過小則 RPO 變長（要監控 lag）。","沒有演練，災難發生時才發現復原設定有誤。"]},exam:["「**RPO 秒級、RTO 分鐘級、地端到 AWS**」→ DRS。","「**r 一次性搬遷**」→ MGN。","「**備份與還原**」→ AWS Backup（RPO 小時級）。","「**最小成本的 DR（只複寫資料）**」→ Pilot Light；「**隨時可接手**」→ Warm Standby / DRS。","「**多 Region 的主動-主動**」→ 多區域架構（成本最高）。"],gotchas:["DRS 是「伺服器層級」的 DR，不會自動處理應用層的相依性與資料庫一致性。","來源伺服器不能同時被 MGN 與 DRS 保護。","RTO 的「幾分鐘」不含 DNS 傳播與人工決策時間。"],related:["application-migration-service","aws-backup","ec2","route53"]},{id:"cloudformation",name:"AWS CloudFormation",zh:"基礎設施即程式碼（IaC）",category:"migration",emoji:"\uD83D\uDCD0",tagline:"用一份 YAML / JSON 定義整個環境，一鍵建立、複製、回復。",aliases:["iac","template","stack","infrastructure as code","基礎設施即程式碼"],intro:["**CloudFormation** 讓你用**宣告式模板**（YAML / JSON）描述想要的資源，CFN 負責算出執行順序、建立、更新與刪除。同一份模板可以在不同帳號 / Region 建立一模一樣的環境。","核心概念是 **Stack**（一組資源的集合）：更新時產生 **Change Set** 讓你先預覽影響，失敗時**自動回復（rollback）**。","進階用法：**Nested Stacks** / **Modules**（重用）、**Stack Sets**（跨帳號跨 Region 部署）、**Drift Detection**（偵測有人手動改過資源）、**CDK**（用程式語言產生模板）、**SAM**（無伺服器專用）。"],concepts:[{term:"Template",desc:"Sections：Parameters、Mappings、Conditions、Resources（唯一必填）、Outputs、Metadata。"},{term:"Stack / Change Set",desc:"Stack 是部署單位；Change Set 是「這次更新會做什麼」的預覽。"},{term:"Stack Sets",desc:"對多個帳號 / 多個 Region 一次部署同一組資源（Organizations 整合）。"},{term:"Nested Stack / Module",desc:"拆解大型模板與重用。"},{term:"Drift",desc:"資源實際設定與模板不一致（有人手動改過）。"},{term:"Rollback / Termination protection",desc:"失敗自動回復；終止保護避免誤刪 stack。"}],interactions:[{to:"ec2",dir:"out",how:"建立執行個體、Security Group、Key Pair 等（最常見的用途）。"},{to:"vpc",dir:"out",how:"整套網路環境（VPC、子網、IGW、NAT、路由表）用模板管理。"},{to:"iam",dir:"out",how:"建立 Role 與 Policy（需要 CFN 服務角色的權限）。"},{to:"s3",dir:"both",how:"模板可存在 S3；也能建立 S3 bucket 與政策。"},{to:"systems-manager",dir:"both",how:"cfn-init / cfn-signal 與 SSM 搭配做開機後設定與驗證。"},{to:"organizations",dir:"in",how:"用 StackSets 在組織內所有帳號部署基線資源（CI/CD 則由外部工具串接）。"},{to:"aws-config",dir:"both",how:"偵測資源漂移與合規。"},{to:"organizations",dir:"in",how:"StackSets 在組織內所有帳號部署基線資源。"}],settings:[{name:"Capabilities（IAM / Named IAM）",required:!0,warn:!0,desc:"模板會建立 IAM 資源時必須明確勾選 `CAPABILITY_IAM`，否則部署會失敗。"},{name:"Rollback configuration",warn:!0,desc:"失敗時的行為（Rollback on failure / 保留狀態以便排查）。"},{name:"Termination protection",desc:"防止誤刪 stack（但也會讓刪除流程卡住，記得先關）。"},{name:"Stack policy",desc:"保護特定資源不被更新時意外取代（例如資料庫）。"},{name:"DeletionPolicy / UpdateReplacePolicy",warn:!0,desc:"`Retain` 可讓資源在 stack 刪除時保留（資料庫、S3 bucket 必設）。"},{name:"Parameters / 動態參考",desc:"用參數與 `resolve:ssm:` 讓模板可重用且不寫死環境值。"},{name:"Drift detection / StackSets 選項",desc:"定期檢查漂移；StackSets 設定 `FailureTolerance` 與並行度。"},{name:"Service role",warn:!0,desc:"讓使用者不需直接擁有建立資源的權限（由 service role 代為執行）。"}],pricing:{model:"**CloudFormation 本身免費**；你只付它建立的資源費用。少數進階功能（Hooks、部分第三方資源）另有計費。",free:"完全免費。",rows:[{tier:"Stack / StackSet / Change Set",price:"免費",note:"沒有限制數量。",level:0},{tier:"建立的資源",price:"依各服務計費",note:"紅色的 stack 也照樣收資源的錢。",level:2},{tier:"CloudFormation Guard / Hooks",price:"免費（部分功能）",note:"合規檢查。",level:0}],traps:["建立失敗的 stack 若沒刪除，部分資源仍會繼續計費。","忘了 `DeletionPolicy: Retain`，刪 stack 時資料庫與 bucket 一起消失（S3 bucket 有資料時刪除會失敗，但資料庫不會）。","模板更新造成資源「取代」（例如改 RDS 的 identifier）→ 資料遺失。"]},cli:["aws cloudformation deploy --template-file stack.yaml --stack-name app \\","  --capabilities CAPABILITY_NAMED_IAM --parameter-overrides Env=prod","aws cloudformation create-change-set --stack-name app --change-set-name v2 \\","  --template-body file://stack.yaml --capabilities CAPABILITY_NAMED_IAM","aws cloudformation describe-stack-drift-detection-status --stack-drift-detection-id $ID"],exam:["「**基礎設施即程式碼、可重複部署**」→ CloudFormation。","「**跨帳號、跨 Region 一次部署**」→ StackSets。","「**有人手動改了資源**」→ Drift detection。","「**用程式語言寫模板**」→ CDK；「**無伺服器應用**」→ SAM。","「
