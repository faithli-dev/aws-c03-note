    <style>
      #boot {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC', sans-serif;
        display: grid;
        place-items: center;
        height: 100vh;
        gap: 14px;
        color: #787774;
        font-size: 14px;
        background: #fff;
      }
      @media (prefers-color-scheme: dark) {
        #boot {
          background: #191919;
          color: #9b9b9b;
        }
      }
      #boot .dot {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        background: linear-gradient(135deg, #ff9900, #ffb84d);
        animation: bootPulse 1.1s ease-in-out infinite;
      }
      @keyframes bootPulse {
        0%,
        100% {
          transform: scale(1) rotate(0deg);
          opacity: 0.85;
        }
        50% {
          transform: scale(1.12) rotate(6deg);
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="dot"></div>
        <div>正在載入 AWS 服務筆記…</div>
      </div>
    </div>
